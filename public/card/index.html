<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>카드깡</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Gothic+A1:wght@700;800&family=Jua&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  :root {
    /* 헤더 아래 ~ 건너뛰기 버튼 위 사이에 팩(카드 폭의 약 1.85배 높이)이 다 들어가게 */
    --vh: 100vh;
    --top: calc(env(safe-area-inset-top, 0px) + 72px);
    --bot: calc(env(safe-area-inset-bottom, 0px) + 78px);
    --avail: calc(var(--vh) - var(--top) - var(--bot));
    --cw: min(60vw, 280px, calc(var(--avail) / 1.95));
    --ch: calc(var(--cw) * 1.4);
    --cy: calc(var(--top) + var(--avail) / 2);
    --font: -apple-system, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --ink: #2b3152;
  }
  @supports (height: 100dvh) { :root { --vh: 100dvh; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; color: var(--ink); font-family: var(--font);
    background: #eef0fb; -webkit-user-select: none; user-select: none; touch-action: none;
  }
  /* 카드 수집 게임 배경: 밝은 파스텔 + 빛줄기 + 경기장 라인 + 떠다니는 반짝이 */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -2;
    background:
      radial-gradient(55% 38% at 50% 52%, rgba(255,255,255,1), rgba(255,255,255,0) 72%),
      conic-gradient(from 200deg at 50% -10%, rgba(255,255,255,0) 0deg, rgba(255,255,255,.55) 8deg, rgba(255,255,255,0) 16deg, rgba(255,255,255,0) 30deg, rgba(255,255,255,.45) 36deg, rgba(255,255,255,0) 44deg, rgba(255,255,255,0) 60deg, rgba(255,255,255,.4) 66deg, rgba(255,255,255,0) 74deg, rgba(255,255,255,0) 360deg),
      radial-gradient(60% 40% at 10% 8%, rgba(170, 196, 255, .9), transparent 70%),
      radial-gradient(60% 40% at 95% 100%, rgba(210, 186, 255, .85), transparent 70%),
      radial-gradient(50% 30% at 100% 30%, rgba(160, 235, 220, .55), transparent 70%),
      linear-gradient(180deg, #dfe6ff 0%, #f3f0ff 50%, #e3edff 100%);
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .55; z-index: -1;
    background:
      radial-gradient(circle at 50% 52%, transparent 0 21vmin, rgba(120, 135, 210, .16) 21vmin calc(21vmin + 2px), transparent calc(21vmin + 3px)),
      radial-gradient(circle at 1px 1px, rgba(90, 100, 170, .14) 1px, transparent 1.6px) 0 0 / 22px 22px;
    -webkit-mask: radial-gradient(80% 70% at 50% 52%, #000, transparent); mask: radial-gradient(80% 70% at 50% 52%, #000, transparent);
  }
  .sparkles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .sparkles i {
    position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #fff; opacity: 0;
    box-shadow: 0 0 10px 3px rgba(150, 180, 255, .8); animation: floatUp linear infinite;
  }
  @keyframes floatUp { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: .9; } 85% { opacity: .7; } 100% { transform: translateY(-38vh) scale(1.1); opacity: 0; } }
  #pedestal {
    position: fixed; left: 50%; top: calc(var(--cy) + var(--ch) * .62); width: calc(var(--cw) * 1.9); height: calc(var(--cw) * .34);
    transform: translate(-50%, -50%); pointer-events: none; z-index: 1; border-radius: 50%;
    transition: opacity .4s;
    background: radial-gradient(closest-side, rgba(110, 120, 220, .28), rgba(140, 150, 230, .12) 55%, rgba(255,255,255,0));
  }
  #pedestal::after {
    content: ""; position: absolute; inset: 12% 8%; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.75); box-shadow: 0 0 22px rgba(130, 160, 255, .55), inset 0 0 18px rgba(130, 160, 255, .4);
  }
  img { -webkit-user-drag: none; }

  /* 상단 바 */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
    padding: max(12px, env(safe-area-inset-top)) 14px 10px;
  }
  .ibtn {
    width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; border: 0; cursor: pointer;
    background: linear-gradient(180deg, #ffffff, #eef1ff); color: #3a4378; text-decoration: none;
    box-shadow: 0 3px 0 #c9cfee, 0 8px 18px rgba(70, 80, 160, .18);
  }
  .ibtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #c9cfee, 0 4px 10px rgba(70, 80, 160, .18); }
  .ibtn svg { width: 22px; height: 22px; }
  .brand { text-align: center; line-height: 1; }
  .brand b {
    display: block; font: 400 clamp(17px, 5.6vw, 22px)/1 'Anton', sans-serif; letter-spacing: 1.5px; white-space: nowrap;
    background: linear-gradient(180deg, #2c4fd8, #1a2a7a); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .brand b em { font-style: normal; background: linear-gradient(180deg, #ffcf4a, #e08a12); -webkit-background-clip: text; background-clip: text; }
  .brand small { display: block; margin-top: 3px; font: italic 800 11px 'Barlow Condensed', sans-serif; letter-spacing: 3px; color: #7a82b8; white-space: nowrap; }
  /* 제목은 떠 있는 버튼이 아니라 헤더: 결과 화면에선 내용과 같이 스크롤되고, 버튼 사이에 자리가 없으면 생략 */
  body.in-sum header .brand { visibility: hidden; }
  #summary .brand { align-self: stretch; min-height: 42px; display: grid; place-content: center; margin-bottom: -6px; }
  @media (max-width: 359px) { .brand { visibility: hidden; } }
  .dexbtn {
    justify-self: end; display: flex; align-items: center; gap: 8px; border: 0; cursor: pointer; padding: 6px 12px 6px 6px; border-radius: 16px;
    background: linear-gradient(180deg, #ffffff, #eef1ff); box-shadow: 0 3px 0 #c9cfee, 0 8px 18px rgba(70, 80, 160, .18); color: var(--ink);
  }
  .dexbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #c9cfee; }
  .dexbtn .ico { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(180deg, #ff8a5c, #f2552c); color: #fff; box-shadow: inset 0 -2px 0 rgba(0,0,0,.15); }
  .dexbtn .ico svg { width: 18px; height: 18px; }
  .dexbtn .txt { text-align: left; line-height: 1.05; }
  .dexbtn .txt b { display: block; font: 800 12px var(--font); }
  .dexbtn .txt span { display: block; font: italic 800 13px 'Barlow Condensed', sans-serif; color: #5a62a0; letter-spacing: .5px; }
  .dexbtn .bar { display: block; width: 54px; height: 4px; border-radius: 4px; background: #dfe3f6; margin-top: 3px; overflow: hidden; }
  .dexbtn .bar i { display: block; height: 100%; background: linear-gradient(90deg, #ffb347, #ff6a3d); border-radius: 4px; width: var(--p, 0%); transition: width .6s; }
  .dexbtn.bump { animation: bump .5s; }
  @keyframes bump { 40% { transform: scale(1.12); } }

  #stage { position: fixed; inset: 0; perspective: 1400px; }
  #stage.shake { animation: shake .5s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake {
    10%, 90% { transform: translate(-2px, 1px); } 20%, 80% { transform: translate(4px, -2px); }
    30%, 50%, 70% { transform: translate(-6px, 3px); } 40%, 60% { transform: translate(6px, -3px); }
  }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

  /* 레어 이상 빛. --gc는 등급 색, 흰빛과 섞어 부드럽게 쓴다.
     열릴 때(#packGlow)는 팩 뒤에서 입구 위로만 새어 나오고, 입구 선(#packLip)은 팩 위에서 빛난다 */
  #packGlow, #packLip { position: fixed; left: 0; top: 0; width: 0; height: 0; pointer-events: none; display: none; }
  #packGlow { z-index: 1; }
  #packLip { z-index: 3; }
  #packGlow.on, #packLip.on { display: block; }
  #packGlow .rays {
    position: absolute; left: calc(var(--gs) * -.5); top: calc(var(--gs) * -.5); width: var(--gs); height: var(--gs);
    -webkit-mask: linear-gradient(to bottom, #000 50%, transparent 50%), radial-gradient(closest-side, #000 0, rgba(0,0,0,.55) 40%, transparent 100%);
    -webkit-mask-composite: source-in; mask-composite: intersect;
    mask: linear-gradient(to bottom, #000 50%, transparent 50%), radial-gradient(closest-side, #000 0, rgba(0,0,0,.55) 40%, transparent 100%);
    animation: glowIn 1s cubic-bezier(.2,.8,.2,1) both;
  }
  #packGlow .rays i {
    position: absolute; inset: 0; filter: blur(7px); animation: sway 7s ease-in-out infinite alternate;
    background: conic-gradient(from -58deg,
      transparent 0deg, color-mix(in srgb, var(--gc) 30%, transparent) 14deg, transparent 26deg,
      color-mix(in srgb, var(--gc) 50%, transparent) 38deg, transparent 49deg,
      color-mix(in srgb, var(--gc) 35%, rgba(255,255,255,.85)) 58deg, transparent 67deg,
      color-mix(in srgb, var(--gc) 50%, transparent) 78deg, transparent 90deg,
      color-mix(in srgb, var(--gc) 30%, transparent) 102deg, transparent 116deg, transparent 360deg);
  }
  @keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
  #packGlow .core {
    position: absolute; left: calc(var(--gs) * -.24); top: calc(var(--gs) * -.07); width: calc(var(--gs) * .48); height: calc(var(--gs) * .14);
    border-radius: 50%; filter: blur(5px);
    background: radial-gradient(closest-side, #fff 0, color-mix(in srgb, var(--gc) 55%, #fff) 35%, color-mix(in srgb, var(--gc) 35%, transparent) 65%, transparent);
    animation: glowIn .6s ease-out both, breathe 2.6s .6s ease-in-out infinite;
  }
  #packGlow .motes { left: calc(var(--gs) * -.16); width: calc(var(--gs) * .32); top: calc(var(--gs) * -.3); height: calc(var(--gs) * .3); }
  @keyframes glowIn { from { opacity: 0; transform: scale(.4); } }
  @keyframes breathe { 50% { transform: scale(1.08); opacity: .85; } }
  #packLip .lip {
    position: absolute; left: calc(var(--lw) * -.5); top: -3px; width: var(--lw); height: 6px; border-radius: 50%;
    background: radial-gradient(closest-side, #fff 0, #fff 45%, color-mix(in srgb, var(--gc) 60%, #fff) 70%, transparent);
    box-shadow: 0 0 14px 3px color-mix(in srgb, var(--gc) 55%, transparent);
    animation: lipFlash .4s ease-out both;
  }
  /* 입구 선은 뜯기는 순간 번쩍하고 바로 사라진다 */
  @keyframes lipFlash { from { opacity: 0; transform: scaleX(.6); } 20% { opacity: 1; transform: none; } to { opacity: 0; } }
  #packGlow.off, #packLip.off { animation: glowOut .7s forwards; }
  @keyframes glowOut { to { opacity: 0; } }

  /* 떠오르는 빛가루 */
  .motes {
    position: absolute; pointer-events: none;
    background:
      radial-gradient(circle, #fff 0 1px, transparent 2px) 0 0 / 37px 53px,
      radial-gradient(circle, color-mix(in srgb, var(--gc) 50%, #fff) 0 1.2px, transparent 2.4px) 18px 21px / 61px 71px;
    -webkit-mask: linear-gradient(to top, #000 10%, transparent), linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent);
    -webkit-mask-composite: source-in; mask-composite: intersect;
    mask: linear-gradient(to top, #000 10%, transparent), linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent);
    animation: rise 3.2s linear infinite;
  }
  @keyframes rise { to { background-position: 0 -53px, 18px -50px; } }

  /* 뜯는 중: 찢어진 구간에서만 빛이 샌다. --p는 뜯은 비율 */
  #packLeak { position: fixed; left: 0; top: 0; height: 0; z-index: 3; pointer-events: none; display: none; transform-origin: 0 0; }
  #packLeak.on { display: block; }
  #packLeak .seam {
    position: absolute; left: 0; right: 0; top: -1.5px; height: 3px; border-radius: 2px; overflow: hidden;
    background: linear-gradient(90deg, transparent, #fff 10%, #fff 90%, transparent);
    box-shadow: 0 0 6px 1px color-mix(in srgb, var(--gc) 60%, #fff), 0 0 calc(10px + 24px * var(--p)) calc(2px + 5px * var(--p)) color-mix(in srgb, var(--gc) 55%, transparent);
    opacity: calc(.55 + .45 * var(--p));
  }
  #packLeak .seam::after {
    content: ''; position: absolute; top: 0; bottom: 0; width: 40%; left: -40%;
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--gc) 40%, #fff), transparent);
    animation: glint 1.6s ease-in-out infinite;
  }
  @keyframes glint { to { left: 100%; } }
  #packLeak .curtain {
    position: absolute; left: 4%; right: 4%; bottom: 0; height: calc(var(--bh) * (.3 + .7 * var(--p)));
    background: linear-gradient(to top, color-mix(in srgb, var(--gc) 45%, rgba(255,255,255,.6)), color-mix(in srgb, var(--gc) 15%, transparent) 45%, transparent);
    -webkit-mask: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); mask: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
    filter: blur(6px); opacity: calc(.4 + .6 * var(--p));
  }
  #packLeak .motes { left: 0; right: 0; bottom: 0; height: calc(var(--bh) * .8); opacity: var(--p); }
  #packLeak.off { animation: glowOut .2s forwards; }

  /* 카드 뒤 빛: 팩이 빠질 때 잠깐 남았다가 사라지고, 레어 이상 카드 뒷면이 맨 위에 오면 다시 켜진다 */
  #cardGlow {
    position: absolute; left: 50%; top: var(--cy); width: var(--cw); height: var(--ch); transform: translate(-50%, -50%);
    z-index: 2; pointer-events: none; opacity: 0; transition: opacity .45s ease-out;
  }
  #cardGlow.on { opacity: 1; }
  #cardGlow.fade { transition: opacity 1.8s ease-in; }
  #cardGlow .halo {
    position: absolute; inset: -12% -16%; border-radius: 28%; filter: blur(16px);
    background: radial-gradient(closest-side, color-mix(in srgb, var(--gc) 65%, #fff) 0, color-mix(in srgb, var(--gc) 45%, transparent) 55%, transparent);
    animation: breathe 2.8s ease-in-out infinite;
  }
  #cardGlow .motes { left: -12%; right: -12%; top: -28%; height: 70%; }
  @keyframes glowOut { to { opacity: 0; } }

  /* 하단 좌우: 소리, 포인트 / 가운데: 5팩 버튼 */
  .mute, .pts {
    position: fixed; bottom: max(22px, env(safe-area-inset-bottom)); z-index: 22; height: 40px; border: 0; border-radius: 14px;
    background: linear-gradient(180deg, #ffffff, #eef1ff); box-shadow: 0 3px 0 #c9cfee, 0 8px 18px rgba(70, 80, 160, .18); color: #3a4378;
  }
  .mute { left: 14px; width: 40px; display: grid; place-items: center; cursor: pointer; padding: 0; }
  .mute svg { width: 20px; height: 20px; }
  .mute .off { display: none; }
  .mute.muted .on { display: none; }
  .mute.muted .off { display: block; }
  .pts { right: 14px; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 7px; font: italic 800 17px 'Barlow Condensed', sans-serif; letter-spacing: .3px; }
  .pts i {
    width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: normal 900 12px var(--font); color: #fff; font-style: normal;
    background: linear-gradient(180deg, #ffcf3a, #f0a020); box-shadow: inset 0 -2px 0 rgba(0,0,0,.15);
  }
  .pts.deny { animation: deny .45s; background: linear-gradient(180deg, #fff, #ffe3e3); color: #e5484d; }
  @keyframes deny { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
  .pts.gain { animation: gain .5s; }
  @keyframes gain { 40% { transform: scale(1.15); } }
  .multi-btn { position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 21; display: none; }
  .multi-btn.btn { position: fixed; }
  .multi-btn.btn:active { transform: translate(-50%, 3px); }
  .free {
    position: fixed; right: 14px; bottom: calc(max(22px, env(safe-area-inset-bottom)) + 48px); z-index: 22; display: none;
    padding: 4px 10px; border-radius: 10px; background: linear-gradient(180deg, #4fd88a, #22a55b); color: #fff;
    font: italic 800 14px 'Barlow Condensed', sans-serif; letter-spacing: 1px; box-shadow: 0 3px 0 #16793f;
  }
  .pack-count {
    position: fixed; right: 14px; top: calc(var(--top) - 4px); z-index: 21; display: none; padding: 5px 10px; border-radius: 10px;
    background: linear-gradient(180deg, #4f7bff, #2a4fd0); color: #fff; font: italic 800 15px 'Barlow Condensed', sans-serif; letter-spacing: 1px;
    box-shadow: 0 3px 0 #1c3a9a;
  }
  .skip {
    position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 21;
    display: none; align-items: center; gap: 6px;
  }
  .skip svg { width: 16px; height: 16px; }
  .skip.btn { position: fixed; }
  .skip.btn:active { transform: translate(-50%, 3px); }

  /* 뜯는 선 가이드 */
  #tearGuide { position: fixed; z-index: 5; height: 0; pointer-events: none; display: none; }
  #tearGuide .line {
    position: absolute; left: 0; right: 0; top: -1.5px; height: 3px; border-radius: 3px;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.95) 0 8px, transparent 8px 14px);
    filter: drop-shadow(0 0 3px rgba(60, 120, 255, .9)) drop-shadow(0 0 8px rgba(60, 120, 255, .6));
    animation: guideFlow .8s linear infinite;
  }
  @keyframes guideFlow { to { background-position: 14px 0; } }
  #tearGuide .finger {
    position: absolute; top: -6px; left: 0; width: 34px; height: 34px; margin-left: -10px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.95) 0 30%, rgba(120, 170, 255, .55) 45%, rgba(120,170,255,0) 70%);
    animation: swipeHint 2s cubic-bezier(.4,0,.3,1) infinite;
  }
  @keyframes swipeHint { 0% { left: -4%; opacity: 0; transform: scale(.6); } 15% { opacity: 1; transform: scale(1); } 75% { left: 100%; opacity: 1; } 100% { left: 100%; opacity: 0; } }
  #tearGuide.nudge .line { animation: guideFlow .8s linear infinite, guidePulse .45s 2; }
  @keyframes guidePulse { 50% { transform: scaleY(2.4); } }


  #rays {
    position: absolute; left: 50%; top: 50%; width: 170vmax; height: 170vmax; margin: -85vmax 0 0 -85vmax;
    background: repeating-conic-gradient(from 0deg, rgba(255, 196, 60, 0) 0deg 7deg, rgba(255, 190, 60, .32) 9deg 11deg, rgba(255,196,60,0) 13deg 20deg);
    -webkit-mask: radial-gradient(circle, #000 0, rgba(0,0,0,.6) 18%, transparent 45%);
            mask: radial-gradient(circle, #000 0, rgba(0,0,0,.6) 18%, transparent 45%);
    opacity: 0; transition: opacity .6s; animation: spin 24s linear infinite; pointer-events: none;
  }
  #rays.epic { filter: hue-rotate(230deg) saturate(1.3); }
  #rays.icon { filter: saturate(.15) brightness(1.35); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- cards ---------- */
  #stack {
    position: absolute; left: 50%; top: var(--cy); width: var(--cw); height: var(--ch); z-index: 3;
    transform: translate(-50%, -50%);
  }
  #stack.hidden { visibility: hidden; }
  #stack .face { transition: box-shadow .5s; }
  #stack.fresh .face { box-shadow: none; }
  .slot { position: absolute; inset: 0; container-type: inline-size; perspective: 1100px; }
  .card3d { position: absolute; inset: 0; transform-style: preserve-3d; }
  .face {
    position: absolute; inset: 0; border-radius: 4.6cqw; overflow: hidden;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    box-shadow: 0 1.5cqw 5cqw rgba(30, 40, 90, .35);
    --gx: 50%; --gy: 50%; --go: 0; --hx: 50%; --hy: 50%;
  }
  .face.second { transform: rotateY(180deg); }
  .paper { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: .5; background-size: 128px; z-index: 8; background-image: var(--paper); }
  .glare {
    position: absolute; inset: 0; pointer-events: none; z-index: 9;
    background: radial-gradient(circle at var(--gx) var(--gy), rgba(255,255,255,.6), rgba(255,255,255,.1) 16%, rgba(255,255,255,0) 34%);
    mix-blend-mode: soft-light; opacity: var(--go);
  }
  .back .glare { display: none; }
  .back img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .slot.hint-rare .back { box-shadow: 0 0 6cqw 2cqw rgba(60, 140, 255, .7), 0 1.5cqw 5cqw rgba(30,40,90,.35); }
  .slot.hint-epic .back { animation: glowEpic 1.3s ease-in-out infinite; }
  .slot.hint-legend .back { animation: glowLegend 1s ease-in-out infinite; }
  .slot.hint-legend .card3d { animation: rumble 2.4s ease-in-out infinite; }
  .slot.hint-icon .back { animation: glowIcon 1.1s ease-in-out infinite; }
  .slot.hint-icon .card3d { animation: rumble 1.8s ease-in-out infinite; }
  @keyframes glowIcon { 0%,100% { box-shadow: 0 0 8cqw 2cqw rgba(225, 235, 255, .8), 0 0 3cqw 1cqw rgba(255, 230, 160, .6); } 50% { box-shadow: 0 0 20cqw 7cqw rgba(235, 242, 255, 1), 0 0 6cqw 2cqw rgba(255, 230, 160, .9); } }
  @keyframes glowEpic { 0%,100% { box-shadow: 0 0 6cqw 1.5cqw rgba(170, 90, 255, .6); } 50% { box-shadow: 0 0 12cqw 4cqw rgba(170, 90, 255, .95); } }
  @keyframes glowLegend { 0%,100% { box-shadow: 0 0 8cqw 2cqw rgba(255, 180, 30, .75); } 50% { box-shadow: 0 0 18cqw 6cqw rgba(255, 190, 40, 1); } }
  @keyframes rumble { 0%, 70%, 100% { translate: 0 0; } 74% { translate: -1.2cqw 0; } 78% { translate: 1.2cqw 0; } 82% { translate: -.8cqw 0; } 86% { translate: .8cqw 0; } }
  .slot.dragging .card3d { animation: none; }

  /* ---------- card front (풀블리드 축구 카드) ---------- */
  .front { background: var(--frame); }
  .front .frame-holo {
    position: absolute; inset: 0; pointer-events: none; mix-blend-mode: color-dodge; opacity: calc(var(--holo, 0) * .7); z-index: 1;
    background: repeating-linear-gradient(115deg, #ff3c8a 0%, #ffb02e 5%, #f9f871 10%, #3dffa4 15%, #3ac8ff 20%, #b35cff 25%, #ff3c8a 30%);
    background-size: 400% 400%; background-position: var(--hx) var(--hy);
  }
  .cf { position: absolute; inset: 2.8cqw; border-radius: 2.8cqw; overflow: hidden; background: var(--c3); z-index: 2; }
  .cf-bg { position: absolute; inset: 0; background: radial-gradient(130% 85% at 50% 32%, color-mix(in srgb, var(--c1) 70%, #fff) 0%, var(--c1) 42%, color-mix(in srgb, var(--c1) 45%, var(--c3)) 100%); }
  .t-legend .cf-bg::after { content: ""; position: absolute; inset: 0; mix-blend-mode: hard-light; opacity: .75;
    background: linear-gradient(160deg, #ffe9a0, #f2b632 45%, #b7790f 75%, #ffd76a); }
  .t-epic .cf-bg::after { content: ""; position: absolute; inset: 0; mix-blend-mode: soft-light; opacity: .7;
    background: linear-gradient(160deg, #f0d6ff, #8b4be0 60%, #3b1a8a); }
  .cf-pat { position: absolute; inset: 0; mix-blend-mode: soft-light; opacity: .95; background: var(--pat); }
  .cf-holo {
    position: absolute; inset: 0; pointer-events: none; mix-blend-mode: color-dodge; opacity: var(--holo, 0);
    background: repeating-linear-gradient(115deg, #ff3c8a 0%, #ffb02e 5%, #f9f871 10%, #3dffa4 15%, #3ac8ff 20%, #b35cff 25%, #ff3c8a 30%);
    background-size: 400% 400%; background-position: var(--hx) var(--hy);
  }
  .cf-big {
    position: absolute; left: -4cqw; right: -4cqw; top: 14%; text-align: center; white-space: nowrap;
    font: 400 46cqw/1 'Anton', sans-serif; color: rgba(255,255,255,.16); transform: rotate(-8deg); letter-spacing: -1cqw;
  }
  .cf-photo {
    position: absolute; left: 50%; bottom: 23%; height: 68%; transform: translateX(-50%); z-index: 1;
    filter: drop-shadow(0 2cqw 3cqw rgba(0,0,0,.45));
  }
  .cf-sparkle {
    position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: var(--spark, 0); mix-blend-mode: screen;
    background-image: radial-gradient(circle, #fff 0 .35cqw, transparent .6cqw), radial-gradient(circle, #fff 0 .25cqw, transparent .5cqw);
    background-size: 9cqw 9cqw, 6cqw 6cqw; background-position: 0 0, 3cqw 4cqw;
    -webkit-mask: radial-gradient(circle at var(--gx) var(--gy), #000, transparent 50%); mask: radial-gradient(circle at var(--gx) var(--gy), #000, transparent 50%);
  }
  /* 소속팀 엠블럼 (public/card/crests/{teamId}.webp, FotMob) */
  .cf-club {
    position: absolute; left: 4cqw; top: 4cqw; z-index: 3; width: 15cqw; height: 15cqw; object-fit: contain;
    /* 리버풀처럼 배경과 같은 색 엠블럼도 보이게 흰 테를 두른다 */
    filter: drop-shadow(0 0 .35cqw #fff) drop-shadow(0 0 .35cqw rgba(255,255,255,.8)) drop-shadow(0 .8cqw 1.4cqw rgba(0,0,0,.45));
  }
  .cf-rate {
    position: absolute; right: 3.4cqw; top: 3.4cqw; z-index: 3; text-align: center; color: #fff;
    background: color-mix(in srgb, var(--c3) 88%, transparent); border-radius: 1.6cqw; padding: 1.2cqw 2.4cqw 1cqw;
    border-bottom: .9cqw solid var(--c2); box-shadow: 0 1cqw 3cqw rgba(0,0,0,.3);
  }
  .cf-rate b { display: block; font: 400 10.5cqw/1 'Anton', sans-serif; letter-spacing: .2cqw; }
  .cf-rate span { display: block; font: 800 3.4cqw/1 'Barlow Condensed', sans-serif; letter-spacing: .5cqw; margin-top: .6cqw; opacity: .9; }
  .cf-plate-wrap {
    position: absolute; left: 0; right: 0; bottom: 0; height: 29%; z-index: 3;
    background: var(--c2); clip-path: polygon(0 12%, 100% -1%, 100% 100%, 0 100%);
  }
  .cf-plate {
    position: absolute; inset: 1.3cqw 0 0 0; padding: 5.4cqw 4.2cqw 0;
    background: linear-gradient(180deg, var(--c3), color-mix(in srgb, var(--c3) 65%, #000));
    clip-path: polygon(0 12%, 100% 0, 100% 100%, 0 100%);
  }
  .cf-first { font: 700 3.8cqw/1 'Barlow Condensed', sans-serif; letter-spacing: .5cqw; text-transform: uppercase; color: rgba(255,255,255,.72); min-height: 3.8cqw; }
  .cf-last {
    font: italic 800 var(--lfs, 9.5cqw)/.95 'Barlow Condensed', sans-serif; text-transform: uppercase; color: #fff;
    letter-spacing: .3cqw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 1cqw;
    text-shadow: 0 .3cqw .4cqw rgba(0,0,0,.45);
  }
  .cf-meta { margin-top: 1.2cqw; font: 700 3.1cqw 'Gothic A1', var(--font); color: rgba(255,255,255,.72); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cf-foot {
    position: absolute; left: 4.2cqw; right: 4.2cqw; bottom: 2.6cqw; display: flex; align-items: center; justify-content: space-between;
    font: 700 3cqw 'Barlow Condensed', sans-serif; letter-spacing: .3cqw; color: rgba(255,255,255,.55);
  }
  .cf-tier {
    font: italic 800 3.1cqw 'Barlow Condensed', sans-serif; letter-spacing: .6cqw; color: #1a1a1a; padding: .3cqw 2cqw; border-radius: .6cqw;
    background: var(--stamp); transform: skewX(-10deg); box-shadow: 0 .4cqw 1cqw rgba(0,0,0,.3);
  }
  /* ---------- 에픽·레전드: 사진을 크게, 아래에 이름만 ---------- */
  .front.hero { isolation: isolate; }
  .front.hero .aura {
    position: absolute; left: 50%; top: 50%; width: 160%; aspect-ratio: 1; translate: -50% -50%; z-index: 0; pointer-events: none;
    background: conic-gradient(from 0deg, transparent 0 6%, var(--aura1) 14%, #fff 20%, var(--aura2) 26%, transparent 38% 56%, var(--aura1) 64%, #fff 70%, var(--aura2) 76%, transparent 88%);
    animation: auraSpin 3.2s linear infinite;
  }
  @keyframes auraSpin { to { rotate: 360deg; } }
  .t-legend { --aura1: #ffd34a; --aura2: #ff9a1f; --glow: rgba(255, 196, 50, .85); --stroke: #6b3a00; }
  .t-epic { --aura1: #c58bff; --aura2: #ff7ad9; --glow: rgba(176, 100, 255, .8); --stroke: #3b1580; }
  .front.hero .cf { inset: 2.2cqw; }
  .front.hero .cf::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 38%; z-index: 2; pointer-events: none;
    background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--c3) 75%, #000) 92%);
  }
  .front.hero .cf-photo { bottom: 13%; height: 72%; filter: drop-shadow(0 0 2.4cqw var(--glow)) drop-shadow(0 2cqw 3cqw rgba(0,0,0,.4)); }
  /* 나무위키 상반신 컷아웃: 카드 아래에 붙여 크게, 이름이 그 위에 얹힌다 */
  .front.hero .cf-photo.full { bottom: 0; height: 84%; width: auto; max-width: none; }
  .front.hero .cf-big { top: 8%; opacity: .9; }
  .front.hero .cf-sparkle { z-index: 0; mask: none; -webkit-mask: none; opacity: calc(var(--spark) * .45); animation: twinkle 2.4s ease-in-out infinite; }
  @keyframes twinkle { 50% { opacity: calc(var(--spark) * .9); background-position: 2cqw 1cqw, 5cqw 6cqw; } }
  .front.hero .cf-name {
    position: absolute; left: 0; right: 0; bottom: 4cqw; z-index: 4; text-align: center; padding: 0 3cqw;
    font: 400 var(--nfs, 15cqw)/.9 'Anton', sans-serif; text-transform: uppercase; letter-spacing: .7cqw; white-space: nowrap; color: #fff;
    /* 테두리는 글자 크기에 비례해 얇게: 두꺼우면 긴 이름이 뭉개진다 */
    -webkit-text-stroke: calc(var(--nfs, 15cqw) * .045) var(--stroke); paint-order: stroke fill;
    filter: drop-shadow(0 .4cqw .5cqw rgba(0,0,0,.6)) drop-shadow(0 0 2.4cqw var(--glow));
  }
  .coach.hero .cf-name { bottom: 3cqw; }
  .t-legend.hero .cf-name { background: linear-gradient(180deg, #fffbe6 20%, #ffd24a 60%, #f0a51a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .front.hero .cf-club, .front.hero .cf-rate { z-index: 5; }
  /* ---------- 아이콘: 흑요석 바탕에 백금 홀로그램. 클럽 엠블럼 없음 ----------
     무지개 빛은 저절로 움직이지 않고, 기울인 방향(--hx, --hy)과 각도(--go)에 따라 달라진다 */
  .front.icon {
    --c1: #2a303c; --c2: #dfe6ef; --c3: #0b0d12; --aura1: #ffffff; --aura2: #c9d8f2; --glow: rgba(214, 228, 255, .85); --stroke: #141821;
    --pl: linear-gradient(180deg, #ffffff, #c3ccd8 50%, #f2f5f9);
    --rb: #ffffff, #ffd3ea 8%, #fff1c2 16%, #d2ffe6 24%, #c9e6ff 32%, #e0d2ff 40%, #ffffff 48%, #ffd3ea 56%, #fff1c2 64%, #d2ffe6 72%, #c9e6ff 80%, #e0d2ff 88%, #ffffff 96%;
    --rbs: #f4f7ff, #ff8fcf 9%, #ffd977 18%, #7dffc4 27%, #7cc4ff 36%, #b98cff 45%, #f4f7ff 50%, #ff8fcf 59%, #ffd977 68%, #7dffc4 77%, #7cc4ff 86%, #b98cff 95%;
    --frame: linear-gradient(135deg, #ffffff, #c9d1dc 16%, #f6f8fb 32%, #8792a3 50%, #eef2f8 66%, #aab4c3 82%, #ffffff);
    --pat: repeating-conic-gradient(from 0deg at 50% 30%, rgba(225, 235, 255, .16) 0 1.4deg, rgba(255,255,255,0) 1.4deg 6deg);
    --spark: 1;
  }
  .front.icon .frame-holo {
    mix-blend-mode: overlay; opacity: calc(.55 + var(--go, 0) * 1.6);
    background: linear-gradient(115deg, var(--rb)); background-size: 300% 300%; background-position: var(--hx) var(--hy);
  }
  .front.icon .cf-bg { background: radial-gradient(115% 72% at 50% 30%, #4a5262 0%, #232834 38%, #0f1218 72%, #050608 100%); }
  /* 바탕 전체에 은은한 무지개 */
  .front.icon .cf-bg::after {
    content: ""; position: absolute; inset: 0; mix-blend-mode: overlay; opacity: calc(.22 + var(--go, 0) * .8);
    background: linear-gradient(125deg, var(--rb)); background-size: 260% 260%; background-position: var(--hx) var(--hy);
  }
  .front.icon .cf-pat { mix-blend-mode: screen; opacity: 1; }
  /* 빛줄기 무늬만 따라 회절 포일처럼 무지개가 켜진다 */
  .front.icon .cf-holo {
    mix-blend-mode: screen; opacity: calc(.4 + var(--go, 0) * 1.2);
    background: linear-gradient(110deg, var(--rbs)); background-size: 220% 220%; background-position: var(--hx) var(--hy);
    -webkit-mask: repeating-conic-gradient(from 0deg at 50% 30%, #000 0 1.4deg, transparent 1.4deg 6deg), radial-gradient(90% 70% at 50% 32%, #000 30%, transparent 85%);
    -webkit-mask-composite: source-in; mask-composite: intersect;
    mask: repeating-conic-gradient(from 0deg at 50% 30%, #000 0 1.4deg, transparent 1.4deg 6deg), radial-gradient(90% 70% at 50% 32%, #000 30%, transparent 85%);
  }
  .front.icon .cf-big {
    top: 3%; left: -10cqw; right: -10cqw; font-size: 60cqw; letter-spacing: -.5cqw; transform: rotate(-6deg); opacity: .5;
    color: transparent; -webkit-text-stroke: .4cqw rgba(235, 240, 250, .5);
    background: linear-gradient(115deg, var(--rbs)); background-size: 300% 300%; background-position: var(--hx) var(--hy);
    -webkit-background-clip: text; background-clip: text;
    -webkit-mask: linear-gradient(180deg, #000 30%, rgba(0,0,0,.25) 90%); mask: linear-gradient(180deg, #000 30%, rgba(0,0,0,.25) 90%);
  }
  .front.icon .cf::after { height: 40%; background: linear-gradient(180deg, transparent, rgba(8, 10, 14, .7) 45%, #050608 92%); }
  .front.icon .cf-photo.full { height: 90%; filter: drop-shadow(0 0 2.2cqw rgba(210, 225, 255, .75)) drop-shadow(0 2cqw 3cqw rgba(0, 0, 0, .55)); }
  .icon-deco {
    position: absolute; inset: 1.8cqw; z-index: 4; pointer-events: none;
    background:
      var(--pl) left top / 9cqw .4cqw no-repeat, var(--pl) left top / .4cqw 9cqw no-repeat,
      var(--pl) right top / 9cqw .4cqw no-repeat, var(--pl) right top / .4cqw 9cqw no-repeat,
      var(--pl) left bottom / 9cqw .4cqw no-repeat, var(--pl) left bottom / .4cqw 9cqw no-repeat,
      var(--pl) right bottom / 9cqw .4cqw no-repeat, var(--pl) right bottom / .4cqw 9cqw no-repeat;
    filter: drop-shadow(0 0 .8cqw rgba(220, 232, 255, .8));
  }
  .front.icon .cf-rate {
    background: linear-gradient(180deg, #ffffff, #d9e0ea 45%, #9ea9b9); border-bottom-color: #5d6878; color: #141821;
    box-shadow: 0 1cqw 3cqw rgba(0, 0, 0, .45), 0 0 3cqw rgba(214, 228, 255, .5);
  }
  .front.icon .cf-rate span { opacity: .75; }
  /* 이름: 백금 위에 기울기 따라 옅은 무지개 */
  .front.icon .cf-name {
    bottom: 5cqw; -webkit-text-stroke-color: #10141c;
    background:
      linear-gradient(110deg, rgba(255,211,234,.45), rgba(255,241,194,.45), rgba(210,255,230,.45), rgba(201,230,255,.45), rgba(224,210,255,.45), rgba(255,211,234,.45)) var(--hx) 0 / 300% 100%,
      linear-gradient(180deg, #ffffff 12%, #e4eaf2 40%, #9aa6b8 58%, #f1f5fa 74%, #c1cad7 92%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 .4cqw .5cqw rgba(0,0,0,.7)) drop-shadow(0 0 2.4cqw rgba(200, 220, 255, .55));
  }
  .front.icon .glow-edge { box-shadow: inset 0 0 0 .5cqw rgba(240, 245, 255, .9), inset 0 0 8cqw rgba(190, 210, 245, .45); animation: none; }
  .front.hero .glow-edge {
    position: absolute; inset: 0; z-index: 3; pointer-events: none; border-radius: inherit;
    box-shadow: inset 0 0 0 .6cqw rgba(255,255,255,.75), inset 0 0 6cqw var(--glow);
    animation: edgePulse 2s ease-in-out infinite;
  }
  @keyframes edgePulse { 50% { box-shadow: inset 0 0 0 .6cqw rgba(255,255,255,1), inset 0 0 10cqw var(--glow); } }
  .face .new {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 10; padding: 2.4cqw 2.4cqw 1.2cqw; border-radius: 0 0 1.6cqw 1.6cqw;
    background: linear-gradient(180deg, #ff5d7a, #e11d48); color: #fff; font: italic 800 3.8cqw 'Barlow Condensed', sans-serif; letter-spacing: .4cqw;
    box-shadow: 0 1cqw 2cqw rgba(0,0,0,.3); display: none;
  }
  .face.is-new .new { display: block; }

  .t-common { --frame: linear-gradient(150deg, #ffffff, #e2e0da 50%, #f7f6f2); --stamp: linear-gradient(180deg, #f2f2f2, #b9bec8);
    --pat: repeating-linear-gradient(118deg, rgba(255,255,255,0) 0 7cqw, rgba(255,255,255,.55) 7cqw 7.5cqw, rgba(255,255,255,0) 7.5cqw 13cqw); }
  .t-rare { --frame: linear-gradient(135deg, #d6e6ff, #4f86ea 28%, #eef5ff 50%, #2f62cc 72%, #cfe0ff); --stamp: linear-gradient(180deg, #d4e5ff, #6c9ff2); --holo: .22;
    --pat: repeating-conic-gradient(from 13deg at 28% 38%, rgba(255,255,255,.75) 0 4deg, rgba(255,255,255,0) 4deg 17deg), repeating-conic-gradient(from 51deg at 74% 64%, rgba(255,255,255,.55) 0 3deg, rgba(255,255,255,0) 3deg 21deg); }
  .t-epic { --frame: linear-gradient(135deg, #f3e2ff, #9a5cf0 28%, #ffe1f6 50%, #6532c6 72%, #ead6ff); --stamp: linear-gradient(180deg, #f1dcff, #b383f5); --holo: .45; --spark: .55;
    --pat: repeating-linear-gradient(62deg, rgba(255,255,255,0) 0 3cqw, rgba(255,255,255,.6) 3cqw 3.6cqw), repeating-conic-gradient(from 0deg at 50% 40%, rgba(255,255,255,.4) 0 5deg, rgba(255,255,255,0) 5deg 15deg); }
  .t-legend { --frame: linear-gradient(135deg, #fff5cc, #f2c14e 22%, #b7810f 45%, #ffe9a3 65%, #c9962a 85%, #fff1b8); --stamp: linear-gradient(180deg, #fff3c4, #e9b23a); --holo: .55; --spark: .95;
    --pat: repeating-conic-gradient(from 7deg at 30% 35%, rgba(255,240,180,.85) 0 4deg, rgba(255,255,255,0) 4deg 14deg), repeating-conic-gradient(from 40deg at 70% 62%, rgba(255,255,255,.6) 0 3deg, rgba(255,255,255,0) 3deg 19deg); }

  /* ---------- summary ---------- */
  #summary {
    position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; align-items: center; justify-content: safe center;
    padding: max(12px, env(safe-area-inset-top)) 16px max(28px, calc(env(safe-area-inset-bottom) + 20px)); gap: 22px; overflow-y: auto; overscroll-behavior: contain;
  }
  #summary h2 {
    position: relative; margin: 0; padding: 10px 44px 12px; color: #fff; font: italic 400 26px 'Anton', 'Jua', sans-serif; letter-spacing: 1px;
    background: linear-gradient(180deg, #4f7bff, #2a4fd0); text-shadow: 0 2px 0 rgba(0,0,0,.2);
    clip-path: polygon(0 0, 100% 0, calc(100% - 18px) 50%, 100% 100%, 0 100%, 18px 50%); filter: drop-shadow(0 6px 10px rgba(40, 60, 160, .3));
  }
  #summary h2.legend { background: linear-gradient(180deg, #ffd65a, #e89a12); color: #4a2a00; text-shadow: 0 1px 0 rgba(255,255,255,.5); }
  #summary h2.icon { background: linear-gradient(180deg, #ffffff, #c9d3e3 55%, #8d9ab0); color: #1d2433; text-shadow: 0 1px 0 rgba(255,255,255,.7); }
  #summary h2.epic { background: linear-gradient(180deg, #b77cff, #7a3be0); }
  #summary > * { flex: none; }
  #summary.many .grid { display: grid; grid-template-columns: repeat(5, auto); gap: 8px; }
  #summary.many .mini { width: max(48px, min(calc((100vw - 120px) / 5), 118px)); animation-duration: .45s; }
  @media (max-height: 480px) {
    #summary { gap: 10px; padding-bottom: 14px; }
    #summary h2 { padding: 6px 34px 8px; font-size: 20px; }
    #summary .sub { margin-top: -4px; }
    #summary .panel { padding: 10px; }
    #summary .btn { padding: 10px 22px; }
  }
  @media (min-width: 760px) and (min-aspect-ratio: 4/3) {
    #summary .mini { width: max(64px, min(calc((100vw - 140px) / 5), 168px, calc((var(--vh) - 330px) / 1.4))); }
  }
  #summary .sub { margin-top: -10px; font: 800 13px var(--font); color: #5a62a0; }
  #summary .sub b { color: #e8462c; }
  #summary .panel { padding: 18px; border-radius: 26px; background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.9); box-shadow: 0 20px 50px rgba(70, 80, 160, .15); backdrop-filter: blur(6px); }
  #summary .actions { display: flex; gap: 12px; }
  #summary .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; max-width: 980px; }
  #summary .mini {
    /* 3장 + 2장 두 줄이 버튼까지 한 화면에 들어가는 크기. 가로로 넓은 화면은 한 줄 5장 */
    position: relative; width: max(64px, min(calc((100vw - 92px) / 3), 168px, calc((var(--vh) - 360px) / 2.8))); aspect-ratio: 1 / 1.4; container-type: inline-size; perspective: 800px;
    cursor: pointer; animation: dealIn .6s cubic-bezier(.2,.9,.25,1.2) both;
  }
  @keyframes dealIn { from { opacity: 0; transform: translateY(40px) scale(.8) rotate(-6deg); } }
  /* 게임 버튼: 두툼한 입체감 + 위쪽 광택 */

    position: relative; border: 0; border-radius: 18px; padding: 14px 26px; font: 800 16px var(--font); cursor: pointer; color: #fff;

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const stage = $('#stage'), stackEl = $('#stack'), skipBtn = $('#skip');

const TIERS = {
  common: { rank: 0, label: 'COMMON' },
  rare:   { rank: 1, label: 'RARE' },
  epic:   { rank: 2, label: 'EPIC' },
  legend: { rank: 3, label: 'LEGEND' },
  icon:   { rank: 4, label: 'ICON' },
};
// 슬롯별 등급 확률 (마지막 슬롯은 레어 이상 보장). 아이콘은 팩당 약 0.61% (5팩에 약 3%)
const SLOT_ODDS = [
  { common: 80, rare: 17, epic: 3, legend: 0, icon: 0 },
  { common: 80, rare: 17, epic: 3, legend: 0, icon: 0 },
  { common: 75, rare: 20, epic: 4.5, legend: .5, icon: 0 },
  { common: 54.9, rare: 35, epic: 9, legend: 1, icon: .1 },
  { common: 0, rare: 67.49, epic: 25, legend: 7, icon: .51 },
];
// 클럽별 [약칭, 배경색, 포인트색, 명판색]
const CLUBS = {
  'Arsenal': ['ARS', '#e0202a', '#f3c64e', '#5e0910'],
  'Chelsea': ['CHE', '#1652b0', '#e8b923', '#0b2a63'],
  'Liverpool': ['LIV', '#d0172f', '#18c2b2', '#5c0614'],
  'Manchester City': ['MCI', '#6cb4e6', '#ffffff', '#1c2c5b'],
  'Manchester United': ['MUN', '#da291c', '#fbe122', '#2b0b08'],
  'Tottenham Hotspur': ['TOT', '#2a3d8f', '#e9edf5', '#0c1338'],
  'Real Madrid': ['RMA', '#ece6d2', '#febe10', '#1d3c7c'],
  'Barcelona': ['FCB', '#a50044', '#edbb00', '#06306b'],
  'Atletico Madrid': ['ATM', '#cb3524', '#f2f2f2', '#272e61'],
  'Bayern Munich': ['BAY', '#dc052d', '#ffffff', '#0a3a74'],
  'Borussia Dortmund': ['BVB', '#fde100', '#111111', '#161616'],
  'Bayer Leverkusen': ['B04', '#e32221', '#111111', '#161616'],
  'Inter': ['INT', '#0a5fb4', '#111111', '#071b3a'],
  'AC Milan': ['MIL', '#e3131b', '#111111', '#161616'],
  'Juventus': ['JUV', '#d9d9d9', '#111111', '#161616'],
  'Napoli': ['NAP', '#12a0d7', '#ffffff', '#003c82'],
  'Paris Saint-Germain': ['PSG', '#0b3e7a', '#da291c', '#061f3f'],
  'ICON': ['ICON', '#d7ac45', '#fff3c8', '#2a1f0f'],
};
// 감독 카드의 빅클럽 밖 구단은 엠블럼에서 뽑은 색(coaches.json colors)을 쓴다
const clubOf = (p) => CLUBS[p.team] || [p.team.slice(0, 3).toUpperCase(), ...(p.colors || ['#3b82f6', '#ffffff', '#0f1a3a'])];
// 등급은 EA FC 능력치(OVR) 기준 (card/ratings.json)
const tierOf = (o) => o >= 89 ? 'legend' : o >= 87 ? 'epic' : o >= 81 ? 'rare' : 'common';
// EA 데이터에 없는 선수는 시장가치로 어림잡는다 (일반 등급 이하로)
const ovrOf = (v) => Math.round(68 + clamp((Math.log(v) - Math.log(2.5e6)) / (Math.log(1.6e8) - Math.log(2.5e6)), 0, 1) * 26);
const fmtValue = (v) => '€' + (v >= 1e8 ? (v / 1e6).toFixed(0) : (v / 1e6).toFixed(1)) + 'M';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const loadImg = (src) => new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });

let PLAYERS = [], POOL = { common: [], rare: [], epic: [], legend: [], icon: [] };

// ---------- collection ----------
const KEY = 'packs-collection-v1';
let collection = {};
try { collection = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { collection = {}; }
const saveCollection = () => { try { localStorage.setItem(KEY, JSON.stringify(collection)); } catch (e) {} window.FSPoints?.touch(); };
const updateDex = () => {
  const n = Object.keys(collection).length;
  $('#dexCount').textContent = `${n}/${PLAYERS.length}`;
  $('#dexBar').style.setProperty('--p', (PLAYERS.length ? n / PLAYERS.length * 100 : 0) + '%');
};
// 관리자 계정은 도감을 전부 채워 둔다
const ADMIN_EMAILS = ['bm011011@gmail.com'];
const isAdmin = () => ADMIN_EMAILS.includes(window.FSSync && FSSync.account().email);
// 아이콘 공개 스위치. false인 동안은 관리자 계정에만 보이고 팩에서도 관리자만 나온다
const ICONS_LIVE = true;
let ICON_LIST = [];
function enableIcons() {
  // 감독 아이콘도 같은 풀에 들어가므로 풀이 비었는지 대신 선수 아이콘이 이미 들어갔는지로 본다
  if (!ICON_LIST.length || POOL.icon.includes(ICON_LIST[0]) || !(ICONS_LIVE || isAdmin())) return;
  ICON_LIST.forEach((p) => { p.no = PLAYERS.length + 1; PLAYERS.push(p); POOL.icon.push(p); });
}
// 감독 카드: 전신=레전드, 상반신=에픽, 은퇴 레전드=아이콘. 같은 등급 풀에 섞여 팩에서 나온다
const COACH_TIER = { icon: 'icon', full: 'legend', half: 'epic', rare: 'rare', face: 'common' };
const COACH_OVR = { icon: 95, legend: 90, epic: 87, rare: 82, common: 75 };
const LEAGUE_KO = { 'Premier League': '프리미어리그', 'LaLiga': '라리가', 'Bundesliga': '분데스리가', 'Serie A': '세리에 A', 'Ligue 1': '리그 1' };
function addCoaches(list) {
  // 빅클럽 감독은 선수 데이터의 구단 이름을 그대로 써서 클럽 필터에 같이 묶인다
  const teamOf = {};
  PLAYERS.forEach((p) => { if (!p.coach && p.teamId) teamOf[p.teamId] = p; });
  list.forEach((c) => {
    const tier = COACH_TIER[c.tier], club = teamOf[String(c.teamId)];
    const p = { ...c, coach: true, tier, icon: tier === 'icon', ovr: COACH_OVR[tier], teamId: c.teamId == null ? '' : String(c.teamId),
      team: club ? club.team : c.team, teamKo: club ? club.teamKo : (tier === 'icon' ? '아이콘' : null), leagueKo: LEAGUE_KO[c.league] || '' };
    p.no = PLAYERS.length + 1; PLAYERS.push(p); POOL[tier].push(p);
  });
}
function fillForAdmin() {

function setLight(root, yaw, pitch) {
  const gx = 50 - Math.sin(yaw * Math.PI / 180) * 70, gy = 45 + pitch * 1.6;
  const go = clamp(Math.abs(Math.sin(yaw * Math.PI / 180)) * .6 + Math.abs(pitch) / 60 - .05, 0, .5);
  root.querySelectorAll('.face').forEach((f) => {
    f.style.setProperty('--gx', gx + '%'); f.style.setProperty('--gy', gy + '%'); f.style.setProperty('--go', go);
    f.style.setProperty('--hx', (50 + yaw * 1.6) + '%'); f.style.setProperty('--hy', (50 + pitch * 2.2) + '%');
  });
}

const Gyro = {
  on: false, x: 0, y: 0, sx: 0, sy: 0, base: null,
  init() {
    if (!('DeviceOrientationEvent' in window)) return;
    const start = () => { if (!this.on) { addEventListener('deviceorientation', (e) => this.read(e)); this.on = true; } };
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      // iOS는 사용자의 터치 직후에만 권한을 물을 수 있음
      // 실패(터치 직후가 아님)하면 다음 터치에서 다시 물어봄
      let asking = false;
      const ask = (e) => {
        if (this.on || asking || (e && !e.isTrusted)) return;
        asking = true;
        DeviceOrientationEvent.requestPermission()
          .then((r) => { asking = false; if (r === 'granted') start(); if (r !== 'default') removeEventListener('pointerup', ask); })
          .catch(() => { asking = false; });
      };
      addEventListener('pointerup', ask);
    } else start();
  },
  read(e) {
    if (e.beta == null || e.gamma == null) return;
    const b = clamp(e.beta, -90, 90), g = clamp(e.gamma, -90, 90);
    if (!this.base) this.base = { b, g };
    // 기준 자세를 천천히 따라가서, 들고 있는 각도가 바뀌어도 다시 가운데로 돌아옴
    this.base.b += (b - this.base.b) * .006; this.base.g += (g - this.base.g) * .006;
    this.x = clamp((b - this.base.b) / 22, -1, 1); this.y = clamp((g - this.base.g) / 22, -1, 1);
  },
  tick() { this.sx += (this.x - this.sx) * .18; this.sy += (this.y - this.sy) * .18; },
  get active() { return this.on && this.base !== null; },
};
Gyro.init();

  constructor(k = 110, d = 9) { this.v = 0; this.t = 0; this.vel = 0; this.k = k; this.d = d; }

}

  // ---- setup ----
  function init(cardBackCanvas) {

let phase = 'loading', pulls = [], slots = [], cur = 0, CARD_BACK = null;

function rollPack() {
  const used = new Set();
  const out = SLOT_ODDS.map((odds, i) => {
    let r = Math.random() * 100, tier = 'common';
    for (const k of ['common', 'rare', 'epic', 'legend', 'icon']) { if ((r -= odds[k]) < 0) { tier = k; break; } }
    // 아이콘 비공개 중엔 그 자리를 레어로 (마지막 칸 레어 이상 보장 유지, 레전드 확률은 그대로)
    if (tier === 'icon' && !POOL.icon.length) tier = 'rare';
    if (!POOL[tier].length) tier = 'common';
    let p, guard = 0;
    do { p = POOL[tier][Math.floor(Math.random() * POOL[tier].length)]; } while (used.has(p.id) && guard++ < 50);
    used.add(p.id); return { ...p };
  });
  return out.sort((a, b) => TIERS[a.tier].rank - TIERS[b.tier].rank || a.ovr - b.ovr);
}

    stackEl.appendChild(el);

}
function renderSlot(s) {

  const selList = PLAYERS.filter(inDexClub);
  const selName = dexClub === COACH_CLUB ? '감독' : dexClub === OTHER_CLUB ? '기타 클럽' : sel ? (sel.teamKo || sel.team) : '전체 클럽';
  $('#clubBtn').innerHTML = `<span class="lbl">클럽</span><i style="${sel ? `--c:${clubOf(sel)[1]}` : ''}"></i>${esc(selName)}<em>${ownCount(selList)}/${selList.length}</em>${CHEVRON}`;
  $('#clubPanel').innerHTML = `<button class="club-opt ${dexClub === 'all' ? 'on' : ''}" data-c="all"><i style="--c:linear-gradient(135deg,#4f7bff,#ff6a3d)"></i><span>전체 클럽</span><em>${ownCount(PLAYERS)}/${PLAYERS.length}</em></button>` +
    (coaches.length ? `<button class="club-opt ${dexClub === COACH_CLUB ? 'on' : ''}" data-c="${COACH_CLUB}"><i style="--c:linear-gradient(135deg,#2b3152,#8a93b8)"></i><span>감독</span><em>${ownCount(coaches)}/${coaches.length}</em></button>` : '') +
    (others.length ? `<button class="club-opt ${dexClub === OTHER_CLUB ? 'on' : ''}" data-c="${OTHER_CLUB}"><i style="--c:linear-gradient(135deg,#1f8a5b,#d9b44a)"></i><span>기타 클럽</span><em>${ownCount(others)}/${others.length}</em></button>` : '') +
    clubs.map((t) => {
      const list = PLAYERS.filter((p) => p.team === t);
      return `<button class="club-opt ${dexClub === t ? 'on' : ''}" data-c="${esc(t)}"><i style="--c:${clubOf(list[0])[1]}"></i><span>${esc(list[0].teamKo || t)}</span><em>${ownCount(list)}/${list.length}</em></button>`;
    }).join('');
  $('#clubBtn').classList.toggle('open', $('#clubPanel').classList.contains('open'));
}
function renderDex() {
  let list = PLAYERS.slice().sort((a, b) => a.no - b.no);
  list = list.filter(inDexClub);
  if (dexTier !== 'all') list = list.filter((p) => p.tier === dexTier);
  if (dexOwnedOnly) list = list.filter((p) => collection[p.id]);
  const grid = $('#dexGrid');
  if (!list.length) { grid.innerHTML = '<div class="dex-none">아직 모은 카드가 없어요. 팩을 열어보세요!</div>'; return; }
  grid.innerHTML = list.map((p) => {
    const cnt = collection[p.id];
    if (cnt) return `<div class="dex-cell" data-id="${esc(p.id)}"><div class="card3d">${frontHTML(p).replaceAll('<img class="cf-', '<img loading="lazy" class="cf-')}</div>${cnt > 1 ? `<span class="cnt">×${cnt}</span>` : ''}</div>`;
    return `<div class="dex-cell locked" data-id="${esc(p.id)}"><div class="dex-empty"><span class="club">${esc(clubOf(p)[0])}</span><img loading="lazy" src="/${esc(p.photo)}" alt=""><span class="q">?</span><span class="no">#${String(p.no).padStart(3, '0')}</span></div></div>`;
  }).join('');
  grid.scrollTop = 0;
}
$('#dex').addEventListener('click', openDex);
$('#dexClose').addEventListener('click', closeDex);
$('#dexChips').addEventListener('click', (e) => {
  const b = e.target.closest('.dex-chip[data-k]'); if (!b) return;
  dexTier = b.dataset.k; renderDexChips(); renderDex();
});
$('#dexChips').addEventListener('change', (e) => { if (e.target.id === 'ownedOnly') { dexOwnedOnly = e.target.checked; renderDex(); } });
$('#clubBtn').addEventListener('click', () => { $('#clubPanel').classList.toggle('open'); renderDexChips(); });
$('#clubPanel').addEventListener('click', (e) => {
  const b = e.target.closest('.club-opt'); if (!b) return;
  dexClub = b.dataset.c; $('#clubPanel').classList.remove('open'); renderDexChips(); renderDex();
});
// 목록 밖을 누르면 클럽 목록 닫기
dexView.addEventListener('pointerdown', (e) => {
  if (!e.target.closest('#clubPanel, #clubBtn') && $('#clubPanel').classList.contains('open')) { $('#clubPanel').classList.remove('open'); renderDexChips(); }
});
$('#dexGrid').addEventListener('click', (e) => {
  const cell = e.target.closest('.dex-cell'); if (!cell) return;
  const p = PLAYERS.find((x) => x.id === cell.dataset.id); if (!p) return;
  if (cell.classList.contains('locked')) { cell.classList.remove('shake'); void cell.offsetWidth; cell.classList.add('shake'); return; }
  openInspect(p, true);
});

// ---------- flow ----------

const PACK_COST = 100, MULTI_COST = 500, MULTI_PACKS = 5;
const GUIDE_FLAG = '__cardGuide';
let multi = null;     // { n, total, pulls } 5팩 진행 중
let packPaid = false; // 지금 팩 값을 냈는지 (뜯기 시작할 때 낸다)
const balance = () => (window.FSPoints ? FSPoints.balance() : 0);
function refreshPts(gain) {
  $('#ptsBal').textContent = balance().toLocaleString();
  const free = window.FSPoints ? FSPoints.freePacksLeft() : 0;
  $('#freeCount').textContent = `FREE ${free}`;
  $('#freeCount').style.display = free > 0 && phase !== 'summary' ? 'block' : 'none';
  if (gain) { const el = $('#pts'); el.classList.remove('gain'); void el.offsetWidth; el.classList.add('gain'); }
  updatePackUI();
}
function denyPts() {
  const el = $('#pts'); el.classList.remove('deny'); void el.offsetWidth; el.classList.add('deny');
  Sfx.init(); Sfx.deny(); buzz([20, 40, 20]);
}
function updatePackUI() {
  const bal = balance();
  $('#multiBtn').style.display = phase === 'pack' && !packPaid && !multi && bal >= MULTI_COST ? 'block' : 'none';
  $('#againMulti').style.display = bal >= MULTI_COST ? '' : 'none';
  const pc = $('#packCount');
  pc.style.display = multi && phase !== 'summary' ? 'block' : 'none';
  if (multi) pc.textContent = `${multi.n} / ${multi.total}`;
}
function beginMulti(withCurrent) {
  if (!window.FSPoints || !FSPoints.spend('card', MULTI_COST, `${MULTI_PACKS}팩`)) { denyPts(); return false; }
  const packs = Array.from({ length: MULTI_PACKS }, (_, i) => (i === 0 && withCurrent ? pulls : rollPack()));
  multi = { n: 1, total: MULTI_PACKS, pulls: [], packs };
  commitPulls(packs.flat(), MULTI_PACKS);
  packPaid = true;
  refreshPts();
  return true;
}
// 개봉 수: 계정 요약 + 사이트 전체 통계(statsCounters, statsDaily)
function packsOpened(n) {
  if (window.FSPoints) FSPoints.countPacks(n);
  if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return;
  import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js').then(async ({ initializeApp, getApps }) => {
    const { getFirestore, doc, setDoc, increment } = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js');
    const app = getApps().find((a) => a.name === 'packs') || initializeApp({ projectId: 'guess-your-player', apiKey: 'AIzaSyA8SG_LbHeqS9gh0CLFaHUhEI1uG1uYLDY', appId: '1:1068776442781:web:433981863e0c3da178bd74' }, 'packs');
    const db = getFirestore(app), day = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
    await Promise.all([
      setDoc(doc(db, 'statsCounters', 'totals'), { 'card-pack': increment(n) }, { merge: true }),
      setDoc(doc(db, 'statsDaily', day), { 'card-pack': increment(n) }, { merge: true }),
    ]);
  }).catch((e) => console.warn('pack stats failed', e));
}
$('#multiBtn').addEventListener('click', () => { Sfx.init(); if (beginMulti(true)) { Sfx.coin(); skipBtn.style.display = 'flex'; } });
window.addEventListener('fs-sync', () => refreshPts());

async function startPack() {
  phase = 'pack';
  packPaid = !!multi;
  skipBtn.style.display = multi ? 'flex' : 'none';
  updatePackUI();
  $('#pedestal').style.opacity = 1;
  pulls = multi ? multi.packs[multi.n - 1] : rollPack();
  buildStack();
  // 팩 표지 얼굴은 선수만 (감독 컷아웃은 전신이라 얼굴 자리에 안 맞는다)
  const heroes = POOL.legend.filter((p) => !p.coach).sort(() => Math.random() - .5).slice(0, 3);
  const imgs = await Promise.all(heroes.map((h) => loadImg('/' + h.photo)));
  await Pack3D.newPack(imgs, CARD_BACK, {
    // 뜯는 선 안내는 계정마다 첫 팩에만
    guide: !(window.FSPoints && FSPoints.getFlag(GUIDE_FLAG)),
    beforeTear() {
      if (packPaid) return true;
      if (window.FSPoints && (FSPoints.useFreePack() || FSPoints.spend('card', PACK_COST, '1팩'))) {
        packPaid = true; commitPulls(pulls, 1); refreshPts(); return true;
      }
      denyPts();
      return false;
    },
    glow: GLOW[bestOf(pulls).tier] || null,
    onDrop() { cardGlow(bestOf(pulls).tier, 900); },
    onTorn() { if (window.FSPoints) FSPoints.setFlag(GUIDE_FLAG); updatePackUI(); },
  });
  // 3D 카드가 DOM 카드 자리와 정확히 겹친 순간 교체
  stackEl.classList.add('fresh'); stackEl.classList.remove('hidden');
  Pack3D.stop();
  requestAnimationFrame(() => requestAnimationFrame(() => stackEl.classList.remove('fresh')));
  phase = 'reveal'; cur = 0; layoutStack(); prepareTop();
  skipBtn.style.display = 'flex';
  updatePackUI();
}

(() => {
  const box = $('#sparkles');
  for (let i = 0; i < 18; i++) {
    const el = document.createElement('i');
    el.style.left = Math.random() * 100 + '%'; el.style.top = 40 + Math.random() * 60 + '%';
    const sz = 3 + Math.random() * 5; el.style.width = el.style.height = sz + 'px';
    el.style.animationDuration = 6 + Math.random() * 8 + 's'; el.style.animationDelay = -Math.random() * 14 + 's';
    box.appendChild(el);
  }
})();

(async () => {
  try {
    await Promise.all(['86px Anton', 'italic 800 40px "Barlow Condensed"', '700 24px "Barlow Condensed"', '800 40px "Gothic A1"', '700 26px "Gothic A1"'].map((f) => document.fonts.load(f)));
  } catch (e) {}
  CARD_BACK = drawCardBack();
  BACK_URL = CARD_BACK.toDataURL('image/png');
  const [d, ic, rt, co, ex] = await Promise.all(['/data/captcha_players.json', '/card/icons.json', '/card/ratings.json', '/card/coaches.json', '/card/extra_players.json'].map((u) => fetch(u).then((r) => r.json()).catch(() => null)));
  if (!d) { $('#loading').textContent = '선수 데이터를 불러오지 못했어요'; return; }
  const ratings = rt?.ratings || {};
  // 카드팩 전용 베테랑(card/extra_players.json): 몸값 상위 20명 컷에 걸려 빠진 유명 선수, OVR은 파일 안에
  PLAYERS = [...d.players, ...(ex?.players || [])].filter((p) => p.photo && p.transferValue);
  PLAYERS.forEach((p) => { p.ovr = ratings[p.id] || p.ovr || Math.min(80, ovrOf(p.transferValue)); p.tier = tierOf(p.ovr); });
  PLAYERS.sort((a, b) => b.ovr - a.ovr || b.transferValue - a.transferValue);
  PLAYERS.forEach((p, i) => { p.no = i + 1; POOL[p.tier].push(p); });
  // 아이콘(은퇴·변방 리그 레전드): 따로 아이콘 등급
  ICON_LIST = (ic?.players || []).map((p) => ({ ...p, icon: true, tier: 'icon' }));
  enableIcons();
  addCoaches(co?.coaches || []);
  $('#loading').remove();
  updateDex();
  fillForAdmin();
  refreshPts();
  try { Sfx.muted = localStorage.getItem('cardMuted') === '1'; } catch (e) {}
  $('#mute').classList.toggle('muted', !!Sfx.muted);
  $('#mute').addEventListener('click', () => {
    Sfx.setMuted(!Sfx.muted);
    $('#mute').classList.toggle('muted', Sfx.muted);
    try { localStorage.setItem('cardMuted', Sfx.muted ? '1' : '0'); } catch (e) {}
  });
  startPack();
})();
</script>

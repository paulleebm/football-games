<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14281d">
  <title>알까기 축구</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=22">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script src="/points.js"></script>
</head>
<body>
  <canvas id="stage"></canvas>

  <section id="menu" class="menu">
    <div class="menu-card">
      <header class="menu-top"><a class="back-link" href="../" aria-label="홈">←</a><h1>알까기 축구</h1></header>
      <div class="emblems" id="myClubs"></div>
      <div class="formations" id="formations"></div>
      <div class="pitch-wrap"><div class="pitch" id="pitch"></div></div>
      <div class="roster" id="roster"></div>
      <div class="modes" id="modes">
        <button type="button" data-mode="cpu">🤖 CPU</button>
        <button type="button" data-mode="online">🌐 온라인</button>
      </div>
      <div class="seg" id="levels">
        <button type="button" data-level="easy">쉬움</button>
        <button type="button" data-level="normal">보통</button>
        <button type="button" data-level="hard">어려움</button>
      </div>
      <div class="seg" id="onlineKinds">
        <button type="button" data-online="random">랜덤</button>
        <button type="button" data-online="host">방 열기</button>
        <button type="button" data-online="join">방 참가</button>
      </div>
      <button type="button" class="start-btn" id="startBtn">킥오프</button>
    </div>
  </section>

  <section id="matching" class="matching" hidden>
    <div class="matching-card">
      <div class="room-code" id="roomCode" hidden></div>
      <div class="spinner">⚽</div>
      <b>상대 찾는 중</b>
      <button type="button" class="icon-btn dark" id="matchCancel" aria-label="취소">✕</button>
    </div>
  </section>

  <section id="joinRoom" class="matching" hidden>
    <form class="join-card" id="joinForm" autocomplete="off">
      <b>방 코드</b>
      <input id="roomInput" inputmode="numeric" pattern="[0-9]*" maxlength="4" aria-label="방 코드">
      <div class="join-msg" id="joinMsg"></div>
      <div class="join-actions">
        <button type="button" id="joinCancel">취소</button>
        <button type="submit" class="go" id="joinGo">입장</button>
      </div>
    </form>
  </section>

  <div class="toast" id="toast" hidden></div>

  <section id="hud" class="hud" hidden>
    <button type="button" class="icon-btn hud-exit" id="exitBtn" aria-label="나가기" title="나가기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4" /><path d="M15 16l4-4-4-4M19 12H9" /></svg>
    </button>
    <div class="sound" id="sound">
      <button type="button" class="sound-icon" id="muteBtn" aria-label="음소거" title="음소거">🔊</button>
      <input type="range" id="volumeRange" min="0" max="100" step="1" aria-label="소리 크기">
    </div>
    <div class="topbar">
      <div class="scoreboard">
        <img id="myLogo" alt="">
        <div class="score"><b id="scoreMe">0</b><i>:</i><b id="scoreOpp">0</b></div>
        <img id="oppLogo" alt="">
        <div class="opp-items" id="oppItems"></div>
      </div>
      <div class="turnbar">
        <span id="turnLabel">1/12</span>
        <div class="timer" id="timer" hidden><div id="timerFill"></div></div>
      </div>
      <div class="effects" id="effects"></div>
    </div>
    <div class="bubble me" id="bubbleMe"></div>
    <div class="bubble opp" id="bubbleOpp"></div>
    <div id="banner" class="banner"></div>
    <div class="tray">
      <div class="item-tip" id="itemTip" hidden></div>
      <div class="items" id="items"></div>
    </div>
    <button type="button" class="ready-btn" id="readyBtn">준비 완료 ▶</button>
    <div class="emote">
      <div class="emote-panel" id="emotePanel" hidden></div>
      <button type="button" class="icon-btn" id="emoteBtn" aria-label="이모지">😀</button>
    </div>
    <div class="drag-hint" id="dragHint" hidden>👆</div>
    <div class="item-ghost" id="itemGhost" hidden></div>
    <div id="flash" class="flash"></div>
  </section>

  <section id="confirm" class="result" hidden>
    <div class="result-card small">
      <h2>나갈까요?</h2>
      <div class="confirm-btns">
        <button type="button" class="sub-btn" id="confirmStay">계속하기</button>
        <button type="button" class="start-btn danger" id="confirmLeave">나가기</button>
      </div>
    </div>
  </section>

  <section id="result" class="result" hidden>
    <div class="result-card">
      <div class="result-emoji" id="resultEmoji">🏆</div>
      <h2 id="resultTitle">승리!</h2>
      <div class="result-score">
        <img id="resHomeLogo" alt=""><b id="resultScore">3 : 1</b><img id="resAwayLogo" alt="">
      </div>
      <p id="resultSub"></p>
      <div class="result-btns">
        <button type="button" class="start-btn" id="againBtn">다시 하기</button>
        <button type="button" class="sub-btn" id="menuBtn">팀 바꾸기</button>
        <a class="sub-btn" href="../">홈으로</a>
      </div>
    </div>
  </section>

  <script type="module" src="app.js?v=43"></script>
</body>
</html>

// ---------------------------------------------------------------- 게임4: 실루엣 맞히기
// design/silhouette-pilot/silhouettes-v2 100장(FotMob 프로필 사진 - 이미
// 배경이 제거된 렌더 - 기반, 일부는 rembg 결정론적 배경 제거 파이프라인 산출물)을
// public/silhouettes/에 복사해두고, 매 판 전체가 아니라 랜덤 SIL_ROUND_SIZE
// (20)문제만 뽑아서 돈다. 정답이 공개된(맞혔든/틀렸든/포기했든) 선수는
// localStorage(SIL_SEEN_KEY)에 기록해 다음 판 뽑기에서 뒷순위로 미룬다 - 풀을
// 다 겪기 전까지는 최대한 새 선수가 나오게. 정답 후보 검색은 게임1과 동일하게
// SEARCH_POOL(영문 이름 9천여 개) 전체 대상 - 한글 이름은 지원하지 않는다.
// 맞히거나(또는 포기하거나) 정답을 공개할 때는 실루엣 옆에 실제 사진
// (public/reveal/)을 같이 보여주고, "다음 문제" 버튼을 눌러야 다음 실루엣으로
// 넘어간다.

let SIL_PLAYERS = null; // lazy-load
let SIL_SEARCH_POOL = null; // SEARCH_POOL + 은퇴한 레전드 보강본 (게임4 전용, 게임1 SEARCH_POOL은 건드리지 않음)
async function loadSilPlayers() {
  if (SIL_PLAYERS) return;
  // 명단이 바뀔 때마다 캐시 키를 올려서 예전 세션 캐시를 무시한다 (v1: 20명, v2: 30명, v3: 100명,
  // v4: 137명 - 은퇴 선수 53명 제거 + 현역 유명 선수 90명 추가, v5: 222명 - 현역 유명 선수 85명 추가,
  // v6: 211명 - 그 사이 은퇴/방출/무소속이 된 11명 제거(웹 검색으로 현역 여부 재확인),
  // v7: id를 선수 슬러그(예: bellingham)에서 opaque id(예: p164)로 교체 - F12로 이미지
  // 파일명만 봐도 정답이 드러나던 문제를 막기 위함. v8: nameKo/nameEn 평문을 없애고
  // matchHash/nameKoEnc/nameEnEnc로 교체 - 세션스토리지를 그냥 열어봐도 이름이 안
  // 보이게. 값 자체는 안 바뀌었어도 예전 캐시가 평문/옛 슬러그 id를 들고 있으면
  // 깨지므로 캐시를 버려야 한다.
  sessionStorage.removeItem("silPlayersV1");
  sessionStorage.removeItem("silPlayersV2");
  sessionStorage.removeItem("silPlayersV3");
  sessionStorage.removeItem("silPlayersV4");
  sessionStorage.removeItem("silPlayersV5");
  sessionStorage.removeItem("silPlayersV6");
  sessionStorage.removeItem("silPlayersV7");
  const cached = sessionStorage.getItem("silPlayersV8");
  if (cached) { SIL_PLAYERS = JSON.parse(cached); return; }
  const res = await fetch("data/silhouette_players.json");
  SIL_PLAYERS = await res.json();
  sessionStorage.setItem("silPlayersV8", JSON.stringify(SIL_PLAYERS));
}
// SEARCH_POOL은 "2020년 이후 유럽 5대리그 출전 선수" 전용이라 피를로/푸욜/
// 발데라마/펠라이니/호나우지뉴/이브라히모비치 같은 은퇴 레전드가 아예 없다 -
// 그대로 쓰면 이 6명은 검색으로 정답을 낼 방법이 없어져서, 게임4 검색 풀에만
// 빠진 이름을 보충해 넣는다.
function buildSilSearchPool() {
  if (SIL_SEARCH_POOL) return SIL_SEARCH_POOL;
  const poolLower = new Set(SEARCH_POOL.map(n => n.toLowerCase()));
  const missing = SIL_PLAYERS.map(p => deobfuscate(p.nameEnEnc)).filter(n => !poolLower.has(n.toLowerCase()));
  SIL_SEARCH_POOL = [...SEARCH_POOL, ...missing];
  return SIL_SEARCH_POOL;
}

const SIL_MAX_GUESSES = 3;
const SIL_ROUND_SIZE = 20; // 전체를 한 번에 도는 대신 매 판 랜덤 20문제만

// 정답이 공개된(맞혔든 실패했든 포기했든) 선수는 로컬에 기록해두고, 다음 판을
// 고를 때 뒷순위로 미룬다 - 풀을 다 겪기 전까지는 최대한 새 선수가 나오게.
const SIL_SEEN_KEY = "silSeenPlayers";
function getSilSeenIds() {
  try { return new Set(JSON.parse(localStorage.getItem(SIL_SEEN_KEY) || "[]")); }
  catch { return new Set(); }
}
function markSilSeen(playerId) {
  const seen = getSilSeenIds();
  seen.add(playerId);
  localStorage.setItem(SIL_SEEN_KEY, JSON.stringify([...seen]));
}
function pickSilRoundPlayers(n) {
  const seen = getSilSeenIds();
  const unseen = SIL_PLAYERS.filter(p => !seen.has(p.id));
  const alreadySeen = SIL_PLAYERS.filter(p => seen.has(p.id));
  const ordered = [...shuffle(unseen), ...shuffle(alreadySeen)];
  return ordered.slice(0, Math.min(n, ordered.length));
}

let sil = null; // 게임4 현재 판 상태

// 실루엣/정답 사진이 문제가 바뀔 때마다 늦게 뜨는 걸 막기 위한 프리로드.
// 브라우저 이미지 캐시에 미리 앉혀두는 용도라 <img>가 그 src를 쓸 때 즉시 표시된다.
function silPreloadImage(src) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = img.onerror = () => resolve();
    img.src = src;
  });
}
function silPreloadPlayer(p) {
  // 문제 전환과 정답 공개 때 이미지가 늦게 뜨지 않도록 둘 다 미리 불러둔다.
  return Promise.all([
    silPreloadImage(`silhouettes/${p.id}.png`),
    silPreloadImage(`reveal/${p.id}.jpg`),
  ]);
}
function silPreloadRound(order) {
  order.forEach(silPreloadPlayer);
}

async function startGame4() {
  logPlay("silhouette-guess");
  render(`<div class="loading">불러오는 중…</div>`);
  await loadSilPlayers();
  buildSilSearchPool();
  const order = pickSilRoundPlayers(SIL_ROUND_SIZE);
  await silPreloadPlayer(order[0]); // 첫 문제는 실루엣+정답 사진 둘 다 로딩까지 기다렸다가 바로 보여준다
  sil = {
    order, idx: 0, player: order[0], guessesLeft: SIL_MAX_GUESSES, correct: 0,
  };
  renderGame4();
  silPreloadRound(order); // 이번 판 나머지 실루엣 + 정답 사진은 백그라운드로 미리 로드
}

async function silIsMatch(name, player) {
  return matchesHash(name, player.matchHash);
}

function silGuessPlaceholder(s) {
  return `선수 이름을 검색해보세요 (남은 기회 ${s.guessesLeft}/${SIL_MAX_GUESSES})`;
}
function updateSilGuessPlaceholder() {
  const input = document.getElementById("silGuessInput");
  if (input) input.placeholder = silGuessPlaceholder(sil);
}

function renderGame4() {
  const s = sil;
  render(`
    <div class="game-screen sil-game">
      ${renderSourceBadge("silhouette")}
      <div class="topbar">
        <button class="backbtn" id="backBtn">← 처음으로</button>
        <div class="score-pill">${s.idx + 1} / ${s.order.length}번째 · 정답 <b>${s.correct}</b>개</div>
      </div>
      <div class="criterion-banner">🌑 실루엣만 보고 선수를 맞혀보세요! 기회는 <b>${SIL_MAX_GUESSES}번</b>까지예요.</div>
      <div class="sil-img-wrap">
        <img src="silhouettes/${s.player.id}.png" alt="선수 실루엣" draggable="false">
      </div>
      <div class="guess-wrap">
        <input id="silGuessInput" placeholder="${silGuessPlaceholder(s)}" autocomplete="off">
        <div class="suggest-list" id="silSuggestList" hidden></div>
      </div>
      <div class="wrong-msg" id="silWrongMsg"></div>
      <button class="giveup-btn" id="silSkipBtn">모르겠어요, 정답 보기</button>
    </div>
  `);
  document.getElementById("backBtn").onclick = renderHome;
  document.getElementById("silSkipBtn").onclick = silSkip;
  wireSourceBadge();
  wireSilInput();
  document.getElementById("silGuessInput")?.focus();
}

function renderSilSuggestions(query) {
  const box = document.getElementById("silSuggestList");
  if (!box) return;
  const q = normalize(query);
  if (!q) { box.hidden = true; box.innerHTML = ""; return; }
  // 선수 맞히기(게임1)와 동일한 후보군: SEARCH_POOL(영문 이름 9천여 개) +
  // 그 풀에 없는 은퇴 레전드 보충분에서 검색한다. 한글 이름은 지원하지 않는다.
  const matches = SIL_SEARCH_POOL.filter(name => normalize(name).includes(q));
  renderSuggestBox(box, matches, (name) => {
    box.hidden = true;
    box.innerHTML = "";
    const input = document.getElementById("silGuessInput");
    if (input) input.value = "";
    silSubmit(name);
  });
}

function wireSilInput() {
  const input = document.getElementById("silGuessInput");
  input.addEventListener("input", () => renderSilSuggestions(input.value));
  input.addEventListener("focus", () => renderSilSuggestions(input.value));
}

async function silSubmit(name) {
  const s = sil;
  if (!normalize(name)) return;
  if (await silIsMatch(name, s.player)) {
    document.getElementById("silWrongMsg").textContent = "";
    s.correct += 1;
    silShowReveal(true);
    return;
  }
  s.guessesLeft -= 1;
  if (s.guessesLeft <= 0) {
    silShowReveal(false);
    return;
  }
  const msg = document.getElementById("silWrongMsg");
  if (msg) msg.textContent = `❌ 오답이에요! 남은 기회 ${s.guessesLeft}번`;
  const wrap = document.querySelector(".guess-wrap");
  if (wrap) { wrap.classList.remove("shake"); void wrap.offsetWidth; wrap.classList.add("shake"); }
  updateSilGuessPlaceholder();
}

function silSkip() {
  // 스킵 버튼: 현재 선수를 오답 처리하고 정답 화면을 보여준다
  silShowReveal(false);
}

function silShowReveal(wasCorrect) {
  const s = sil;
  markSilSeen(s.player.id);
  const isFinal = s.idx + 1 >= s.order.length;
  render(`
    <div class="game-screen sil-game">
      <div class="topbar">
        <button class="backbtn" id="backBtn">← 처음으로</button>
        <div class="score-pill">${s.idx + 1} / ${s.order.length}번째 · 정답 <b>${s.correct}</b>개</div>
      </div>
      <div class="criterion-banner">
        ${wasCorrect ? "🎉 정답이에요!" : "😅 아쉬워요, 정답은"}
        <b>${escapeHtml(deobfuscate(s.player.nameKoEnc))} (${escapeHtml(deobfuscate(s.player.nameEnEnc))})</b>
      </div>
      <div class="sil-reveal-row">
        <div class="sil-reveal-col">
          <div class="sil-reveal-label">실루엣</div>
          <img src="silhouettes/${s.player.id}.png" alt="실루엣">
        </div>
        <div class="sil-reveal-col">
          <div class="sil-reveal-label">실제 사진</div>
          <img src="reveal/${s.player.id}.jpg" alt="실제 사진">
        </div>
      </div>
      <button class="sil-next-btn" id="silNextBtn">${isFinal ? "결과 보기" : "다음 문제 →"}</button>
    </div>
  `);
  document.getElementById("backBtn").onclick = renderHome;
  document.getElementById("silNextBtn").onclick = silAdvance;
}

async function silAdvance() {
  const s = sil;
  const isFinal = s.idx + 1 >= s.order.length;
  if (isFinal) {
    silFinish();
    return;
  }
  const next = s.order[s.idx + 1];
  // 보통은 silPreloadRound가 판 시작할 때부터 백그라운드로 이미 다 받아놔서 여기선
  // 즉시 resolve된다 - 아주 빠르게 답을 맞혀 넘어갈 때만 실제로 잠깐 기다리게 되는
  // 안전장치. 기다리는 동안 화면은 이전 문제 그대로 둬서 빈 화면이 안 뜨게 한다.
  await silPreloadPlayer(next);
  s.idx += 1;
  s.player = s.order[s.idx];
  s.guessesLeft = SIL_MAX_GUESSES;
  renderGame4();
}

async function submitSilScore(nickname, correct) {
  const ref = doc(db, "silhouetteLeaderboard", "allTime", "entries", deviceId());
  const prev = await getDoc(ref);
  if (prev.exists() && prev.data().correct >= correct) return false;
  await commitLeaderboardScore("silhouette-guess", ref, { nickname, correct, updatedAt: new Date() });
  return true;
}
async function fetchSilLeaderboard(top = 10) {
  const q = query(
    collection(db, "silhouetteLeaderboard", "allTime", "entries"),
    orderBy("correct", "desc"), limit(top)
  );
  const snap = await getDocs(q);
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function renderSilLeaderboard() {
  const box = document.getElementById("silLbBox");
  if (!box) return;
  box.innerHTML = `<div class="sub">리더보드 불러오는 중…</div>`;
  try {
    const rows = await fetchSilLeaderboard(10);
    const my = deviceId();
    box.innerHTML = `<table class="lb"><tr><th>#</th><th>닉네임</th><th>정답</th></tr>${
      rows.map((r, i) => `<tr class="${r.id === my ? 'me' : ''}"><td>${i + 1}</td><td>${escapeHtml(r.nickname)}</td><td>${escapeHtml(r.correct)}</td></tr>`).join("")
    }</table>`;
  } catch (e) {
    box.innerHTML = `<div class="sub">리더보드를 불러오지 못했습니다.</div>`;
    console.error(e);
  }
}

function silFinish() {
  const s = sil;
  window.FSPoints?.earn("silhouette", s.correct * 3 + (s.correct === s.order.length ? 20 : 0), `${s.correct}/${s.order.length} 정답`);
  render(`
    <div class="game-screen sil-game">
      <div class="topbar">
        <button class="backbtn" id="backBtn">← 처음으로</button>
        <div></div>
      </div>
      <div class="result-card">
        <div class="name">${s.correct === s.order.length ? "🏆" : "🌑"} 완료!</div>
        <div class="grade">${s.correct} / ${s.order.length}<small>정답</small></div>
      </div>
      <div class="nick-row">
        <input id="silNickInput" maxlength="20" placeholder="닉네임 (리더보드 등록)">
        <button id="silSubmitScoreBtn">기록 등록</button>
      </div>
      <div id="silLbBox"></div>
      <div class="btn-row">
        <button class="primary" id="silRetryBtn">다시 하기</button>
        <button id="silHomeBtn">처음으로</button>
      </div>
    </div>
  `);
  document.getElementById("backBtn").onclick = renderHome;
  document.getElementById("silHomeBtn").onclick = renderHome;
  document.getElementById("silRetryBtn").onclick = startGame4;
  document.getElementById("silSubmitScoreBtn").onclick = async () => {
    const nickname = (document.getElementById("silNickInput").value || "익명").slice(0, 20);
    const btn = document.getElementById("silSubmitScoreBtn");
    btn.disabled = true; btn.textContent = "등록 중…";
    try {
      const improved = await submitSilScore(nickname, s.correct);
      await renderSilLeaderboard();
      rankBonus("silhouette", improved, () => fetchSilLeaderboard(10));
      btn.textContent = "등록 완료";
    } catch (e) {
      btn.textContent = "등록 실패";
      console.error(e);
    }
  };
  renderSilLeaderboard();
}

// ---------------------------------------------------------------- 게임5: 챌린지
// "선수 맞히기"의 확장판 - 라운드 없이 끝까지 이어간다. 힌트 카테고리를 20개까지
// 늘리고, 대신 "일회용"으로 만들었다: 어떤 카테고리든 한 번 펼쳐보면 그 판(=한
// 세션) 동안 다른 어떤 선수한테도 다시 못 쓴다(🔒로 표시). 그래서 뒤로 갈수록
// 쓸 수 있는 힌트가 줄어들고, 몇 명까지 맞히는지가 기록이 된다. 오답 3회면 종료.
//
// 수상 이력처럼 값이 여러 개인 카테고리(clubHonour/individualHonour/teammate)는
// 매번 그 중 하나를 무작위로 골라 보여준다 - 다 나열하면 그 자체로 정답에 가까운
// 스포일러가 되고 칸도 넘친다.
const CHALLENGE_CATEGORIES = [
  { key: "birthYear", label: "나이" },
  { key: "height", label: "키" },
  { key: "foot", label: "주발" },
  { key: "position", label: "포지션" },
  { key: "nationality", label: "국적" },
  { key: "birthCity", label: "출생 도시" },
  { key: "debutYear", label: "데뷔연도" },
  { key: "debutClub", label: "프로 데뷔팀" },
  { key: "youthClub", label: "유스팀" },
  { key: "currentLeague", label: "현재 소속리그" },
  { key: "currentClub", label: "현재 소속팀" },
  { key: "shirt", label: "등번호" },
  { key: "marketValue", label: "시장가치" },
  { key: "careerGoals", label: "통산 골" },
  { key: "recentSeasonRanks", label: "최근 3시즌 순위" },
  { key: "natCaps", label: "국가대표 출전" },
  { key: "natGoals", label: "국가대표 골" },
  { key: "clubHonour", label: "우승 트로피" },
  { key: "individualHonour", label: "개인 수상" },
  { key: "teammate", label: "동료 선수" },
];
const CHALLENGE_MAX_GUESSES = 3;

function pickRandomFrom(arr) {
  if (!arr || !arr.length) return null;
  return arr[Math.floor(Math.random() * arr.length)];
}

const CHALLENGE_EMPTY = "없음"; // 데이터가 없어도 칸 자체는 항상 눌러볼 수 있게, 펼치면 이 값이 나온다

// notableTeammates는 수작업으로 정리된 파일이라 이름이 유명 선수라는 보장이 없고
// (아무 동료나 적혀 있을 수 있음) 표기도 제각각이라 뺀다. teammateLinks(같은 200인
// "유명 선수" 풀 안에서 재직 기간이 겹치면 자동 계산)만 쓰면 후보가 항상 우리 풀
// 안의 유명 선수로 한정되고, 영문 이름(nameEn)을 그대로 써서 표기도 정확해진다.
function buildTeammateCandidates(p) {
  return [...new Set(
    (p.teammateLinks || [])
      .map(l => ALL_PLAYERS.find(x => x.id === l.playerId))
      .filter(Boolean)
      .map(mate => deobfuscate(mate.profile.nameEnEnc))
  )];
}

function buildChallengeHints(p) {
  const pr = p.profile;
  const career = (p.career || []).filter(c => c.startYear);
  const first = career[0];
  const nt = p.nationalTeam;
  const clubHAll = (p.clubHonours || []).map(h => `${h.label} ${h.count}회`).join(", ");
  const indHAll = (p.individualHonours || []).map(h => `${h.label} ${h.count}회`).join(", ");
  const mate = pickRandomFrom(buildTeammateCandidates(p));
  const youthClub = pickRandomFrom(p.youthClubs);
  // 유소년 시절은 빼고, 프로 데뷔 이후 소속팀 전체(임대 포함) 골을 합산한다.
  // 클럽별 goals가 비어있는 스틴트(위키에 기록이 없는 임대 등)는 그냥 건너뛴다 -
  // 알려진 스틴트가 하나도 없을 때만(사실상 없음) E로 표시한다.
  const careerGoalsKnown = (p.career || []).filter(c => c.goals != null);
  const careerGoalsTotal = careerGoalsKnown.reduce((sum, c) => sum + c.goals, 0);
  const E = CHALLENGE_EMPTY;
  return {
    birthYear: pr.birthYear ? `${pr.birthYear}년생` : E,
    height: pr.heightCm ? `${pr.heightCm}cm` : E,
    foot: pr.foot || E,
    position: positionKo(pr.position) || E,
    nationality: pr.nationalityKo || E,
    birthCity: pr.birthCity || E,
    debutYear: first ? `${first.startYear}년` : E,
    debutClub: first ? first.club : E,
    youthClub: youthClub || E,
    currentLeague: pr.currentLeague || E,
    currentClub: pr.currentClub || E,
    shirt: pr.shirt ? `${pr.shirt}번` : E,
    marketValue: pr.marketValueEUR ? `€${(pr.marketValueEUR / 1e6).toFixed(1)}M` : E,
    careerGoals: careerGoalsKnown.length ? `${careerGoalsTotal}골` : E,
    recentSeasonRanks: formatRecentRanks(p.recentSeasonRanks) || E,
    natCaps: (nt && nt.caps) ? `${nt.caps}경기` : E,
    natGoals: (nt && nt.goals != null) ? `${nt.goals}골` : E,
    // clubHonours/individualHonours가 비어 있는 건 데이터 누락이 아니라 그 선수가
    // 실제로 우승/개인 수상 기록이 없다는 사실이다 - 그래서 그냥 "없음"이 아니라
    // 어떤 항목이 비어 있는지 명확히 알 수 있는 문구로 표시한다.
    clubHonour: clubHAll || "우승 기록 없음",
    individualHonour: indHAll || "수상 기록 없음",
    teammate: mate || E,
  };
}

let challenge = null;

function startGame5() {
  logPlay("challenge");
  challenge = {
    usedCategories: new Set(), // 이번 세션 동안 소진된 카테고리 - 모든 선수 공통
    correct: 0,
    seenIds: new Set(),
    player: null, hints: null, revealed: {}, guessesLeft: CHALLENGE_MAX_GUESSES,
  };
  challengeNextPlayer();
}

function challengePickPlayer() {
  const unseen = ALL_PLAYERS.filter(p => !challenge.seenIds.has(p.id));
  if (!unseen.length) challenge.seenIds.clear();
  const pool = unseen.length ? unseen : ALL_PLAYERS;
  return pool[Math.floor(Math.random() * pool.length)];
}

function challengeNextPlayer() {
  const c = challenge;
  c.player = challengePickPlayer();
  c.seenIds.add(c.player.id);
  c.hints = buildChallengeHints(c.player);
  c.revealed = {};
  c.guessesLeft = CHALLENGE_MAX_GUESSES;
  renderChallenge();
}

function challengeGuessPlaceholder() {
  return `선수 이름을 검색해보세요 (남은 기회 ${challenge.guessesLeft}/${CHALLENGE_MAX_GUESSES})`;
}
function updateChallengeGuessPlaceholder() {
  const input = document.getElementById("challengeGuessInput");
  if (input) input.placeholder = challengeGuessPlaceholder();
}
function updateChallengeScorePill() {
  const pill = document.querySelector(".challenge-game .score-pill");
  if (pill) pill.innerHTML = `정답 <b>${challenge.correct}</b>명 · 힌트 ${challenge.usedCategories.size}/${CHALLENGE_CATEGORIES.length} 소진`;
}

function renderChallenge() {
  const c = challenge;
  render(`
    <div class="game-screen challenge-game">
      ${renderSourceBadge("challenge")}
      <div class="topbar">
        <button class="backbtn" id="backBtn">← 처음으로</button>
        <div class="score-pill">정답 <b>${c.correct}</b>명 · 힌트 ${c.usedCategories.size}/${CHALLENGE_CATEGORIES.length} 소진</div>
      </div>
      <div class="criterion-banner">🆕 힌트는 한 번 쓰면 이번 판 내내 다른 선수에게도 못 써요. 오답 <b>${CHALLENGE_MAX_GUESSES}번</b>이면 종료!</div>
      <div class="cat-grid challenge-grid" id="catGrid"></div>
      <div class="guess-wrap">
        <input id="challengeGuessInput" placeholder="${challengeGuessPlaceholder()}" autocomplete="off">
        <div class="suggest-list" id="challengeSuggestList" hidden></div>
      </div>
      <div class="wrong-msg" id="challengeWrongMsg"></div>
    </div>
  `);
  document.getElementById("backBtn").onclick = renderHome;
  wireSourceBadge();
  const grid = document.getElementById("catGrid");
  CHALLENGE_CATEGORIES.forEach(cat => {
    const usedForever = c.usedCategories.has(cat.key);
    const revealedNow = !!c.revealed[cat.key];
    const value = c.hints[cat.key];
    const available = !usedForever; // 데이터 유무와 상관없이 모든 칸이 처음엔 열려있다 - 소진 여부만 막는다
    const card = document.createElement("div");
    card.className = "cat-card"
      + (revealedNow ? " flipped" : "")
      + (usedForever && !revealedNow ? " locked" : "");
    card.dataset.key = cat.key;
    card.innerHTML = `
      <div class="cat-card-inner">
        <div class="cat-face cat-front"><span class="cat-label">${escapeHtml(cat.label)}</span><span class="cat-q">${usedForever && !revealedNow ? "🔒" : "?"}</span></div>
        <div class="cat-face cat-back"><span class="cat-label">${escapeHtml(cat.label)}</span><span class="cat-val"></span></div>
      </div>`;
    if (available && !revealedNow) {
      card.querySelector(".cat-card-inner").onclick = () => challengeRevealHint(cat.key);
    }
    grid.appendChild(card);
    if (revealedNow) setCatValText(card.querySelector(".cat-val"), cat.label, value);
  });
  wireChallengeInput();
  document.getElementById("challengeGuessInput").focus();
}

function challengeRevealHint(key) {
  const c = challenge;
  const text = c.hints[key];
  if (!text || c.revealed[key] || c.usedCategories.has(key)) return;
  c.revealed[key] = true;
  c.usedCategories.add(key);
  const card = document.querySelector(`.challenge-grid .cat-card[data-key="${key}"]`);
  if (card) {
    card.classList.add("flipped");
    const label = (CHALLENGE_CATEGORIES.find(cat => cat.key === key) || {}).label || "";
    setCatValText(card.querySelector(".cat-back .cat-val"), label, text);
    const inner = card.querySelector(".cat-card-inner");
    if (inner) inner.onclick = null;
  }
  updateChallengeScorePill();
}

// 우승 트로피/개인 수상처럼 값이 길어서 작은 카드 안에 다 안 들어가면 "...더보기"로
// 잘라 보여주고, 누르면 전체 텍스트를 작은 모달로 띄운다. 카드 폭(모바일 4열/
// 데스크탑 5열)에 따라 들어가는 글자 수가 달라서, 고정 글자수 대신 실제 렌더된
// 높이(scrollHeight vs clientHeight)를 기준으로 잘라낼 지점을 이분 탐색한다.
function setCatValText(valEl, label, fullText) {
  valEl.classList.remove("has-more");
  valEl.onclick = null;
  valEl.textContent = fullText;
  requestAnimationFrame(() => {
    if (valEl.scrollHeight <= valEl.clientHeight + 1) return; // 다 들어감
    let lo = 0, hi = fullText.length, best = 0;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      valEl.textContent = fullText.slice(0, mid) + "…더보기";
      if (valEl.scrollHeight <= valEl.clientHeight + 1) { best = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    valEl.innerHTML = `${escapeHtml(fullText.slice(0, best))}<span class="cat-more-btn">…더보기</span>`;
    valEl.classList.add("has-more");
    valEl.onclick = (e) => { e.stopPropagation(); showHintMoreModal(label, fullText); };
  });
}

function showHintMoreModal(label, text) {
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="hint-modal-card">
      <div class="hint-modal-label">${escapeHtml(label)}</div>
      <div class="hint-modal-val">${escapeHtml(text)}</div>
      <button class="close-btn" id="hintModalCloseBtn">닫기</button>
    </div>`;
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  document.getElementById("hintModalCloseBtn").onclick = () => overlay.remove();
}

  const btn = document.querySelector(".source-badge");
  if (btn) btn.onclick = () => showSourceModal(btn.dataset.source);
}

function showSourceModal(key) {
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="hint-modal-card">
      <div class="hint-modal-label">데이터 출처</div>
      <div class="hint-modal-val" style="text-align:left; word-break:normal;">${SOURCE_INFO[key] || ""}</div>
      <button class="close-btn" id="sourceModalCloseBtn">닫기</button>
    </div>`;
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  document.getElementById("sourceModalCloseBtn").onclick = () => overlay.remove();

function wireChallengeInput() {
  const input = document.getElementById("challengeGuessInput");
  input.addEventListener("input", () => renderChallengeSuggestions(input.value));
  input.addEventListener("focus", () => renderChallengeSuggestions(input.value));
}

function renderChallengeSuggestions(query) {
  const box = document.getElementById("challengeSuggestList");
  if (!box) return;
  const q = normalize(query);
  if (!q) { box.hidden = true; box.innerHTML = ""; return; }
  const matches = SEARCH_POOL.filter(name => normalize(name).includes(q));
  renderSuggestBox(box, matches, (name) => {
    box.hidden = true;
    box.innerHTML = "";
    const input = document.getElementById("challengeGuessInput");
    if (input) input.value = "";
    challengeSubmitName(name);
  });
}

async function challengeSubmitName(name) {
  const c = challenge;
  if (await isNameMatch(name, c.player)) {
    document.getElementById("challengeWrongMsg").textContent = "";
    c.correct += 1;
    showChallengeCorrectModal();
    return;
  }
  c.guessesLeft -= 1;
  if (c.guessesLeft <= 0) {
    challengeGameOver();
    return;
  }
  const msg = document.getElementById("challengeWrongMsg");
  if (msg) msg.textContent = `❌ 오답이에요! 남은 기회 ${c.guessesLeft}번`;
  const wrap = document.querySelector(".challenge-game .guess-wrap");
  if (wrap) { wrap.classList.remove("shake"); void wrap.offsetWidth; wrap.classList.add("shake"); }
  updateChallengeGuessPlaceholder();
  document.getElementById("challengeGuessInput")?.focus();
}

// 정답을 맞히면 곧바로 다음 선수로 넘기지 않고, 이번 선수한테 힌트를 몇 개 썼는지 /
// 전체 판에서 아직 안 쓴 힌트가 몇 개 남았는지 작은 모달로 보여준 뒤 "다음 문제"를
// 눌러야 넘어가게 한다 - 결과를 확인할 새도 없이 바로 다음 문제로 넘어가던 걸 개선.
function showChallengeCorrectModal() {
  const c = challenge;
  const usedThisPlayer = Object.keys(c.revealed).length;
  const remaining = CHALLENGE_CATEGORIES.length - c.usedCategories.size;
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="win-card">
      <div class="trophy">🎉</div>
      <h2>정답!</h2>
      <div class="result-line">힌트 <b>${usedThisPlayer}</b>개 사용</div>
      <div class="result-line">남은 힌트 <b>${remaining}</b>개</div>
      <button class="close-btn" id="challengeNextModalBtn">다음 문제 →</button>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById("challengeNextModalBtn").onclick = () => {
    overlay.remove();
    challengeNextPlayer();
  };
}

async function submitChallengeScore(nickname, correct) {
  const ref = doc(db, "challengeLeaderboard", "allTime", "entries", deviceId());
  const prev = await getDoc(ref);
  if (prev.exists() && prev.data().correct >= correct) return false;
  await commitLeaderboardScore("challenge", ref, { nickname, correct, updatedAt: new Date() });
  return true;
}
async function fetchChallengeLeaderboard(top = 10) {
  const q = query(collection(db, "challengeLeaderboard", "allTime", "entries"), orderBy("correct", "desc"), limit(top));
  const snap = await getDocs(q);
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

function challengeGameOver() {
  const c = challenge;
  window.FSPoints?.earn("challenge", Math.min(100, c.correct * 8), `${c.correct}명 정답`);
  render(`
    <div class="game-screen challenge-game">
      <div class="topbar">
        <button class="backbtn" id="backBtn">← 처음으로</button>
        <div></div>
      </div>
      <div class="result-card">
        <img src="${deobfuscate(c.player.profile.photoUrlEnc)}" onerror="this.style.display='none'">
        <div class="name">😢 정답은 ${escapeHtml(deobfuscate(c.player.profile.nameKoEnc))}</div>
        <div class="grade">${c.correct}<small>명 정답 · 힌트 ${c.usedCategories.size}개 사용</small></div>
      </div>
      <div class="nick-row">
        <input id="challengeNickInput" maxlength="20" placeholder="닉네임 (리더보드 등록)">
        <button id="challengeSubmitScoreBtn">기록 등록</button>
      </div>
      <div id="challengeLbBox"></div>
      <div class="btn-row">
        <button class="primary" id="challengeRetryBtn">다시 하기</button>
        <button id="challengeHomeBtn">처음으로</button>
      </div>
    </div>
  `);
  document.getElementById("backBtn").onclick = renderHome;
  document.getElementById("challengeHomeBtn").onclick = renderHome;
  document.getElementById("challengeRetryBtn").onclick = startGame5;
  document.getElementById("challengeSubmitScoreBtn").onclick = async () => {
    const nickname = (document.getElementById("challengeNickInput").value || "익명").slice(0, 20);
    const btn = document.getElementById("challengeSubmitScoreBtn");
    btn.disabled = true; btn.textContent = "등록 중…";
    try {
      const improved = await submitChallengeScore(nickname, c.correct);
      await renderChallengeLeaderboard();
      rankBonus("challenge", improved, () => fetchChallengeLeaderboard(10));
      btn.textContent = "등록 완료";
    } catch (e) {
      btn.textContent = "등록 실패";
      console.error(e);
    }
  };
  renderChallengeLeaderboard();
}

async function renderChallengeLeaderboard() {
  const box = document.getElementById("challengeLbBox");
  if (!box) return;
  box.innerHTML = `<div class="sub">리더보드 불러오는 중…</div>`;
  try {
    const rows = await fetchChallengeLeaderboard(10);
    const my = deviceId();
    box.innerHTML = `<table class="lb"><tr><th>#</th><th>닉네임</th><th>정답</th></tr>${
      rows.map((r, i) => `<tr class="${r.id === my ? 'me' : ''}"><td>${i + 1}</td><td>${escapeHtml(r.nickname)}</td><td>${escapeHtml(r.correct)}</td></tr>`).join("")
    }</table>`;
  } catch (e) {

// 개인전은 게임1/4와 동일하게 SEARCH_POOL(영문 이름 9천여 개), 팀전은
// TEAM_POOL(구단명) 대상으로 검색한다. 기회는 문제당 딱 1번 - 틀리면 바로
// 정답 공개. 리더보드 없이 마지막에 몇 문제 맞혔는지 결과 화면만 보여준다.

const REC_ROUND_SIZE = 10;
let rec = null; // 게임6 현재 판 상태 ({ mode: "player"|"team", order, idx, correct })

// 정답이 공개된(맞혔든 틀렸든) 문제는 로컬에 기록해두고, 다음 판을 고를 때
// 뒷순위로 미룬다 - 풀을 다 겪기 전까지는 최대한 안 본 문제가 먼저 나오게.
// 개인/팀은 풀이 완전히 달라서 "본 문제" 기록도 따로 관리한다.
function recSeenKey(mode) {
  return mode === "team" ? "recSeenItemsTeam" : "recSeenItems";
}
function getRecSeenIds(mode) {
  try { return new Set(JSON.parse(localStorage.getItem(recSeenKey(mode)) || "[]")); }
  catch { return new Set(); }
}
function markRecSeen(mode, itemId) {
  const seen = getRecSeenIds(mode);
  seen.add(itemId);
  localStorage.setItem(recSeenKey(mode), JSON.stringify([...seen]));
}
function pickRecRoundItems(mode, pool, n) {
  const seen = getRecSeenIds(mode);
  const unseen = pool.filter(it => !seen.has(it.id));
  const alreadySeen = pool.filter(it => seen.has(it.id));
  const ordered = [...shuffle(unseen), ...shuffle(alreadySeen)];
  return ordered.slice(0, Math.min(n, ordered.length));
}

async function startGame6(mode) {
  logPlay(mode === "team" ? "records-guess-team" : "records-guess-player");
  render(`<div class="loading">불러오는 중…</div>`);
  let pool;
  if (mode === "team") {
    await Promise.all([loadTeamRecordsPool(), loadTeamPool()]);
    pool = TEAM_RECORDS_POOL;
  } else {
    mode = "player";
    await loadRecordsPool();
    pool = RECORDS_POOL;
  }
  const order = pickRecRoundItems(mode, pool, REC_ROUND_SIZE);
  rec = { mode, order, idx: 0, correct: 0 };
  renderGame6();
}

async function recIsMatch(name, item) {
  return matchesHash(name, item.answerHash);
}

function renderGame6() {
  const s = rec;

function renderRecSuggestions(query) {
  const box = document.getElementById("recSuggestList");
  if (!box) return;
  const q = normalize(query);
  if (!q) { box.hidden = true; box.innerHTML = ""; return; }
  const pool = rec.mode === "team" ? TEAM_POOL : SEARCH_POOL;
  const matches = pool.filter(name => normalize(name).includes(q));
  renderSuggestBox(box, matches, (name) => {
    box.hidden = true;
    box.innerHTML = "";
    recSubmit(name);
  });
}

function wireRecInput() {
  const input = document.getElementById("recGuessInput");
  input.addEventListener("input", () => renderRecSuggestions(input.value));
  input.addEventListener("focus", () => renderRecSuggestions(input.value));
}

async function recSubmit(name) {
  const item = rec.order[rec.idx];
  const wasCorrect = await recIsMatch(name, item);
  if (wasCorrect) rec.correct += 1;
  renderRecReveal(wasCorrect, item);
}

function renderRecReveal(wasCorrect, item) {
  const s = rec;
  markRecSeen(s.mode, item.id);
  const isFinal = s.idx + 1 >= s.order.length;
  render(`
    <div class="game-screen">
      <div class="topbar">
        <button class="backbtn" id="backBtn">← 처음으로</button>

  document.getElementById("recNextBtn").onclick = recAdvance;
}

function recAdvance() {
  if (rec.idx + 1 >= rec.order.length) { renderRecFinish(); return; }
  rec.idx += 1;
  renderGame6();
}

function renderRecFinish() {
  const s = rec;
  window.FSPoints?.earn(s.mode === "team" ? "records-team" : "records-player",
    s.correct * 6 + (s.correct === s.order.length ? 20 : 0), `${s.correct}/${s.order.length} 정답`);
  render(`

      </div>

}

// 스핀 애니메이션 도중 사진이 늦게 로드되어 빈 프레임이 스치는 걸 막기 위해
// 120명 사진을 미리 한 번에 브라우저 캐시에 앉혀둔다 - 같은 120장을 반복해서
// 뽑는 구조라(복원추출) 한 번만 받아두면 이후 모든 스핀은 네트워크 지연 없이 돈다.
function big6PreloadImage(src) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      // onload는 바이트를 다 받았다는 뜻일 뿐 디코딩까지 끝났다는 보장은 아니다 -
      // decode()까지 기다려야 스핀 중 새로 끼워 넣는 <img>가 첫 프레임부터 바로
      // 그려진다(디코딩 대기 때문에 빈 채로 한 박자 스치는 걸 막기 위함).
      if (img.decode) img.decode().then(resolve).catch(resolve);
      else resolve();
    };
    img.onerror = () => resolve();
    img.src = src;
  });
}
function big6PreloadAllPhotos() {
  return Promise.all(BIG6_PLAYERS.map(p => big6PreloadImage(p.profileImage)));
}

function big6TeamCounts(hand) {
  const c = {};
  BIG6_TEAMS.forEach(t => c[t] = 0);
  hand.forEach(p => c[p.team]++);
  return c;
}
// GK(골키퍼)는 족보가 없어 카운트 대상에서 아예 뺀다 - 골키퍼 카드는 POSITION
// 점수에 기여하지 않는다.
function big6PositionCounts(hand) {
  const c = { FWD: 0, MID: 0, DEF: 0 };
  hand.forEach(p => { if (c[p.positionGroup] !== undefined) c[p.positionGroup]++; });
  return c;
}
// 특수 족보(스트레이트/풀하우스/포카인드/야찌)는 팀별 카드 개수를 내림차순
// 정렬하면 전부 이 배열 하나로 판정된다 (기획서 18장).
function big6ScoreFor(key, hand) {
  const tc = big6TeamCounts(hand);
  if (BIG6_TEAMS.includes(key)) return tc[key] * 5;
  if (key === "FWD" || key === "MID" || key === "DEF") return big6PositionCounts(hand)[key] * 3;
  const sorted = Object.values(tc).sort((a, b) => b - a);
  if (key === "STRAIGHT") return sorted.filter(x => x > 0).length === 5 ? 20 : 0;
  if (key === "FULL_HOUSE") return (sorted[0] === 3 && sorted[1] === 2) ? 30 : 0;
  if (key === "FOUR_KIND") return sorted[0] >= 4 ? 40 : 0;
  if (key === "YAHTZEE") return sorted[0] === 5 ? 50 : 0;
  return 0;
}
function big6TeamSubtotal(scores) {
  return BIG6_TEAMS.reduce((sum, t) => sum + (scores[t] || 0), 0);
}
function big6TeamBonusEligible(scores) {
  return big6TeamSubtotal(scores) >= BIG6_TEAM_BONUS_THRESHOLD;
}
function big6PositionSubtotal(scores) {
  return BIG6_POSITIONS.reduce((sum, k) => sum + (scores[k] || 0), 0);
}
function big6PositionBonusEligible(scores) {
  return big6PositionSubtotal(scores) >= BIG6_POSITION_BONUS_THRESHOLD;
}
function big6Total(scores) {
  let total = 0;
  BIG6_CATEGORIES.forEach(c => { total += scores[c.key] || 0; });
  if (BIG6_TEAMS.every(t => scores[t] !== null) && big6TeamBonusEligible(scores)) total += BIG6_TEAM_BONUS_SCORE;
  if (BIG6_POSITIONS.every(k => scores[k] !== null) && big6PositionBonusEligible(scores)) total += BIG6_POSITION_BONUS_SCORE;
  return total;
}

  await preloadPromise; // 모달을 바로 닫아도(또는 생략돼도) 첫 뽑기 스핀 전에는 사진이 준비되게 기다린다
  big6 = { round: 1, drawCount: 0, hand: big6EmptyHand(), held: new Set(), scores: big6InitScores(), drawn: false };
  renderGame8();
}

// 라운드 시작 시엔 카드를 바로 뽑지 않고 빈 칸으로 두고, 버튼을 눌러야 첫 5장이
// 돈다(초기 드로우는 리롤 횟수에 포함되지 않는다). 이후엔 같은 버튼이 "다시
// 뽑기"로 바뀐다.
function big6InitialDraw() {
  if (big6Animating || big6.drawn) return;
  const finalHand = big6DrawHand();
  big6RunSpin([0, 1, 2, 3, 4], finalHand, () => {
    if (!big6) return;
    big6.hand = finalHand;
    big6.drawn = true;
  });
}
function big6Reroll() {
  const s = big6;
  if (big6Animating || !s.drawn || s.drawCount >= BIG6_MAX_REROLLS) return;
  const spinIdx = s.hand.map((_, i) => i).filter(i => !s.held.has(i));
  if (!spinIdx.length) { s.drawCount += 1; big6MaybeClearHolds(); big6UpdateDrawBtn(); return; } // 전부 HOLD면 돌릴 카드가 없다
  const finalHand = s.hand.map((p, i) => s.held.has(i) ? p : big6DrawOne());
  big6RunSpin(spinIdx, finalHand, () => {
    if (!big6) return;
    big6.hand = finalHand;
    big6.drawCount += 1;
    big6MaybeClearHolds();
  });
}
function big6DrawBtnClick() {
  if (!big6.drawn) big6InitialDraw();
  else big6Reroll();
}
// 마지막 재굴림(2번째)까지 다 쓰고 나면 더 이상 돌릴 기회가 없어서 HOLD가
// 아무 의미도 없다 - 자동으로 전부 풀고, 다시 못 누르게 막는다.
function big6MaybeClearHolds() {
  const s = big6;
  if (!s || s.drawCount < BIG6_MAX_REROLLS || !s.held.size) return;
  s.held.forEach(i => {
    const card = document.querySelector(`.b6-card[data-idx="${i}"]`);
    if (card) card.classList.remove("held");
  });
  s.held.clear();
}
function big6ToggleHold(i) {
  if (big6Animating) return;
  const s = big6;
  if (!s.drawn || !s.hand[i]) return; // 아직 안 뽑힌 빈 칸은 HOLD할 게 없다
  if (s.drawCount >= BIG6_MAX_REROLLS) return; // 재굴림을 다 썼으면 HOLD는 더 이상 의미가 없다
  if (s.held.has(i)) s.held.delete(i); else s.held.add(i);
  // renderGame8() 전체를 다시 그리면 <img>가 통째로 새로 생성되면서 캐시된
  // 사진이어도 한 프레임 깜빡인다 - HOLD는 점수판에 영향이 없으므로(다음
  // 재굴림에서 어떤 칸을 지킬지 표시하는 것뿐) 해당 카드의 클래스만 토글한다.
  const card = document.querySelector(`.b6-card[data-idx="${i}"]`);
  if (card) card.classList.toggle("held", s.held.has(i));
}

function big6WireCard(el) {
  el.onclick = () => big6ToggleHold(Number(el.dataset.idx));
}
// 카드 한 장의 DOM만 통째로 교체하고 새 노드에 클릭 핸들러를 다시 건다 - 화면
// 전체를 다시 그리면(renderGame8) HOLD된 다른 카드들의 <img>까지 새로 생성되며
// 깜빡이므로, 리롤 중엔 실제로 바뀌는 칸만 이렇게 targeted로 건드린다.
function big6SetCardSlot(i, html) {
  const card = document.querySelector(`.b6-card[data-idx="${i}"]`);
  if (!card) return;
  const temp = document.createElement("div");
  temp.innerHTML = html.trim();
  const newCard = temp.firstElementChild;
  card.replaceWith(newCard);
  if (!newCard.classList.contains("empty")) big6WireCard(newCard);
}
function big6UpdateDrawBtn() {
  const s = big6;
  const btn = document.getElementById("b6RerollBtn");
  if (!btn || !s) return;
  const rerollsLeft = BIG6_MAX_REROLLS - s.drawCount;
  btn.textContent = !s.drawn ? "카드 뽑기" : `다시 뽑기 (남은 기회 ${rerollsLeft}/${BIG6_MAX_REROLLS})`;
  btn.disabled = s.drawn && rerollsLeft <= 0;
}

// spinIdx 자리만 "?" 카드로 바꿔 잠깐 흔들리는 걸 보여주고(사진은 전혀 그리지
// 않는다 - 로딩 문제를 원천 차단), 다 끝나면 onDone에서 실제 결과를 반영한 뒤
// 그 자리만 다시 targeted로 교체한다. HOLD된 카드 등 나머지 칸은 이 스핀
// 사이클 내내 DOM에 전혀 손대지 않아 깜빡이지 않는다.
function big6RunSpin(spinIdx, finalHand, onDone) {
  big6Animating = true;
  spinIdx.forEach(i => big6SetCardSlot(i, big6SpinCardHtml(i)));
  const btn = document.getElementById("b6RerollBtn");
  if (btn) btn.disabled = true;
  setTimeout(() => {
    big6Animating = false;
    onDone();
    if (!big6) return; // 스핀 도중 처음으로 나가버린 경우
    spinIdx.forEach(i => big6SetCardSlot(i, big6CardHtml(big6.hand[i], i, big6)));
    big6UpdateDrawBtn();
    renderBig6Sheet();
  }, BIG6_SPIN_MS);
}

function renderBig6Sheet() {
  const box = document.getElementById("b6Sheet");

  box.innerHTML = BIG6_SECTIONS.map(sec => {

    const bonusHtml = sec.key === "team" ? big6BonusInlineHtml(s.scores)
      : sec.key === "position" ? big6PositionBonusInlineHtml(s.scores)

    return `

      ${bonusHtml}
    </div>
    <div class="b6-tile-grid ${gridClass}">
      ${items.map(c => {
        const used = s.scores[c.key] !== null;

        // 대신 클릭은 안 되게 "locked"로 막는다.
        let tileClass, scoreText;
        if (used) { tileClass = "used"; scoreText = s.scores[c.key]; }
        else if (ready) { tileClass = ""; scoreText = "+" + big6ScoreFor(c.key, s.hand); }
        else { tileClass = "locked"; scoreText = "0"; }
        return `
          <div class="b6-tile ${tileClass}" data-key="${c.key}">
            <div class="b6-tile-label">${escapeHtml(c.label)}</div>
            <div class="b6-tile-score">${scoreText}</div>

      }).join("")}

  }).join("");

function big6ConfirmCategory(key) {
  if (big6Animating) return;

function big6CommitCategory(key, score) {
  const s = big6;

  if (s.round >= BIG6_TOTAL_ROUNDS) {

  s.round += 1;

  s.hand = big6EmptyHand();

  await commitLeaderboardScore("big6-yahtzee", ref, { nickname, score, updatedAt: new Date() });

}
async function fetchBig6Leaderboard(top = 10) {
  const q = query(collection(db, "big6Leaderboard", "allTime", "entries"), orderBy("score", "desc"), limit(top));
  const snap = await getDocs(q);
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

}

function big6Finish() {
  const s = big6;
  const teamSubtotal = big6TeamSubtotal(s.scores);
  const bonus = big6TeamBonusEligible(s.scores) ? BIG6_TEAM_BONUS_SCORE : 0;

      <div id="b6LbBox"></div>

      </div>
    </div>
  `);
  document.getElementById("backBtn").onclick = renderHome;
  document.getElementById("b6HomeBtn").onclick = renderHome;
  document.getElementById("b6RetryBtn").onclick = startGame8;
  document.getElementById("b6SubmitScoreBtn").onclick = async () => {

      rankBonus("big6", improved, () => fetchBig6Leaderboard(10));
      btn.textContent = improved ? "등록 완료" : "이미 더 높은 기록 보유";
    } catch (e) {
      btn.textContent = "등록 실패";
      console.error(e);
    }
  };
  renderBig6Leaderboard();

// ---------------------------------------------------------------- game 9: CAPTCHA speedrun

const CAPTCHA_QUESTION_GROUPS = [
  ["teamId"],
  ["leagueId"],
  ["countryCode"],
  ["positionGroup"],
  ["cityGroup"],
];
const CAPTCHA_REFRESH_TYPES = CAPTCHA_QUESTION_GROUPS.flat();
const CAPTCHA_TYPE_LABELS = {
  teamId: p => `${p.teamKo} 소속`,
  leagueId: p => `${p.leagueKo} 소속`,
  countryCode: p => `${p.countryKo} 국적`,
  positionGroup: p => `${p.positionKo}`,
  cityGroup: p => p.cityKo,
};
let captchaState = null;
let captchaGeneration = 0;
let captchaCountdownInterval = null;
let captchaCountdownTimeout = null;
let captchaCountdownResolve = null;
const CAPTCHA_COUNTDOWN_MS = 3000;
let captchaTimerFrame = null;
let captchaFeedbackTimeout = null;

function cleanupCaptcha() {
  captchaGeneration += 1;
  if (captchaCountdownInterval !== null) clearInterval(captchaCountdownInterval);
  if (captchaCountdownTimeout !== null) clearTimeout(captchaCountdownTimeout);
  if (captchaCountdownResolve) captchaCountdownResolve(false);
  if (captchaTimerFrame !== null) cancelAnimationFrame(captchaTimerFrame);
  if (captchaFeedbackTimeout !== null) clearTimeout(captchaFeedbackTimeout);
  captchaCountdownInterval = null;
  captchaCountdownTimeout = null;
  captchaCountdownResolve = null;
  captchaTimerFrame = null;
  captchaFeedbackTimeout = null;
  captchaState = null;
  return captchaGeneration;
}

function captchaPredicate(player, condition) {
  return String(player[condition.key]) === condition.value;
}

function buildCaptchaQuestion(players, key, excludedConditions = new Set(), blockedIds = new Set()) {
  const available = players.filter(player => !blockedIds.has(String(player.id)));
  const values = new Map();
  for (const player of available) {
    const value = String(player[key] ?? "");
    if (!value || excludedConditions.has(`${key}:${value}`)) continue;
    if (!values.has(value)) values.set(value, []);
    values.get(value).push(player);
  }
  for (const [value, matches] of shuffle([...values.entries()]).slice(0, 100)) {
    const distractors = available.filter(player => String(player[key]) !== value);
    // 정답 수가 너무 적거나 많으면 클릭 난이도가 한쪽으로 치우친다.
    // 모든 문제는 9명 중 정답이 3~6명이 되도록 구성한다.
    const validCounts = shuffle([3, 4, 5, 6]).filter(count =>
      matches.length >= count && distractors.length >= 9 - count
    );
    if (!validCounts.length) continue;
    const answerCount = validCounts[0];
    const answerPlayers = shuffle(matches).slice(0, answerCount);
    const cards = shuffle([...answerPlayers, ...shuffle(distractors).slice(0, 9 - answerCount)]);
    return {
      condition: { key, value, label: CAPTCHA_TYPE_LABELS[key](matches[0]) },
      cards,
      answerIds: answerPlayers.map(player => String(player.id)),
    };
  }
  return null;
}

function buildCaptchaRound(players) {
  if (!Array.isArray(players) || players.length < 45) throw new Error("선수 데이터가 부족합니다.");
  for (let roundAttempt = 0; roundAttempt < 300; roundAttempt += 1) {
    const blockedIds = new Set();
    const usedConditions = new Set();
    const questions = [];
    const questionTypes = shuffle(CAPTCHA_QUESTION_GROUPS.map(group => shuffle(group)[0]));
    for (const key of questionTypes) {
      const made = buildCaptchaQuestion(players, key, usedConditions, blockedIds);
      if (!made) break;
      questions.push(made);
      usedConditions.add(`${made.condition.key}:${made.condition.value}`);
      made.cards.forEach(player => blockedIds.add(String(player.id)));
    }
    if (questions.length === 5) return questions;
  }
  throw new Error("서로 겹치지 않는 5문제를 만들 수 없습니다.");
}

async function loadCaptchaPlayers() {
  const response = await fetch("data/captcha_players.json", { cache: "no-cache" });
  if (!response.ok) throw new Error(`선수 데이터 요청 실패 (${response.status})`);
  const payload = await response.json();
  const players = payload.players;
  if (!Array.isArray(players) || players.length < 45) throw new Error("선수 데이터 형식이 올바르지 않습니다.");
  for (const player of players) {
    if (!player.id || !player.name || !player.photo || !player.teamId || !player.leagueId ||
        !player.countryCode || !player.countryKo || !player.continentId || !player.continentKo ||
        !player.positionGroup || !player.positionDetailGroup) throw new Error("필수 선수 정보가 빠져 있습니다.");
  }
  return players;
}

function preloadCaptchaPhoto(player) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = async () => {
      try {
        if (image.decode) await image.decode();
        resolve();
      } catch (error) {
        reject(new Error(`${player.name} 사진 해독 실패`));
      }
    };
    image.onerror = () => reject(new Error(`${player.name} 사진 로드 실패`));
    image.src = player.photo;
  });
}

function runCaptchaCountdown(token) {
  const started = performance.now();
  const update = () => {
    if (token !== captchaGeneration) return;
    const number = document.getElementById("captchaCountdownNumber");
    if (number) number.textContent = Math.max(1, Math.ceil((CAPTCHA_COUNTDOWN_MS - (performance.now() - started)) / 1000));
  };
  update();
  captchaCountdownInterval = setInterval(update, 100);
  return new Promise(resolve => {
    captchaCountdownResolve = resolve;
    captchaCountdownTimeout = setTimeout(() => {
      clearInterval(captchaCountdownInterval);
      captchaCountdownInterval = null;
      captchaCountdownTimeout = null;
      captchaCountdownResolve = null;
      resolve(true);
    }, CAPTCHA_COUNTDOWN_MS);
  });
}

async function waitForCaptchaPaint() {
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
}

async function startCaptchaGame() {
  const token = cleanupCaptcha();
  logPlay("captcha-speedrun");
  render(`
    <div class="captcha-screen captcha-countdown">
      <button class="backbtn" id="captchaCountdownBack">← 처음으로</button>
      <div class="captcha-countdown-number" id="captchaCountdownNumber">3</div>
      <h1>선수 CAPTCHA 준비!</h1>
      <div class="captcha-countdown-status">문제와 선수 사진을 미리 불러오는 중…</div>
      <div class="captcha-source">선수·소속 정보 및 사진: FotMob 스쿼드 데이터</div>
    </div>
  `);
  document.getElementById("captchaCountdownBack").onclick = renderHome;

  try {
    const playersPromise = loadCaptchaPlayers();
    const roundPromise = playersPromise.then(buildCaptchaRound);
    const preloadPromise = playersPromise.then(players => Promise.all(players.map(preloadCaptchaPhoto)));
    await Promise.all([runCaptchaCountdown(token), roundPromise, preloadPromise]);
    if (token !== captchaGeneration) return;
    const players = await playersPromise;
    const questions = await roundPromise;
    captchaState = {
      players, questions, index: 0, selected: new Set(), wrong: 0, startAt: null, replacing: false,
      usedConditions: new Set(questions.map(q => `${q.condition.key}:${q.condition.value}`)),
    };
    renderCaptchaQuestion();
    await waitForCaptchaPaint();
    if (token !== captchaGeneration || !captchaState) return;
    captchaState.startAt = performance.now();
    updateCaptchaTimer(token);
  } catch (error) {
    if (token !== captchaGeneration) return;
    console.error("CAPTCHA preparation failed", error);
    renderCaptchaError();
  }
}

function renderCaptchaError() {
  render(`
    <div class="captcha-screen"><div class="captcha-error">
      <div style="font-size:42px">🛠️</div><h1>준비하지 못했어요</h1>
      <p class="sub">데이터나 사진을 불러오지 못했습니다. 연결을 확인한 뒤 다시 시도해 주세요.</p>
      <button class="primary" id="captchaRetryBtn">다시 시도</button>
      <button id="captchaErrorHome">처음으로</button>
    </div></div>
  `);
  document.getElementById("captchaRetryBtn").onclick = startCaptchaGame;
  document.getElementById("captchaErrorHome").onclick = renderHome;
}

function renderCaptchaQuestion() {
  const s = captchaState;
  if (!s) return;
  const question = s.questions[s.index];
  render(`
    <div class="captcha-screen">
      <div class="captcha-topbar">
        <button class="backbtn" id="captchaBackBtn">← 홈</button>
        <div class="captcha-timer" id="captchaTimer">${captchaElapsedText(s)}</div>
      </div>
      <div class="captcha-box">
        <div class="captcha-prompt">
          <div class="captcha-prompt-copy"><span>다음 조건에 맞는 선수를 모두 선택하세요</span><strong>${escapeHtml(question.condition.label)}</strong><small>해당 선수를 빠짐없이 선택한 뒤 제출을 누르세요.</small></div>
          <div class="captcha-round" aria-label="현재 라운드">${s.index + 1} / 5</div>
        </div>
        <div class="captcha-grid">
          ${question.cards.map((player, index) => `
            <button class="captcha-card" type="button" aria-label="선수 사진 ${index + 1}" aria-pressed="false">
              <img src="${escapeHtml(player.photo)}" alt="" draggable="false">
            </button>
          `).join("")}
        </div>
        <div class="captcha-actions">
          <button class="captcha-refresh" id="captchaRefreshBtn" type="button" aria-label="새 문제로 교체" title="새 문제로 교체">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.1A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35Z"/></svg>
          </button>
          <div class="captcha-feedback" id="captchaFeedback" role="status" aria-live="polite"></div>
          <button class="captcha-submit" id="captchaSubmitBtn">제출</button>
        </div>
      </div>
      <div class="captcha-source">데이터와 선수 사진 출처: FotMob</div>
    </div>
  `);
  document.getElementById("captchaBackBtn").onclick = renderHome;
  document.querySelectorAll(".captcha-card").forEach((card, index) => {
    card.onclick = () => {
      if (s.replacing) return;
      const id = String(question.cards[index].id);
      if (s.selected.has(id)) s.selected.delete(id); else s.selected.add(id);
      const selected = s.selected.has(id);
      card.classList.toggle("selected", selected);
      card.setAttribute("aria-pressed", String(selected));
      const feedback = document.getElementById("captchaFeedback");
      if (feedback) feedback.textContent = "";
    };
  });
  document.getElementById("captchaRefreshBtn").onclick = refreshCaptchaQuestion;
  document.getElementById("captchaSubmitBtn").onclick = submitCaptchaAnswer;
}

function updateCaptchaTimer(token) {
  if (token !== captchaGeneration || !captchaState?.startAt) return;
  const timer = document.getElementById("captchaTimer");
  if (timer) timer.textContent = `${((performance.now() - captchaState.startAt) / 1000).toFixed(3)}초`;
  captchaTimerFrame = requestAnimationFrame(() => updateCaptchaTimer(token));
}

function captchaElapsedText(state) {
  return state?.startAt ? `${((performance.now() - state.startAt) / 1000).toFixed(3)}초` : "0.000초";
}

function buildCaptchaReplacement(state, keys) {
  const current = state.questions[state.index];
  const currentCardIds = new Set(current.cards.map(player => String(player.id)));
  for (const key of shuffle(keys)) {
    const replacement = buildCaptchaQuestion(state.players, key, state.usedConditions, currentCardIds);
    if (replacement) return replacement;
  }
  // 오래 플레이해 새 조건이 소진되면 방금 본 조건만 피한다. 사진판은 항상 전부 바꾼다.
  const justFailed = new Set([`${current.condition.key}:${current.condition.value}`]);
  for (const key of shuffle(keys)) {
    const replacement = buildCaptchaQuestion(state.players, key, justFailed, currentCardIds);
    if (replacement) return replacement;
  }
  return null;
}

function finishCaptchaReplacement(state, replacement) {
  if (!replacement) {
    cleanupCaptcha();
    renderCaptchaError();
    return;
  }
  state.questions[state.index] = replacement;
  state.usedConditions.add(`${replacement.condition.key}:${replacement.condition.value}`);
  state.selected = new Set();
  state.replacing = false;
  renderCaptchaQuestion();
}

function refreshCaptchaQuestion() {
  const s = captchaState;
  if (!s?.startAt || s.replacing) return;
  s.replacing = true;
  document.querySelectorAll(".captcha-card, #captchaRefreshBtn, #captchaSubmitBtn").forEach(element => { element.disabled = true; });
  const grid = document.querySelector(".captcha-grid");
  if (grid) {
    grid.className = "captcha-grid is-loading";
    grid.innerHTML = `<div class="captcha-loader" role="status"><div class="captcha-loader-ring" aria-hidden="true"></div><span>새 문제를 준비하는 중…</span></div>`;
  }
  const token = captchaGeneration;
  captchaFeedbackTimeout = setTimeout(() => {
    captchaFeedbackTimeout = null;
    if (token !== captchaGeneration || captchaState !== s) return;
    finishCaptchaReplacement(s, buildCaptchaReplacement(s, CAPTCHA_REFRESH_TYPES));
  // 연타를 막고 오답 교체 때와 같은 로딩 시간을 보여준다.
  }, 600);
}

function submitCaptchaAnswer() {
  const s = captchaState;
  if (!s?.startAt || s.replacing) return;
  const answers = new Set(s.questions[s.index].answerIds);
  const correct = s.selected.size === answers.size && [...s.selected].every(id => answers.has(id));
  if (!correct) {
    s.wrong += 1;
    s.replacing = true;
    document.querySelectorAll(".captcha-card, #captchaRefreshBtn, #captchaSubmitBtn").forEach(element => { element.disabled = true; });
    const token = captchaGeneration;
    const grid = document.querySelector(".captcha-grid");
    const feedback = document.getElementById("captchaFeedback");
    if (grid) {
      grid.className = "captcha-grid is-loading";
      grid.innerHTML = `<div class="captcha-loader is-error" role="status"><div class="captcha-loader-ring" aria-hidden="true"></div><span>오답입니다.</span></div>`;
    }
    if (feedback) feedback.textContent = "";
    captchaFeedbackTimeout = setTimeout(() => {
      captchaFeedbackTimeout = null;
      if (token !== captchaGeneration || captchaState !== s) return;
      finishCaptchaReplacement(s, buildCaptchaReplacement(s, [s.questions[s.index].condition.key]));
    }, 600);
    return;
  }
  if (s.index === s.questions.length - 1) {
    const elapsedMs = performance.now() - s.startAt;
    if (captchaTimerFrame !== null) cancelAnimationFrame(captchaTimerFrame);
    captchaTimerFrame = null;
    renderCaptchaResult(elapsedMs);
    return;
  }
  s.index += 1;
  s.selected = new Set();
  renderCaptchaQuestion();
}

async function submitCaptchaScore(nickname, elapsedMs) {
  const ref = doc(db, "captchaLeaderboard", "allTime", "entries", deviceId());
  const previous = await getDoc(ref);
  if (previous.exists() && previous.data().elapsedMs <= elapsedMs) return false;
  await commitLeaderboardScore("captcha-speedrun", ref, { nickname, elapsedMs, updatedAt: new Date() });
  return true;
}

async function fetchCaptchaLeaderboard(top = 10) {
  const q = query(collection(db, "captchaLeaderboard", "allTime", "entries"), orderBy("elapsedMs", "asc"), limit(top));
  const snap = await getDocs(q);
  return snap.docs.map(item => ({ id: item.id, ...item.data() }));
}

async function renderCaptchaLeaderboard() {
  const body = document.getElementById("captchaLeaderboardBody");
  if (!body) return;
  try {
    const rows = await fetchCaptchaLeaderboard();
    const mine = deviceId();
    body.innerHTML = rows.length ? rows.map((row, index) => {
      const rank = rows.findIndex(other => other.elapsedMs === row.elapsedMs) + 1;
      return `<tr class="${row.id === mine ? "me" : ""}"><td>${rank}</td><td>${escapeHtml(row.nickname)}</td><td>${(row.elapsedMs / 1000).toFixed(3)}초</td></tr>`;
    }).join("") : `<tr><td colspan="3">아직 기록이 없습니다.</td></tr>`;
  } catch (error) {
    console.error("CAPTCHA leaderboard failed", error);
    body.innerHTML = `<tr><td colspan="3">순위표를 불러오지 못했습니다.</td></tr>`;
  }
}

function renderCaptchaResult(elapsedMs) {
  const finalElapsedMs = Math.max(1, Math.round(elapsedMs));
  const sec = finalElapsedMs / 1000, wrong = captchaState?.wrong || 0;
  window.FSPoints?.earn("captcha", Math.max(5, 25 + (sec < 15 ? 25 : sec < 30 ? 15 : sec < 60 ? 5 : 0) - 5 * wrong),
    `${sec.toFixed(1)}초${wrong ? ` · 오답 ${wrong}` : ""}`);
  render(`
    <div class="captcha-screen"><div class="captcha-result">
      <div class="captcha-result-mark" aria-hidden="true">✅</div><h1>5문제 완료!</h1>
      <div class="captcha-result-time">${(finalElapsedMs / 1000).toFixed(3)}초</div>
      <div class="nick-row"><input id="captchaNickInput" maxlength="20" placeholder="닉네임"><button class="primary" id="captchaScoreBtn">기록 등록</button></div>
      <table class="lb"><thead><tr><th>순위</th><th>닉네임</th><th>시간</th></tr></thead><tbody id="captchaLeaderboardBody"><tr><td colspan="3">불러오는 중…</td></tr></tbody></table>
      <div class="captcha-result-actions">
        <button class="captcha-result-btn primary" id="captchaAgainBtn">다시 도전</button>
        <button class="captcha-result-btn" id="captchaResultHome">처음으로</button>
      </div>
      <div class="captcha-source">데이터와 선수 사진 출처: FotMob</div>
    </div></div>
  `);
  document.getElementById("captchaAgainBtn").onclick = startCaptchaGame;
  document.getElementById("captchaResultHome").onclick = renderHome;
  document.getElementById("captchaScoreBtn").onclick = async () => {
    const nickname = (document.getElementById("captchaNickInput").value.trim() || "익명").slice(0, 20);
    const button = document.getElementById("captchaScoreBtn");
    button.disabled = true;
    button.textContent = "등록 중…";
    try {
      const improved = await submitCaptchaScore(nickname, finalElapsedMs);
      await renderCaptchaLeaderboard();
      rankBonus("captcha", improved, () => fetchCaptchaLeaderboard(10));
      button.textContent = improved ? "등록 완료" : "이미 더 빠른 기록 보유";
    } catch (error) {
      console.error(error);
      button.disabled = false;
      button.textContent = "등록 실패 · 다시 시도";
    }
  };
  renderCaptchaLeaderboard();
}

// ---------------------------------------------------------------- boot

(async function boot() {
  try {
    await Promise.all([loadPlayers(), loadSearchPool()]);
    if (!ALL_PLAYERS.length) {
      render(`<div class="loading">아직 선수 데이터가 준비되지 않았습니다.</div>`);
      return;
    }
    renderHome();
  } catch (e) {
    console.error(e);
    render(`<div class="loading">데이터를 불러오는 중 오류가 발생했습니다.</div>`);
  }
})();
</script>

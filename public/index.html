<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>축구 게임</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="football-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff6ec; --panel: #ffffff; --panel2: #fff0dc; --border: #ffd9a8;
    --text: #4a3b31; --muted: #b08968; --accent: #ff8fab; --accent2: #35c4a1;
    --danger: #ff6b6b; --warn: #ffb545;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden;
    -webkit-user-select: none; user-select: none;
  }
  input, textarea, [contenteditable="true"] { -webkit-user-select: text; user-select: text; }
  .wrap { width: 100%; max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; overflow-x: clip; }
  h1 { font-family: 'Jua', sans-serif; font-size: 26px; margin: 8px 0 4px; color: #ff6f91; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; }

  .home-screen {
    min-height: 80vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
  }
  .home-screen .modes { width: 100%; }
  /* 포인트/카드팩 버튼의 화면 모서리 여백: 폰·작은 창(폭 640px 또는 높이 620px 이하)에선 모서리에
     거의 붙고, 화면이 넓고 높을수록 조금씩 벌어져 큰 화면에선 최대 28px/22px까지 띄운다.
     세로 여백은 폭도 같이 봐서, 세로로 긴 폰에서도 위쪽에 붙어 있게 한다 */
  :root {
    --hud-x: clamp(4px, calc((100vw - 640px) / 10 + 4px), 28px);
    --hud-y: max(env(safe-area-inset-top), clamp(3px, min(calc((100vw - 640px) / 10 + 3px), calc((100vh - 620px) / 10 + 3px)), 22px));
  }
  .pts-pill {
    /* 제목 줄 높이 안에 들어가게: 아래 게임 버튼과 겹치지 않고, 스크롤하면 같이 올라간다 */
    position: absolute; top: var(--hud-y); right: var(--hud-x); z-index: 15; display: flex; align-items: center; gap: 5px;
    padding: 3px 10px 3px 4px; border-radius: 999px; border: 2.5px solid var(--border); background: var(--panel);
    box-shadow: 0 2px 0 var(--border); font-family: 'Jua', sans-serif; font-size: 15px; color: var(--text); cursor: pointer;
  }
  .pts-pill.bump { animation: ptsBump .5s .2s; }
  @keyframes ptsBump { 40% { transform: scale(1.15); } }
  .pts-gain {
    position: absolute; right: 10px; top: 100%; font-family: 'Jua', sans-serif; font-size: 18px; color: #22a55b;
    pointer-events: none; animation: ptsGain 1.6s ease-out forwards;
  }
  @keyframes ptsGain { 0% { opacity: 0; transform: translateY(-6px); } 15% { opacity: 1; transform: translateY(4px); } 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(14px); } }
  .pts-pill:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--border); }
  .pts-ico {
    width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; color: #fff;
    background: linear-gradient(180deg, #ffcf3a, #f0a020); box-shadow: inset 0 -2px 0 rgba(0,0,0,.15);
  }
  .pts-card {
    background: var(--panel); border-radius: 24px; width: 100%; max-width: 420px; max-height: min(640px, 86vh);
    display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  }
  .pts-head { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; border-bottom: 2px solid var(--panel2); }
  .pts-head h2 { font-family: 'Jua', sans-serif; color: #ff6f91; margin: 0; font-size: 21px; flex: 1; text-align: left; }
  .pts-head .pts-bal { font-family: 'Jua', sans-serif; font-size: 20px; display: flex; align-items: center; gap: 6px; }
  .pts-head .pts-x {
    width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--panel2); color: var(--muted);
    font-size: 18px; cursor: pointer; flex: none;
  }
  .pts-acct { display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-bottom: 2px solid var(--panel2); font-size: 13px; color: var(--muted); }
  .pts-acct:empty { display: none; }
  .pts-acct .pts-mail { flex: 1; min-width: 0; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
  .pts-acct button {
    display: flex; align-items: center; justify-content: center; gap: 8px; border: 2px solid var(--border); background: #fff;
    border-radius: 999px; padding: 7px 14px; font: 700 13px inherit; font-family: inherit; color: var(--text); cursor: pointer;
  }
  .pts-acct button.wide { flex: 1; padding: 9px 14px; }
  .pts-acct button:disabled { opacity: .5; }
  .pts-acct svg { width: 16px; height: 16px; flex: none; }
  .pts-list { overflow-y: auto; padding: 4px 18px 14px; -webkit-overflow-scrolling: touch; }
  .pts-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--panel2); text-align: left; }
  .pts-row:last-child { border-bottom: none; }
  .pts-row .pts-info { flex: 1; min-width: 0; }
  .pts-row .pts-game { font-weight: 800; font-size: 14px; }
  .pts-row .pts-detail { font-size: 12.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pts-row .pts-amt { text-align: right; flex: none; }
  .pts-row .pts-amt b { display: block; font-family: 'Jua', sans-serif; font-size: 18px; color: #22a55b; }
  .pts-row .pts-amt b.minus { color: #e5484d; }
  .pts-row .pts-amt small { font-size: 11.5px; color: var(--muted); }
  .pts-day { font-size: 12px; font-weight: 800; color: var(--muted); padding: 14px 0 2px; text-align: left; }
  .pts-empty { padding: 40px 0; color: var(--muted); font-size: 14px; }
  /* #app 위아래 여백(20 + 60px)을 뺀 화면 높이를 꽉 채워야 가운데 정렬이 화면 가운데쯤에 온다 (85vh면 위로 쏠림). CAPTCHA 화면과 같은 값 */
  .game-screen { position: relative; min-width: 0; min-height: calc(100dvh - 80px); display: flex; flex-direction: column; justify-content: center; }
  .source-badge {
    position: absolute; top: 0; right: 0; width: 18px; height: 18px; border-radius: 50%;
    background: var(--panel2); border: 1px solid var(--border); color: var(--muted);
    font-size: 11px; font-weight: 700; line-height: 1; padding: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .source-badge:hover { border-color: var(--accent); color: var(--accent); }
  .modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 16px; max-width: 420px; margin-left: auto; margin-right: auto; }
  .mode-card {
    position: relative; background: var(--panel); border: 3px solid var(--border); border-radius: 24px;
    padding: 18px 14px; cursor: pointer; text-align: center; color: var(--text);
    box-shadow: 0 4px 0 var(--border); transition: transform 0.15s, box-shadow 0.15s;
  }
  .mode-card:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 6px 0 var(--accent); }
  .mode-card:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--border); }
  .mode-card .emoji { font-size: 32px; margin-bottom: 4px; }
  .mode-card b { font-family: 'Jua', sans-serif; font-size: 17px; display: block; margin-bottom: 4px; color: #ff6f91; }
  .mode-card span { color: var(--muted); font-size: 12px; }
  .mode-card.game4 { border-color: var(--accent2); box-shadow: 0 4px 0 var(--accent2); }
  .mode-card.game4:hover { border-color: var(--accent2); box-shadow: 0 6px 0 var(--accent2); }
  .mode-card.game4 b { color: #1f9d7c; }
  .mode-card.game6 { border-color: var(--warn); box-shadow: 0 4px 0 var(--warn); }
  .mode-card.game6:hover { border-color: var(--warn); box-shadow: 0 6px 0 var(--warn); }
  .mode-card.game6 b { color: #c47f00; }
  .mode-card.game7 { border-color: #6c8cff; box-shadow: 0 4px 0 #6c8cff; display: block; text-decoration: none; }
  .mode-card.game7:hover { border-color: #6c8cff; box-shadow: 0 6px 0 #6c8cff; }
  .mode-card.game7 b { color: #3f5fd9; }
  .mode-card.game8 { border-color: #8b5cf6; box-shadow: 0 4px 0 #8b5cf6; }
  .mode-card.game8:hover { border-color: #8b5cf6; box-shadow: 0 6px 0 #8b5cf6; }
  .mode-card.game8 b { color: #6d28d9; }
  .mode-card.captcha-mode { border-color: #22a6b3; box-shadow: 0 4px 0 #22a6b3; }
  .mode-card.captcha-mode:hover { border-color: #22a6b3; box-shadow: 0 6px 0 #22a6b3; }
  .mode-card.captcha-mode b { color: #167783; }
  .mode-card.connect-mode { border-color: #ff7b72; box-shadow: 0 4px 0 #ff7b72; display: block; text-decoration: none; }
  .mode-card.connect-mode:hover { border-color: #ff7b72; box-shadow: 0 6px 0 #ff7b72; }
  .mode-card.connect-mode b { color: #d94f47; }
  .mode-card.blackjack-mode { border-color: #caa23c; box-shadow: 0 4px 0 #caa23c; display: block; text-decoration: none; }
  .mode-card.blackjack-mode:hover { border-color: #caa23c; box-shadow: 0 6px 0 #caa23c; }
  .mode-card.blackjack-mode b { color: #9c7a1f; }
  .mode-card.scramble-mode { border-color: #4f7cf0; box-shadow: 0 4px 0 #4f7cf0; display: block; text-decoration: none; }
  .mode-card.scramble-mode:hover { border-color: #4f7cf0; box-shadow: 0 6px 0 #4f7cf0; }
  .mode-card.scramble-mode b { color: #2f57c4; }
  .mode-card.bobble-mode { border-color: #2dbb78; box-shadow: 0 4px 0 #2dbb78; display: block; text-decoration: none; }
  .mode-card.bobble-mode:hover { border-color: #2dbb78; box-shadow: 0 6px 0 #2dbb78; }
  .mode-card.bobble-mode b { color: #1d8a56; }
  .mode-card.penalty-mode { border-color: #ff4fa3; box-shadow: 0 4px 0 #ff4fa3; text-decoration: none; }
  .mode-card.penalty-mode:hover { border-color: #ff4fa3; box-shadow: 0 6px 0 #ff4fa3; }
  .mode-card.penalty-mode b { color: #d1006a; }
  .pack-btn {
    /* 포인트 바로 아래 오른쪽 끝: 가운데 제목과 첫 게임 버튼 사이 빈칸이라 모바일에서도 안 겹친다 */
    position: absolute; top: calc(var(--hud-y) + 40px); right: var(--hud-x); z-index: 15;
    width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
    border: 2.5px solid #8b5cf6; background: var(--panel); box-shadow: 0 2px 0 #8b5cf6;
  }
  .pack-btn:active { transform: translateY(2px); box-shadow: 0 0 0 #8b5cf6; }
  .pack-btn svg { width: 16px; height: 22px; filter: drop-shadow(0 1px 1px rgba(80, 40, 160, .35)); }
  /* 폰은 화면이 낮으면 게임 버튼이 포인트 바로 밑까지 올라오므로, 제목 줄 왼쪽 빈칸에 포인트와 마주 보게 둔다 */
  @media (max-width: 640px) {
    .pack-btn { top: var(--hud-y); left: var(--hud-x); right: auto; width: 34px; height: 34px; }
  }
  .mode-card.jelly-mode { border-color: #e0a91f; box-shadow: 0 4px 0 #e0a91f; display: block; text-decoration: none; }
  .mode-card.jelly-mode:hover { border-color: #e0a91f; box-shadow: 0 6px 0 #e0a91f; }
  .mode-card.jelly-mode b { color: #b07e0b; }
  .mode-card.heading-mode { border-color: #ff8a1f; box-shadow: 0 4px 0 #ff8a1f; display: block; text-decoration: none; }
  .mode-card.heading-mode:hover { border-color: #ff8a1f; box-shadow: 0 6px 0 #ff8a1f; }
  .mode-card.heading-mode b { color: #d66a00; }
  .mode-card.gogun-mode { border-color: #d0102a; box-shadow: 0 4px 0 #d0102a; display: block; text-decoration: none; }
  .mode-card.gogun-mode:hover { border-color: #d0102a; box-shadow: 0 6px 0 #d0102a; }
  .mode-card.gogun-mode b { color: #b00d24; }
  /* 다른 사이트로 이동하는 카드라는 걸 보여주는 작은 배지 */
  .external-badge {
    position: absolute; top: 10px; right: 12px; width: 20px; height: 20px;
    border-radius: 999px; background: var(--panel2); border: 1px solid var(--border);
    color: var(--muted); font-size: 12px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .rec-desc-card {
    background: var(--panel); border: 3px solid var(--border); border-radius: 20px;
    padding: 28px 20px; margin-bottom: 20px; text-align: center;
    font-size: 17px; line-height: 1.55; font-weight: 700; color: var(--text);
  }
  .rec-explain-card {
    background: var(--panel2); border: 2px solid var(--border); border-radius: 16px;
    padding: 16px 18px; margin-bottom: 12px; text-align: left;
    font-size: 14px; line-height: 1.6; color: var(--text);
  }
  .rec-source-link {
    display: block; text-align: center; margin-bottom: 18px;
    font-size: 13px; color: var(--accent2); text-decoration: underline;
  }

  /* "선수 맞히기" 카드가 클래식/챌린지로 쪼개지는 상태 + 나머지 카드 비활성 느낌 */
  .mode-card.expanded { padding: 8px; cursor: default; display: flex; flex-direction: column; gap: 8px; }
  .mode-card.expanded:hover { transform: none; box-shadow: 0 4px 0 var(--border); border-color: var(--border); }
  .split-btn {
    flex: 1; border-radius: 16px; border: 3px solid var(--border); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--panel2); transition: transform 0.12s, box-shadow 0.12s;
  }
  .split-btn .emoji { font-size: 20px; }
  .split-btn b { font-family: 'Jua', sans-serif; font-size: 13px; color: var(--text); }
  .split-btn:hover { transform: translateY(-1px); }
  .split-btn.split-classic { border-color: var(--accent); }
  .split-btn.split-classic b { color: #ff6f91; }
  .split-btn.split-new { border-color: #7a5cff; }
  .split-btn.split-new b { color: #5b32e0; }
  a.split-btn { text-decoration: none; }
  .split-btn.split-jelly-soft { border-color: #ff7aa8; }
  .split-btn.split-jelly-soft b { color: #e0457a; }
  .split-btn.split-jelly-hard { border-color: #e0a91f; }
  .split-btn.split-jelly-hard b { color: #b07e0b; }
  .split-btn.split-pk-cpu { border-color: #e0a91f; }
  .split-btn.split-pk-cpu b { color: #b07e0b; }
  .split-btn.split-pk-online { border-color: #ff4fa3; }
  .split-btn.split-pk-online b { color: #d1006a; }
  .mode-card.dimmed {
    /* 모달 배경처럼 - 카드 자체는 아무 반응 없는 그냥 배경일 뿐이라 커서도 그대로,
       클릭은 document 레벨의 "바깥 클릭하면 접힘" 리스너가 처리한다 */
    filter: grayscale(0.7); opacity: 0.32; cursor: default; pointer-events: none;
    transition: opacity 0.25s ease, filter 0.25s ease;
  }

  .sil-img-wrap { display: flex; justify-content: center; margin-bottom: 16px; }
  .sil-img-wrap img {
    width: 220px; height: 220px; object-fit: contain; background: #ffffff;
    border: 3px solid var(--border); border-radius: 24px; box-shadow: 0 4px 0 var(--border);
  }
  /* 게임4 화면 내부 요소 사이 여백을 조금 더 준다 (다른 게임 레이아웃엔 영향 없게 scope) */
  .sil-game .topbar { margin-bottom: 18px; }
  .sil-game .criterion-banner { margin-bottom: 20px; }
  .sil-game .sil-img-wrap { margin-bottom: 20px; }
  .sil-game .guess-wrap { margin-bottom: 14px; }
  .sil-game .wrong-msg { margin-bottom: 10px; }
  .sil-game .giveup-btn { margin-top: 22px; }
  .sil-reveal-row { display: flex; justify-content: center; gap: 14px; margin: 6px 0 18px; }
  .sil-reveal-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .sil-reveal-label { font-size: 12px; color: var(--muted); font-weight: 700; }
  .sil-reveal-col img {
    width: 150px; height: 150px; object-fit: contain; background: #ffffff;
    border: 3px solid var(--border); border-radius: 20px; box-shadow: 0 4px 0 var(--border);
  }
  .sil-next-btn {
    display: block; width: 100%; padding: 14px; border-radius: 999px; border: none;
    background: #a78bfa; color: white; font-family: 'Jua', sans-serif; font-size: 16px; cursor: pointer;
  }

  .criterion-banner {
    background: var(--panel2); border: 2px dashed var(--border); border-radius: 16px;
    padding: 12px 14px; font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 16px; line-height: 1.5;
  }
  .streak-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 18px; }
  .streak-dot {
    width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800;
    background: var(--panel); color: var(--border); transition: all 0.25s;
  }
  .streak-dot.on { background: var(--accent2); border-color: var(--accent2); color: white; transform: scale(1.08); }
  .history-list { display: flex; flex-direction: column; gap: 8px; margin-top: 22px; }
  .history-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--panel); border: 2px solid var(--border); border-radius: 14px; padding: 10px 14px;
    animation: pop 0.25s ease;
  }
  @keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .history-item .name { font-weight: 700; font-size: 14px; }
  .history-item.latest { border-color: var(--accent2); }
  .result-badge {
    width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-family: 'Jua', sans-serif; font-size: 15px; color: white; flex-shrink: 0;
  }
  .result-badge.o { background: var(--accent2); }
  .result-badge.x { background: var(--danger); }
  .empty-hint { text-align: center; color: var(--muted); font-size: 13px; margin-top: 30px; line-height: 1.6; }
  .giveup-btn { display: block; margin: 18px auto 0; background: none; border: none; color: var(--muted); font-size: 12px; text-decoration: underline; cursor: pointer; }

  .overlay {
    position: fixed; inset: 0; background: rgba(74,59,49,0.45); display: flex;
    align-items: center; justify-content: center; padding: 20px; z-index: 20;
  }
  .win-card {
    background: var(--panel); border-radius: 24px; padding: 28px 24px; max-width: 360px; width: 100%;
    text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  }
  .win-card .trophy { font-size: 44px; margin-bottom: 6px; }
  .win-card h2 { font-family: 'Jua', sans-serif; color: #ff6f91; margin: 0 0 6px; font-size: 22px; }
  .win-card .result-line { font-size: 14px; color: var(--muted); margin-bottom: 10px; }
  .win-card .result-line b { color: var(--accent2); font-size: 20px; font-family: 'Jua', sans-serif; }
  .win-card .criterion-reveal {
    background: var(--panel2); border-radius: 14px; padding: 10px 14px; font-size: 13px;
    margin-bottom: 16px; color: var(--text); font-weight: 700;
  }
  .win-card .close-btn {
    width: 100%; padding: 12px; border-radius: 999px; border: none; background: var(--accent2);
    color: white; font-family: 'Jua', sans-serif; font-size: 15px; cursor: pointer;
  }

  /* 카드 안에 다 못 들어가는 힌트 값(우승 트로피/개인 수상 등)을 "...더보기"로
     자르고, 누르면 이 작은 모달로 전체 텍스트를 보여준다 */
  .hint-modal-card {
    background: var(--panel); border-radius: 20px; padding: 22px 20px; max-width: 300px; width: 100%;
    text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  }
  .hint-modal-card .hint-modal-label { font-size: 13px; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
  .hint-modal-card .hint-modal-val { font-size: 16px; font-weight: 800; color: var(--text); line-height: 1.5; word-break: keep-all; margin-bottom: 18px; }
  .hint-modal-card .close-btn {
    width: 100%; padding: 10px; border-radius: 999px; border: none; background: var(--accent2);
    color: white; font-family: 'Jua', sans-serif; font-size: 14px; cursor: pointer;
  }

  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-width: 0; margin-bottom: 14px; }
  .backbtn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 6px 0; font-weight: 600; }
  .score-pill {
    background: var(--panel2); border: 2px solid var(--border); border-radius: 999px;
    min-width: 0; max-width: 100%; padding: 7px 16px; font-size: 13px; color: var(--muted); font-weight: 600; text-align: center;
  }
  .score-pill b { color: var(--accent); font-family: 'Jua', sans-serif; font-size: 15px; }

  .cat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
  .cat-card { perspective: 800px; min-height: 76px; }
  .cat-card-inner {
    position: relative; width: 100%; height: 100%; min-height: 76px;
    transform-style: preserve-3d; transition: transform 0.55s cubic-bezier(.34,1.4,.64,1);
    cursor: pointer;
  }
  .cat-card.flipped .cat-card-inner { transform: rotateY(180deg); cursor: default; }
  .cat-card.empty .cat-card-inner { cursor: not-allowed; }
  .cat-card.empty .cat-front { opacity: 0.45; }
  .cat-face {
    position: absolute; inset: 0; backface-visibility: hidden;
    border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 8px 4px; text-align: center;
  }
  .cat-front { background: var(--panel); border: 3px solid var(--border); color: var(--text); }
  .cat-card:not(.empty):not(.flipped):hover .cat-front { border-color: var(--accent); }
  .cat-front .cat-label { font-size: 14px; font-weight: 700; margin-bottom: 4px; word-break: keep-all; }
  .cat-front .cat-q { font-family: 'Jua', sans-serif; font-size: 23px; color: var(--border); }
  .cat-back {
    background: var(--accent); color: white; border: 3px solid var(--accent);
    transform: rotateY(180deg);
  }
  .cat-back .cat-label { font-size: 13px; opacity: 0.85; margin-bottom: 4px; word-break: keep-all; }
  .cat-back .cat-val {
    font-weight: 800; font-size: 15px; word-break: keep-all;
    max-height: 3.3em; line-height: 1.1em; overflow: hidden;
  }
  .cat-back .cat-val.has-more { cursor: pointer; }
  .cat-more-btn { text-decoration: underline; text-underline-offset: 2px; }

  /* 게임5(챌린지): 카테고리 20개 - 모바일은 4x5, 데스크탑(640px~)은 5x4.
     소진된(잠긴) 카테고리는 붉은 톤으로 구분 */
  .challenge-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .challenge-grid .cat-card { min-height: 68px; }
  .challenge-grid .cat-card-inner { min-height: 68px; }
  .challenge-grid .cat-front .cat-label { font-size: 12px; margin-bottom: 2px; }
  .challenge-grid .cat-front .cat-q { font-size: 17px; }
  .challenge-grid .cat-back .cat-label { font-size: 11px; }
  .challenge-grid .cat-back .cat-val { font-size: 13px; max-height: 2.3em; line-height: 1.1em; }
  @media (min-width: 640px) {
    .challenge-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  }
  .cat-card.locked .cat-front { background: #fbe7e7; border-color: #f0c6c6; opacity: 0.7; }
  .cat-card.locked .cat-front .cat-q { color: var(--danger); }

  .guess-wrap { position: relative; margin-bottom: 8px; }
  .guess-wrap input {
    width: 100%; padding: 14px 20px; border-radius: 999px; border: 3px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 16px; font-family: 'Jua', sans-serif;
  }
  .guess-wrap input::placeholder { font-family: 'Jua', sans-serif; }
  .guess-wrap input:focus { outline: none; border-color: var(--accent); }
  .guess-wrap.shake { animation: shake 0.45s; }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-7px); }
    40%, 60% { transform: translateX(7px); }
  }
  .suggest-list {
    position: absolute; top: calc(100% + 8px); left: 0; right: 0; z-index: 10;
    background: var(--panel); border: 3px solid var(--border); border-radius: 18px;
    max-height: 260px; overflow-y: auto; box-shadow: 0 10px 24px rgba(74,59,49,0.18);
  }
  .suggest-item { padding: 10px 18px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .suggest-item:hover { background: var(--panel2); }
  .suggest-item .en { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .suggest-empty { padding: 12px 18px; color: var(--muted); font-size: 13px; }
  .wrong-msg { color: var(--danger); font-size: 14px; min-height: 18px; margin-bottom: 8px; font-weight: 700; }

  .result-card {
    background: var(--panel); border: 3px solid var(--border); border-radius: 26px;
    padding: 24px; text-align: center; margin-bottom: 16px; box-shadow: 0 4px 0 var(--border);
  }
  .result-card img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; background: var(--panel2); border: 3px solid var(--border); }
  .result-card .name { font-family: 'Jua', sans-serif; font-size: 22px; margin-bottom: 4px; color: #ff6f91; }
  .result-card .grade { font-family: 'Jua', sans-serif; font-size: 40px; font-weight: 400; color: var(--accent2); margin: 10px 0; }
  .result-card .grade small { display: block; font-size: 13px; color: var(--muted); font-family: -apple-system, sans-serif; font-weight: 400; margin-top: 4px; }

  .btn-row { display: flex; gap: 10px; }
  .btn-row button {
    flex: 1; padding: 13px; border-radius: 999px; border: 3px solid var(--border);
    background: var(--panel2); color: var(--text); font-size: 14px; cursor: pointer; font-weight: 700;
  }
  .btn-row button.primary { background: var(--accent); border-color: var(--accent); color: white; }

  .nick-row { display: flex; gap: 8px; margin: 14px 0; }
  .nick-row input {
    flex: 1; min-width: 0; padding: 10px 16px; border-radius: 999px; border: 3px solid var(--border);
    background: var(--panel2); color: var(--text); font-size: 16px; font-family: 'Jua', sans-serif;
  }
  .nick-row button { padding: 0 18px; border-radius: 999px; border: none; background: var(--accent2); color: white; font-weight: 700; cursor: pointer; }

  table.lb { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  table.lb th, table.lb td { padding: 7px 10px; text-align: left; border-bottom: 2px solid var(--panel2); color: var(--muted); }
  table.lb td:first-child, table.lb th:first-child { width: 28px; color: var(--text); }
  table.lb tr.me td { color: var(--accent2); font-weight: 700; }

  .streak-list { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; font-size: 13px; }
  .streak-list div { display: flex; justify-content: space-between; color: var(--muted); }
  .loading { text-align: center; color: var(--muted); padding: 60px 0; }

  /* 게임8: 빅6 야찌 - 좌측엔 세로 비율(트레이딩 카드꼴) 5장을 가로로 배열 +
     다시뽑기, 우측엔 폭을 좁힌 그리드형 13개 족보 점수판(족보 섹션별로 구분).
     좁은 화면에서는 세로로 쌓는다(카드 먼저, 점수판 다음). 다른 게임들은
     .wrap이 720px로 고정이지만, 이 게임만 카드 5장이 여유롭게 한 줄에 들어갈
     공간이 필요해서 :has()로 이 화면일 때만 폭을 넓힌다(다른 게임엔 영향 없음).
     PC처럼 실제로 공간이 넉넉하면 5장이 한 줄로, 그렇지 않으면 아래에서
     3장+2장으로 강제 전환한다(컨테이너 쿼리로 hand-col의 실제 렌더 폭을 기준
     판단 - 화면 폭이 아니라 이 칸 자체의 폭이라 2단/1단 레이아웃 전환과도 항상
     맞아떨어진다). */
  .wrap:has(.b6-game) { max-width: 960px; }
  .b6-layout { display: flex; gap: 16px; align-items: center; }
  .b6-hand-col { flex: 1 1 auto; min-width: 0; container-type: inline-size; container-name: b6hand; }
  .b6-sheet-col { flex: 0 0 250px; }
  /* 카드가 92px씩 5장(+간격 8px×4)이면 492px가 필요하다 - 그보다 좁으면 그냥
     두면 "4장+1장"처럼 어중간하게 줄바꿈되므로, max-width를 정확히 3장 폭
     (92×3+8×2=292px)으로 못박아 넷째 장부터는 무조건 다음 줄로 넘어가게
     강제한다(항상 3장+2장). justify-content:center가 각 줄을 따로 가운데
     정렬해서 아래 2장도 치우치지 않는다. 컨테이너(hand-col) 폭이 5장이 들어갈
     만큼 넉넉해지면(500px~) 그 제한을 풀어 한 줄로 보여준다. */
  .b6-hand {
    display: grid; grid-template-columns: repeat(6, 42px); gap: 8px;
    justify-content: center; max-width: 292px; margin: 0 auto 28px;
  }
  .b6-hand .b6-card { grid-column: span 2; }
  .b6-hand .b6-card:first-child { grid-column: 2 / span 2; }
  @container b6hand (min-width: 500px) {
    .b6-hand { display: flex; flex-wrap: nowrap; max-width: none; }
    .b6-hand .b6-card, .b6-hand .b6-card:first-child { grid-column: auto; }
  }
  .b6-card {
    width: 92px; background: var(--panel); border: 3px solid var(--border); border-radius: 14px;
    padding: 6px; text-align: center; cursor: pointer; position: relative;
    box-shadow: 0 3px 0 var(--border); transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
  }
  .b6-card:hover { transform: translateY(-2px); }
  .b6-card.held { border-color: var(--accent2); box-shadow: 0 3px 0 var(--accent2); background: #eafaf5; }
  .b6-card.empty { cursor: default; }
  .b6-card.empty:hover { transform: none; }
  .b6-photo-placeholder { font-family: 'Jua', sans-serif; font-size: 26px; color: var(--border); }
  /* FotMob 선수 사진 원본이 정사각형(192x192)이라 박스도 정사각형으로 맞춰야
     object-fit:cover로 좌우(또는 상하)가 잘리지 않는다 - 카드 폭 92px, 패딩
     6px씩이라 실제 내용 폭은 80px = 정확히 정사각형 높이로 맞춤. */
  .b6-photo-wrap {
    width: 100%; height: 80px; border-radius: 10px; overflow: hidden;
    background: #f4f0e6; display: flex; align-items: center; justify-content: center; margin-bottom: 6px;
    position: relative;
  }
  .b6-photo-wrap img { width: 100%; height: 100%; object-fit: cover; }
  /* 카드를 (다시)뽑을 때 사진을 여러 장 스핀시키면 로딩이 못 따라와 빈 프레임이
     스치는 문제가 있었다 - 그래서 아예 사진을 보여주지 않고 "?"가 잠깐 좌우로
     흔들리다가 바로 결과 카드로 넘어가는 방식으로 바꿨다. */
  .b6-card.spinning { cursor: default; animation: b6-shake 0.28s ease-in-out infinite; }
  .b6-card.spinning .b6-name, .b6-card.spinning .b6-pill-row { visibility: hidden; }
  @keyframes b6-shake {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    25% { transform: translateX(-5px) rotate(-3deg); }
    75% { transform: translateX(5px) rotate(3deg); }
  }
  .b6-name {
    font-size: 10.5px; font-weight: 700; line-height: 1.2; margin-bottom: 5px; word-break: keep-all;
    min-height: 2.2em; display: flex; align-items: center; justify-content: center;
  }
  .b6-pill-row { display: flex; flex-direction: column; gap: 3px; align-items: center; }
  .b6-team-pill, .b6-pos-pill {
    display: inline-block; width: 100%; font-size: 9px; font-weight: 800; padding: 2px 4px; border-radius: 999px;
  }
  .b6-team-pill { color: white; background: var(--b6-team-color, var(--muted)); }
  .b6-pos-pill { color: var(--muted); background: var(--panel2); border: 1px solid var(--border); }
  /* z-index를 안 주면 DOM 순서상 뒤에 오는 사진(.b6-photo-wrap)이 배지 위를
     덮어버려서 "사진보다 밑에 깔린" 것처럼 보였다 - 배지를 사진보다 위 레이어로
     명시하고, 위치도 카드 위로 더 확실히 띄운다. 문구 대신 자물쇠 아이콘을
     쓰는 동그란 배지로 바꿨다. */
  .b6-hold-badge {
    position: absolute; top: -12px; right: -8px; z-index: 2; background: var(--accent2); color: white;
    font-size: 13px; width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 0 rgba(0,0,0,0.1); opacity: 0; transform: scale(0.7); transition: all 0.15s;
  }
  .b6-card.held .b6-hold-badge { opacity: 1; transform: scale(1); }
  .b6-reroll-row { text-align: center; margin-bottom: 14px; }
  .b6-reroll-row button {
    padding: 9px 18px; border-radius: 999px;
    border: 3px solid var(--accent); background: var(--accent);
    color: white; font-family: 'Jua', sans-serif; font-size: 14px; cursor: pointer;
  }
  .b6-reroll-row button:disabled { background: var(--panel2); border-color: var(--border); color: var(--muted); cursor: not-allowed; }
  /* 보너스 진행 상황을 섹션 제목과 같은 줄, 오른쪽에 붙여서 세로 길이를 줄인다. */
  .b6-sheet-heading-row { display: flex; justify-content: space-between; align-items: baseline; margin: 12px 0 6px; }
  .b6-sheet-col .b6-sheet-heading-row:first-child { margin-top: 0; }
  .b6-sheet-heading { font-family: 'Jua', sans-serif; font-size: 12px; color: var(--muted); }
  .b6-bonus-inline { font-size: 10.5px; font-weight: 700; color: var(--muted); }
  .b6-bonus-inline.done { color: var(--accent2); }
  .b6-tile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .b6-tile-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .b6-tile {
    border: 2px solid var(--border); border-radius: 12px; padding: 8px 4px; text-align: center;
    background: var(--panel); cursor: pointer; transition: border-color 0.12s;
  }
  .b6-tile:hover { border-color: var(--accent); }
  .b6-tile.used { cursor: default; background: var(--panel2); opacity: 0.75; }
  .b6-tile.locked { cursor: default; }
  .b6-tile.locked:hover { border-color: var(--border); }
  .b6-tile.used:hover { border-color: var(--border); }
  .b6-tile-label { font-size: 10.5px; font-weight: 700; margin-bottom: 3px; word-break: keep-all; line-height: 1.2; }
  .b6-tile-score { font-family: 'Jua', sans-serif; font-size: 14px; color: var(--accent2); }
  .b6-tile.used .b6-tile-score { color: var(--muted); }
  .b6-tile.locked .b6-tile-score { color: var(--muted); }
  /* "?" 출처 배지와 📖 설명 배지를 다른 게임처럼 화면 우상단에 절대 위치로
     띄우는 대신, topbar 안에 인라인으로 넣는다 - 좁은 화면에서 라운드/점수
     pill과 서로 겹치던 문제를 구조적으로 없앴다. 3열 그리드(왼쪽/오른쪽은
     내용 크기 그대로, 가운데만 유연한 1fr)라 뒤로가기·설명 배지는 절대 밀려서
     줄바꿈되지 않고, 가운데 pill은 자기 글자 폭만큼만 차지하며 가운데 정렬된다
     (flex:1을 pill 자체에 걸었을 때는 pill이 억지로 늘어나거나, 반대로 글자가
     길어지면 양옆이 눌려 줄바꿈되는 문제가 있었다). */
  .b6-game .topbar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px; }
  .b6-game .backbtn { white-space: nowrap; }
  .b6-icon-row { display: flex; gap: 8px; justify-self: end; }
  .b6-icon-row .source-badge { position: static; }
  .b6-round-pill {
    justify-self: center; max-width: 100%; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  @media (min-width: 641px) {
    .b6-round-pill { font-size: 15px; padding: 9px 18px; }
    .b6-round-pill b { font-size: 18px; }
  }
  /* PC에서는 폭을 넉넉히 넓혀서 내용이 웬만하면 스크롤 없이 다 보이게 하고,
     그래도 화면이 낮아 스크롤이 생기는 경우엔 기본 OS 스크롤바 대신 테마
     색상에 맞춘 얇은 스크롤바를 쓴다(브라우저 기본 회색 막대가 확 튀어서). */
  .b6-intro-card {
    max-width: 640px; max-height: 82vh; overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  .b6-intro-card::-webkit-scrollbar { width: 8px; }
  .b6-intro-card::-webkit-scrollbar-track { background: transparent; }
  .b6-intro-card::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
  .b6-intro-card::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  .b6-intro-title { font-family: 'Jua', sans-serif; font-size: 19px; color: #6d28d9; margin-bottom: 14px; }
  .b6-intro-list { text-align: left; font-size: 14.5px; line-height: 1.65; color: var(--text); margin-bottom: 16px; }
  .b6-intro-list b { color: var(--accent2); }
  .b6-intro-sub {
    font-family: 'Jua', sans-serif; font-size: 13.5px; color: #6d28d9; margin: 12px 0 4px;
  }

  /* CAPTCHA speedrun is deliberately isolated from the other game layouts. */
  .wrap:has(.captcha-screen) {
    /* 기존 720px의 약 80%. 정사각형 사진판은 창 높이도 함께 보며 줄여서
       상하가 짧은 브라우저에서도 헤더와 확인 버튼까지 한 화면에 둔다. */
    max-width: min(576px, calc(100dvh - 220px));
  }
  .captcha-screen { min-height: calc(100dvh - 80px); display: flex; flex-direction: column; justify-content: center; }
  .captcha-topbar { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-bottom: 12px; }
  .captcha-timer {
    background: var(--panel2); border: 2px solid var(--border); border-radius: 999px;
    padding: 7px 10px; font-size: 13px; font-weight: 800; text-align: center;
  }
  .captcha-timer { min-width: 76px; color: #167783; font-variant-numeric: tabular-nums; }
  .captcha-box {
    overflow: hidden; border: 1px solid #c8c8c8; border-radius: 2px; background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.24); font-family: Roboto, Arial, Helvetica, sans-serif;
  }
  .captcha-prompt { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; text-align: left; margin: 0; padding: 16px 15px 15px; color: #fff; background: #4285f4; line-height: 1.2; }
  .captcha-prompt-copy > span { display: block; font-size: 12px; font-weight: 500; }
  .captcha-prompt-copy > strong { display: block; margin: 1px 0 2px; font-size: 25px; font-weight: 700; letter-spacing: -.02em; }
  .captcha-prompt-copy > small { display: block; font-size: 12px; font-weight: 400; opacity: .96; }
  .captcha-round { min-width: 46px; padding: 5px 7px; border: 1px solid rgba(255,255,255,.75); border-radius: 2px; font-size: 13px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
  .captcha-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 2px; background: #fff; }
  .captcha-card {
    position: relative; appearance: none; min-width: 0; padding: 0; overflow: hidden; cursor: pointer;
    background: #eef2f4; border: 0; border-radius: 0; color: var(--text); transition: filter .1s;
  }
  .captcha-card:hover { filter: brightness(.97); }
  .captcha-card:focus-visible { outline: 4px solid #ffb545; outline-offset: -4px; }
  .captcha-card.selected::before { content: ""; position: absolute; inset: 0; z-index: 1; background: rgba(31,115,210,.5); }
  .captcha-card.selected::after {
    content: "✓"; position: absolute; z-index: 2; top: 7px; right: 7px; width: 31px; height: 31px;
    display: grid; place-items: center; border-radius: 50%; background: #1f73d2; border: 3px solid #fff;
    color: #fff; font-size: 21px; font-weight: 900; box-shadow: 0 1px 4px rgba(0,0,0,.25);
  }
  .captcha-card img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: contain; background: #f4f0e6; }
  .captcha-actions { min-height: 66px; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid #dadce0; background: #fff; }
  .captcha-refresh { appearance: none; display: grid; place-items: center; width: 42px; height: 42px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: #5f6368; cursor: pointer; }
  .captcha-refresh:hover { background: #f1f3f4; color: #3c4043; }
  .captcha-refresh:active svg { transform: rotate(-35deg); }
  .captcha-refresh:focus-visible { outline: 2px solid #4285f4; outline-offset: 1px; }
  .captcha-refresh:disabled { cursor: default; opacity: .45; }
  .captcha-refresh svg { width: 27px; height: 27px; fill: currentColor; transition: transform .15s ease; }
  .captcha-submit {
    appearance: none; width: auto; min-width: 92px; height: 42px; margin: 0 0 0 auto; padding: 0 22px;
    border: 1px solid #1a73e8; border-radius: 2px; background: #4285f4; color: #fff;
    font-family: Roboto, Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 500; letter-spacing: .01em;
    line-height: 40px; text-align: center; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.2);
  }
  .captcha-submit:hover { background: #3367d6; border-color: #3367d6; }
  .captcha-submit:active { background: #2a56c6; box-shadow: inset 0 1px 2px rgba(0,0,0,.22); }
  .captcha-submit:focus-visible { outline: 2px solid #fbbc04; outline-offset: 2px; }
  .captcha-submit:disabled { cursor: default; opacity: .72; }
  .captcha-feedback { flex: 1; min-height: 20px; margin: 0; text-align: left; color: #d93025; font-size: 13px; font-weight: 500; }
  .captcha-grid.is-loading { display: grid; grid-template-columns: 1fr; place-items: center; aspect-ratio: 1 / 1; padding: 0; background: #f8f9fa; }
  .captcha-loader { display: flex; flex-direction: column; align-items: center; gap: 13px; color: #5f6368; font-size: 13px; font-weight: 500; }
  .captcha-loader.is-error span { color: #d93025; font-size: 23px; font-weight: 700; letter-spacing: -.01em; }
  .captcha-loader-ring {
    width: 42px; height: 42px; border: 4px solid #dfe6ef; border-top-color: #4285f4; border-radius: 50%;
    animation: captcha-spin .7s linear infinite;
  }
  @keyframes captcha-spin { to { transform: rotate(360deg); } }
  .captcha-countdown { text-align: center; }
  .captcha-countdown-number { font-family: 'Jua', sans-serif; font-size: 84px; color: #22a6b3; line-height: 1; }
  .captcha-countdown-status { color: var(--muted); font-size: 14px; margin-top: 12px; }
  .captcha-source { margin-top: 16px; color: var(--muted); font-size: 11px; text-align: center; line-height: 1.45; }
  .captcha-error, .captcha-result { width: 100%; max-width: 520px; margin: 0 auto; text-align: center; background: var(--panel); border: 3px solid #22a6b3; border-radius: 22px; padding: 24px 18px; }
  .captcha-result-mark { font-size: 50px; line-height: 1; margin-bottom: 6px; }
  .captcha-result-time { font-family: 'Jua', sans-serif; color: #167783; font-size: 48px; margin: 12px 0 4px; }
  .captcha-result-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .captcha-result-btn { min-height: 46px; padding: 0 18px; border: 3px solid var(--border); border-radius: 999px; background: var(--panel2); color: var(--text); font-family: 'Jua', sans-serif; font-size: 15px; cursor: pointer; }
  .captcha-result-btn.primary { border-color: #22a6b3; background: #22a6b3; color: #fff; }
  .captcha-result-btn:hover { transform: translateY(-1px); box-shadow: 0 3px 0 var(--border); }
  .captcha-result-btn.primary:hover { box-shadow: 0 3px 0 #167783; }
  @media (max-width: 420px) {

  /* 빅6 모바일 최종 오버라이드: 기본 카드 선언보다 뒤에 두어 2+3 배열과

// ---------------------------------------------------------------- utils

function deviceId() {

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function normalize(s) {
  // 발음기호 없는 알파벳으로도 검색되게: NFD로 분해하면 ê -> e + 결합용 악센트로
  // 쪼개지는데, 그 악센트 결합문자 범위(U+0300~036f)만 지우면 순수 알파벳만 남는다
  // (Kanté -> Kante, João -> Joao, Müller -> Muller 등).
  return (s || "")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[\s.\-'’]/g, "");
}

// ---------------------------------------------------------------- 정답 보호
// 이름/정답 문자열을 sessionStorage나 네트워크 응답에 평문으로 두면 개발자도구로
// 그냥 읽어서 치팅할 수 있다. 그래서 매칭(정답 확인)에 쓰는 값은 되돌릴 수 없는
// SHA-256 해시로만 내려받고, 화면에 보여줘야 하는 값(정답 공개 이름/사진 등)은
// 되돌릴 수 있는 간단한 XOR+Base64로 뒤섞어서 내려받는다 - 라운드가 끝나 실제로
// 화면에 그릴 때만 풀어서 보여준다.
// * 정적 사이트라 "진짜 비밀키"를 클라이언트에서 완전히 숨길 방법은 없다 - 이 키도
//   이 파일을 읽으면 보인다. 목적은 "그냥 눈으로 읽으면 안 보이게"이지, 스크립트를
//   직접 짜서 무차별 대입하는 수준까지 막는 게 아니다(그건 진짜 서버 검증이 필요).
// * crawler/sanitize_for_client.js가 이 파일과 동일한 알고리즘으로 데이터를
//   미리 변환해서 Firestore/정적 JSON에 넣어둔다 - 두 쪽 로직이 반드시 일치해야 한다.
const OBF_KEY = "gyp-cheatguard-2024";

async function sha256Hex(s) {
  const buf = new TextEncoder().encode(s);
  const digest = await crypto.subtle.digest("SHA-256", buf);
  return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, "0")).join("");
}

async function matchesHash(guess, hash) {
  if (!hash) return false;
  return (await sha256Hex(normalize(guess))) === hash;
}

function deobfuscate(b64) {
  if (!b64) return "";
  const bin = atob(b64);
  const keyBytes = new TextEncoder().encode(OBF_KEY);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i) ^ keyBytes[i % keyBytes.length];
  return new TextDecoder("utf-8").decode(out);
}

// 검색 후보 자동완성 목록 렌더링 (게임1/3/4/5 공용). SEARCH_POOL처럼 후보가 수천 개일
// 때 일치하는 걸 전부 한 번에 DOM으로 그리면 느려질 수 있어서, 처음엔
// SUGGEST_BATCH개만 그리고 목록을 스크롤해서 바닥 근처에 가면 다음 배치를 이어붙인다
// - 끝까지 스크롤하면 일치하는 이름 전부를 볼 수 있다. 클릭은 매 배치마다 다시 걸지
// 않도록 박스 자체에 한 번만 위임 리스너를 단다.
const SUGGEST_BATCH = 40;
function renderSuggestBox(box, names, onPick) {
  box.innerHTML = "";
  box.hidden = false;
  if (!names.length) {
    box.innerHTML = `<div class="suggest-empty">일치하는 선수가 없어요</div>`;
    return;
  }
  let shown = 0;
  function appendBatch() {
    const next = names.slice(shown, shown + SUGGEST_BATCH);
    shown += next.length;
    const frag = document.createDocumentFragment();
    next.forEach(name => {
      const el = document.createElement("div");
      el.className = "suggest-item";
      el.dataset.name = name;
      el.innerHTML = `<span>${escapeHtml(name)}</span>`;
      frag.appendChild(el);
    });
    box.appendChild(frag);
  }
  box.onscroll = () => {
    if (shown < names.length && box.scrollTop + box.clientHeight >= box.scrollHeight - 40) {
      appendBatch();
    }
  };
  box.onclick = (e) => {
    const item = e.target.closest(".suggest-item");
    if (item) onPick(item.dataset.name);
  };
  appendBatch();
}

function gradeFor(n) {
  if (n <= 1) return { text: "SSS", label: "완벽한 점수" };
  if (n === 2) return { text: "SS", label: "최고의 점수" };
  if (n === 3) return { text: "S", label: "훌륭한 점수" };
  if (n === 4) return { text: "A", label: "아주 좋은 점수" };
  if (n === 5) return { text: "B", label: "좋은 점수" };
  if (n === 6) return { text: "C", label: "괜찮은 점수" };
  if (n === 7) return { text: "D", label: "보통 점수" };
  if (n === 8) return { text: "E", label: "아쉬운 점수" };
  return { text: "F", label: "다음엔 더 잘해봐요" };
}

// ---------------------------------------------------------------- hint engine
// 카테고리당 힌트는 정확히 1개. 데이터가 없으면 null - 카드가 뒤집히지 않고 비활성화된다.

// TM의 정확한 포지션 문구(11종, 전체 90인 풀에서 실측)를 표준 포지션 약자로
// 보여준다 (CF/LW/RW/CB/GK 등) - 한글 풀네임보다 축구 팬에게 더 익숙하고 짧다.
const POSITION_KO = {
  "Attack - Centre-Forward": "CF",
  "Attack - Left Winger": "LW",
  "Attack - Right Winger": "RW",
  "Attack - Second Striker": "SS",
  "Defender - Centre-Back": "CB",
  "Defender - Left-Back": "LB",
  "Defender - Right-Back": "RB",
  "Goalkeeper": "GK",
  "Midfield - Attacking Midfield": "CAM",
  "Midfield - Central Midfield": "CM",
  "Midfield - Defensive Midfield": "CDM",
};
function positionKo(position) {
  if (!position) return null;
  if (POSITION_KO[position]) return POSITION_KO[position];
  if (/Goalkeeper|Keeper/.test(position)) return "GK";
  if (/Midfield/.test(position)) return "MF";
  if (/Defe|Back/.test(position)) return "DF";
  if (/Forward|Attack|Winger|Striker/.test(position)) return "FW";
  return null;
}

// 최근 3시즌 순위: 이적한 선수는 시즌마다 실제로 몸담았던 클럽이 다를 수 있어서
// (crawl_recent_ranks.py가 career 이력으로 시즌별 클럽을 역산해서 채움) 오래된
// 순으로 "1위 → 3위 → 5위"처럼 화살표로 잇는다. 커리어가 짧아 못 채운 시즌은 그냥
// 빠지므로 1~3개짜리 체인이 나올 수 있다.
function formatRecentRanks(ranks) {
  if (!ranks || !ranks.length) return null;
  return ranks.map(r => `${r.rank}위`).join(" → ");
}

function buildHints(p) {
  const pr = p.profile;
  const career = (p.career || []).filter(c => c.startYear);
  const first = career[0];

  // PokeQuiz의 "포케피디아"처럼 완전한 문장 대신 라벨+짧은 값 형태로 보여준다 -
  // 스캔하기 쉽고, "유명 선수와 뛰었다" 같은 군더더기가 끼어들 자리가 없다.
  return {
    birthYear: pr.birthYear ? `${pr.birthYear}년생` : null,
    height: pr.heightCm ? `${pr.heightCm}cm` : null,
    foot: pr.foot || null,
    position: positionKo(pr.position),
    debutYear: first ? `${first.startYear}년` : null,
    debutClub: first ? first.club : null,
    currentLeague: pr.currentLeague || null,
    recentSeasonRanks: formatRecentRanks(p.recentSeasonRanks),
    nationality: pr.nationalityKo || null,
  };
}

// ---------------------------------------------------------------- data load

let ALL_PLAYERS = [];
async function loadPlayers() {
  // 선수 데이터 스키마(힌트 필드 구성)가 바뀔 때마다 이 버전을 올려야 한다 -

  // v5: profile.nameKo/nameEn/aliases/photoUrl 평문을 없애고 matchHash/aliasHashes/
  // nameKoEnc/nameEnEnc/photoUrlEnc로 교체 - 옛 캐시는 평문을 그대로 들고 있으므로 버려야 한다.
  sessionStorage.removeItem("quizPlayersV4");

// 정답 후보 검색 목록은 90인 풀보다 훨씬 넓다 - 같은 프로젝트(팀메이트 스피드런)가
// 이미 크롤링해둔 "2020년 이후 유럽 5대리그 1부 출전 선수" 전체(9천여 명, 영문
// 이름만)를 정적 JSON으로 받아온다. 한글 이름은 90인 풀 밖 선수까지는 알아낼
// 수 없어서, 검색 목록 자체를 영문 이름으로 통일했다.
let SEARCH_POOL = [];
async function loadSearchPool() {
  const cached = sessionStorage.getItem("quizSearchPoolV1");
  if (cached) { SEARCH_POOL = JSON.parse(cached); return; }
  const res = await fetch("data/search_pool.json");
  SEARCH_POOL = await res.json();
  sessionStorage.setItem("quizSearchPoolV1", JSON.stringify(SEARCH_POOL));
}

// 정답이 공개된(맞혔든 실패했든) 선수는 로컬에 기록해두고, 다음 판을 고를 때
// 뒷순위로 미룬다 - 풀을 다 겪기 전까지는 최대한 새 선수가 나오게. 다 겪고 나면
// (이미 다 한번씩 본 사람은) 그냥 다시 전체에서 랜덤.
const SEEN_KEY = "quizSeenPlayers";
function getSeenIds() {
  try { return new Set(JSON.parse(localStorage.getItem(SEEN_KEY) || "[]")); }
  catch { return new Set(); }
}
function markSeen(playerId) {
  const seen = getSeenIds();
  seen.add(playerId);
  localStorage.setItem(SEEN_KEY, JSON.stringify([...seen]));
}
function shuffle(arr) {
  return arr.slice().sort(() => Math.random() - 0.5);
}
function pickRoundPlayers(n) {
  const seen = getSeenIds();
  const unseen = ALL_PLAYERS.filter(p => !seen.has(p.id));
  const alreadySeen = ALL_PLAYERS.filter(p => seen.has(p.id));
  // 안 본 선수를 먼저 다 채우고, 모자라면(=풀을 다 겪었으면) 이미 본 선수로 채운다.
  const ordered = [...shuffle(unseen), ...shuffle(alreadySeen)];
  return ordered.slice(0, Math.min(n, ordered.length));
}

// ---------------------------------------------------------------- leaderboard

async function submitScore(collectionPath, docId, hintsUsed, nickname) {
  const ref = doc(db, ...collectionPath, docId);
  const prev = await getDoc(ref);
  if (prev.exists() && prev.data().hintsUsed <= hintsUsed) return false;
  await commitLeaderboardScore("player-guess", ref, { nickname, hintsUsed, updatedAt: new Date() });
  return true;
}
// 기록이 올라 TOP 10에 들었으면 포인트 보너스 (points.js rankBonus)
async function rankBonus(game, improved, fetchTop) {
  if (!improved || !window.FSPoints) return;
  try {
    const rank = (await fetchTop()).findIndex(r => r.id === deviceId()) + 1;
    if (rank > 0) window.FSPoints.rankBonus(game, rank);
  } catch (e) {
    console.warn("rank bonus failed", e);
  }
}
async function fetchLeaderboard(collectionPath, top = 10) {
  const q = query(collection(db, ...collectionPath), orderBy("hintsUsed", "asc"), limit(top));
  const snap = await getDocs(q);
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

// ---------------------------------------------------------------- 플레이 로그 (/bymile 관리자 페이지용)
// 시각/IP/어떤 게임인지만 남긴다. IP는 로그인이 없어서 클라이언트가 외부 API로
// 직접 알아낸 값을 그대로 보내는 것 - 참고용이지 위변조 방지가 되는 값은 아니다.

let cachedClientIp = null;
async function getClientIp() {
  if (cachedClientIp) return cachedClientIp;
  try {
    const res = await fetch("https://api.ipify.org?format=json");
    cachedClientIp = (await res.json()).ip;
  } catch {
    cachedClientIp = "unknown";
  }
  return cachedClientIp;
}

// playLogs는 판마다 문서 하나씩 쌓이는 원본 로그라 시간이 지날수록 계속 커지고,
// /bymile 관리자 페이지가 "종목별 총 판수"를 보려고 매번 그걸 통째로 훑으면
// 로그가 많아질수록 페이지 로딩이 느려진다. 그래서 원본 로그(playLogs)는 그대로
// 남겨두되, 통계용으로 문서 2개(오늘 하루치 + 전체 누적)에 종목별 카운터를
// increment로 더해서 관리자 페이지는 이 작은 문서 2~3개만 읽으면 되게 한다.
function todayKeyKST() {
  return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(new Date());
}

// 게임6(records-guess-*)은 team/player 두 모드지만 리더보드(challengeLeaderboard)는
// 하나라 세션 키도 "challenge" 하나로 합친다 - 아래 sessionConsumed()가 참조하는
// firestore.rules의 세션 문서 경로와 이름을 맞춰야 한다.
function sessionGameKey(game) {
  return (game === "records-guess-team" || game === "records-guess-player") ? "challenge" : game;
}

async function logPlay(game) {
  try {
    const ip = await getClientIp();
    await Promise.all([
      addDoc(collection(db, "playLogs"), { ts: serverTimestamp(), ip, game }),
      setDoc(doc(db, "statsCounters", "totals"), { [game]: increment(1) }, { merge: true }),
      setDoc(doc(db, "statsDaily", todayKeyKST()), { [game]: increment(1) }, { merge: true }),
      // 리더보드 위조 방지용 "진짜 방금 플레이를 시작했다" 증거. 서버 타임스탬프라
      // 클라이언트가 값을 조작할 수 없고, 제출 시 firestore.rules가 이 문서 생성
      // 이후 실제로 최소 시간이 지났는지 검증한다 (아래 commitLeaderboardScore 참고).
      setDoc(doc(db, "playSessions", `${sessionGameKey(game)}_${deviceId()}`), { startedAt: serverTimestamp() }),
    ]);
  } catch (e) {
    console.error("logPlay failed", e);
  }
}

// 리더보드 문서를 쓸 때 항상 이 함수를 통해서만 쓴다: 위 logPlay()가 만들어 둔
// playSessions 문서를 같은 배치(트랜잭션)로 삭제하면서 점수를 쓴다. firestore.rules는
// "그 세션이 실제로 존재했고, 생성된 지 최소 시간이 지났고, 이 커밋으로 삭제되는지"를
// 검증하므로, 콘솔에서 Firestore SDK를 직접 불러 게임을 하지 않고 setDoc만 호출해도
// (playSessions 문서가 없어서) 리더보드 쓰기가 거부된다.
async function commitLeaderboardScore(game, ref, data) {
  const batch = writeBatch(db);
  batch.delete(doc(db, "playSessions", `${sessionGameKey(game)}_${deviceId()}`));
  batch.set(ref, data);
  await batch.commit();
}

// ---------------------------------------------------------------- UI

const appEl = document.getElementById("app");
let state = null; // current round state

function render(html) {
  // 홈 화면의 "바깥 클릭하면 접힘" 리스너는 document에 붙는데, 다른 화면으로
  // 넘어갈 때(게임 시작 등) renderHome()을 다시 거치지 않으면 안 떨어져서 남아있다가
  // 엉뚱한 화면에서의 클릭에도 반응해 홈으로 튕겨버린다 - 그래서 어떤 화면이든
  // 새로 그릴 때마다 여기서 한 번에 정리한다.
  if (homeOutsideClickHandler) {
    document.removeEventListener("click", homeOutsideClickHandler, true);

function openPointsHistory() {
  if (!window.FSPoints) return;
  const two = (n) => String(n).padStart(2, "0");
  let lastDay = "";
  const rows = FSPoints.history().map(e => {
    const d = new Date(e.t);
    const day = `${d.getFullYear()}.${two(d.getMonth() + 1)}.${two(d.getDate())}`;
    const head = day !== lastDay ? `<div class="pts-day">${day}</div>` : "";
    lastDay = day;
    return `${head}<div class="pts-row">
      <div class="pts-info"><div class="pts-game">${escapeHtml(FSPoints.gameName(e.g))}</div><div class="pts-detail">${two(d.getHours())}:${two(d.getMinutes())}${e.d ? ` · ${escapeHtml(e.d)}` : ""}</div></div>
      <div class="pts-amt"><b class="${e.a < 0 ? "minus" : ""}">${e.a > 0 ? "+" : ""}${e.a.toLocaleString()}</b><small>${e.b.toLocaleString()}</small></div>
    </div>`;
  }).join("");
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="pts-card" role="dialog" aria-modal="true" aria-labelledby="ptsTitle">
      <div class="pts-head">
        <h2 id="ptsTitle">포인트 내역</h2>
        <div class="pts-bal"><span class="pts-ico">P</span>${FSPoints.balance().toLocaleString()}</div>
        <button class="pts-x" aria-label="닫기">✕</button>
      </div>
      <div class="pts-acct"></div>
      <div class="pts-list">${rows || `<div class="pts-empty">내역이 없어요</div>`}</div>
    </div>`;
  const close = () => { overlay.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
  overlay.querySelector(".pts-x").onclick = close;
  document.addEventListener("keydown", onKey);
  renderPointsAccount(overlay.querySelector(".pts-acct"), () => { close(); refreshPointsPill(); openPointsHistory(); });
  document.body.appendChild(overlay);
}

function startGame() {
  logPlay("player-guess");
  const players = pickRoundPlayers(ROUND_SIZE);
  state = { players, idx: 0, player: players[0], revealed: [], stageIdx: {}, guessesLeft: MAX_GUESSES, totalHints: 0, history: [] };
  state.hints = buildHints(state.player);
  renderGame();
}

function currentHintCount(s) {
  return s.revealed.length;
}

function renderGame() {
  const s = state;
  render(`
    <div class="game-screen">
      ${renderSourceBadge("classic")}
      <div class="topbar">
        <button class="backbtn" id="backBtn">← 처음으로</button>
        <div class="score-pill">${s.idx + 1} / ${s.players.length}번째 선수 · 힌트 <b>${currentHintCount(s)}</b></div>
      </div>
      <div class="cat-grid" id="catGrid"></div>
      <div class="guess-wrap">
        <input id="guessInput" placeholder="${guessPlaceholder(s)}" autocomplete="off">
        <div class="suggest-list" id="suggestList" hidden></div>
      </div>
      <div class="wrong-msg" id="wrongMsg"></div>
    </div>
  `);
  document.getElementById("backBtn").onclick = renderHome;
  wireSourceBadge();
  const grid = document.getElementById("catGrid");
  CATEGORIES.forEach(c => {
    const available = s.hints[c.key] !== null;
    const used = !!s.stageIdx[c.key];
    const card = document.createElement("div");
    card.className = "cat-card" + (used ? " flipped" : "") + (!available ? " empty" : "");
    card.dataset.key = c.key;
    card.innerHTML = `
      <div class="cat-card-inner">
        <div class="cat-face cat-front"><span class="cat-label">${escapeHtml(c.label)}</span><span class="cat-q">?</span></div>
        <div class="cat-face cat-back"><span class="cat-label">${escapeHtml(c.label)}</span><span class="cat-val">${used ? escapeHtml(s.hints[c.key]) : ""}</span></div>
      </div>`;
    if (available && !used) {
      card.querySelector(".cat-card-inner").onclick = () => revealHint(c.key);
    }
    grid.appendChild(card);
  });

  const input = document.getElementById("guessInput");
  input.addEventListener("input", () => renderSuggestions(input.value));
  input.addEventListener("focus", () => renderSuggestions(input.value));
  input.focus();
}

function updateScorePill() {
  const b = document.querySelector(".score-pill b");
  if (b) b.textContent = currentHintCount(state);
}

function guessPlaceholder(s) {
  return `선수 이름을 검색해보세요 (남은 기회 ${s.guessesLeft}/${MAX_GUESSES})`;
}
function updateGuessPlaceholder() {
  const input = document.getElementById("guessInput");
  if (input) input.placeholder = guessPlaceholder(state);
}

function revealHint(catKey) {
  const s = state;
  const text = s.hints[catKey];
  if (!text || s.stageIdx[catKey]) return;
  s.stageIdx[catKey] = true;
  s.revealed.push({ category: catKey, text });

  // renderGame() 전체를 다시 그리면 카드가 뒤집히는 애니메이션이 보이지 않는다
  // (같은 innerHTML 대입 안에서 이전/이후 상태가 한번에 바뀌어버림) - 그래서
  // 이 카드 하나만 targeted로 건드려서 CSS transition이 실제로 재생되게 한다.
  const card = document.querySelector(`.cat-card[data-key="${catKey}"]`);
  if (card) {
    const label = (CATEGORIES.find(c => c.key === catKey) || {}).label || "";
    setCatValText(card.querySelector(".cat-back .cat-val"), label, text);
    card.classList.add("flipped");
    const inner = card.querySelector(".cat-card-inner");
    if (inner) inner.onclick = null;
  }
  updateScorePill();
}

function renderSuggestions(query) {
  const box = document.getElementById("suggestList");
  if (!box) return;
  const q = normalize(query);
  if (!q) { box.hidden = true; box.innerHTML = ""; return; }
  // 검색 후보는 90인 풀이 아니라 SEARCH_POOL(영문 이름 9천여 개, 5대리그 최근
  // 시즌 출전자 전체) 대상 - 입력할 때마다("input" 이벤트) 바로바로 다시
  // 필터링된다. 한글 이름은 이 넓은 목록에서는 알 수 없어서 통일해서 뺐다.
  const matches = SEARCH_POOL.filter(name => normalize(name).includes(q));
  renderSuggestBox(box, matches, (name) => {
    box.hidden = true;
    box.innerHTML = "";
    const input = document.getElementById("guessInput");
    if (input) input.value = "";
    trySubmitName(name);
  });
}

async function isNameMatch(name, player) {
  const hashes = [player.profile.matchHash, ...(player.profile.aliasHashes || [])];
  const guessHash = await sha256Hex(normalize(name));
  return hashes.includes(guessHash);
}

async function trySubmitName(name) {
  const s = state;
  if (await isNameMatch(name, s.player)) {
    document.getElementById("wrongMsg").textContent = "";
    onCorrect();
    return;
  }
  s.guessesLeft -= 1;
  if (s.guessesLeft <= 0) {
    failRound();
    return;
  }
  const msg = document.getElementById("wrongMsg");
  if (msg) msg.textContent = `❌ 오답이에요! 남은 기회 ${s.guessesLeft}번`;
  const wrap = document.querySelector(".guess-wrap");
  if (wrap) { wrap.classList.remove("shake"); void wrap.offsetWidth; wrap.classList.add("shake"); }
  updateGuessPlaceholder();
  document.getElementById("guessInput")?.focus();
}

function onCorrect() {
  const s = state;
  const hintsUsed = currentHintCount(s);
  s.totalHints += hintsUsed;
  s.history.push({ player: s.player, hintsUsed, failed: false });
  markSeen(s.player.id);
  const isFinal = s.idx + 1 >= s.players.length;
  renderResult(hintsUsed, isFinal, false);
}

const FAIL_PENALTY = 10;

function failRound() {
  // 제출 기회(3번)를 다 썼을 때 - 등급은 F로 고정하고 정답을 공개한 뒤 다음
  // 선수로 넘어간다. 힌트를 거의 안 열어본 채로 실패해도 누적 힌트가 낮게
  // 잡혀 최종 등급이 부풀려지지 않도록, 누적 힌트에 페널티를 더한다.
  const s = state;
  const hintsUsed = currentHintCount(s);
  s.totalHints += hintsUsed + FAIL_PENALTY;
  s.history.push({ player: s.player, hintsUsed, failed: true });
  markSeen(s.player.id);
  const isFinal = s.idx + 1 >= s.players.length;
  renderResult(hintsUsed, isFinal, true);
}

function renderResult(hintsUsed, isFinal, failed) {
  const s = state;
  const p = s.player; // 방금 맞춘(또는 실패한) 선수
  const grade = failed ? { text: "F", label: "실패했어요" } : gradeFor(hintsUsed);

  if (!isFinal) {
    // 5명 중 한 명을 맞힐 때마다 그 선수의 점수를 바로 보여주고, 다음 선수로 넘어간다.
    render(`
      <div class="game-screen">
        <div class="topbar">
          <button class="backbtn" id="backBtn">← 처음으로</button>
          <div class="score-pill">${s.idx + 1} / ${s.players.length}번째 완료 · 누적 힌트 <b>${s.totalHints}</b></div>
        </div>
        <div class="result-card">
          <img src="${deobfuscate(p.profile.photoUrlEnc)}" onerror="this.style.display='none'">
          <div class="name">${failed ? "😢 실패! 정답은 " : "정답: "}${escapeHtml(deobfuscate(p.profile.nameKoEnc))}</div>
          <div class="grade">${grade.text}<small>${hintsUsed}${failed ? ` (+${FAIL_PENALTY} 페널티)` : ""} 힌트 사용 · ${grade.label}</small></div>
        </div>
        <div class="btn-row">
          <button class="primary" id="nextBtn">다음 선수 (${s.idx + 2}/${s.players.length})</button>
        </div>
      </div>
    `);
    document.getElementById("backBtn").onclick = renderHome;
    document.getElementById("nextBtn").onclick = () => {
      s.idx += 1;
      s.player = s.players[s.idx];
      s.revealed = []; s.stageIdx = {}; s.guessesLeft = MAX_GUESSES;
      s.hints = buildHints(s.player);
      renderGame();
    };
    return;
  }

  const avg = (s.totalHints / s.players.length).toFixed(1);
  window.FSPoints?.earn("classic",
    s.history.reduce((t, h) => t + (h.failed ? 0 : Math.min(16, Math.max(4, 18 - 2 * h.hintsUsed))), 0),
    `${s.history.filter(h => !h.failed).length}/${s.players.length} 정답 · 평균 힌트 ${avg}`);
  const finalGrade = gradeFor(Math.round(s.totalHints / s.players.length));
  const streakHtml = `<div class="streak-list">${s.history.map(h =>
    `<div><span>${escapeHtml(deobfuscate(h.player.profile.nameKoEnc))}${h.failed ? ' (실패)' : ''}</span><span>${h.hintsUsed}${h.failed ? `+${FAIL_PENALTY}` : ''} 힌트</span></div>`).join("")}</div>`;

  render(`
    <div class="game-screen">
      <div class="topbar">
        <button class="backbtn" id="backBtn">← 처음으로</button>
        <div></div>
      </div>
      <div class="result-card">
        <div class="name">🎉 ${s.players.length}명 완료!</div>
        <div class="grade">${finalGrade.text}<small>총 ${s.totalHints} 힌트 (평균 ${avg})</small></div>
        ${streakHtml}
      </div>
      <div class="nick-row">
        <input id="nickInput" maxlength="20" placeholder="닉네임 (리더보드 등록)">
        <button id="submitScoreBtn">기록 등록</button>
      </div>
      <div id="lbBox"></div>
      <div class="btn-row">
        <button class="primary" id="nextBtn">다시 하기</button>
        <button id="homeBtn">처음으로</button>
      </div>
    </div>
  `);
  document.getElementById("backBtn").onclick = renderHome;
  document.getElementById("homeBtn").onclick = renderHome;
  document.getElementById("nextBtn").onclick = startGame;

  const lbPath = ["guessLeaderboard", "streak", "entries"];
  document.getElementById("submitScoreBtn").onclick = async () => {
    const nickname = (document.getElementById("nickInput").value || "익명").slice(0, 20);
    const btn = document.getElementById("submitScoreBtn");
    btn.disabled = true; btn.textContent = "등록 중…";
    try {
      const improved = await submitScore(lbPath, deviceId(), s.totalHints, nickname);
      await renderLeaderboard(lbPath);
      rankBonus("classic", improved, () => fetchLeaderboard(lbPath, 10));
      btn.textContent = "등록 완료";
